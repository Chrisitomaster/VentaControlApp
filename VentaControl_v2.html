      className:'btn btn-primary',
      style:{width:'100%',justifyContent:'center',padding:'14px',fontSize:'1rem',marginBottom:'var(--gap)',borderRadius:'var(--radius)'},
      onClick:()=>navigate('gridmap',{edif})
    },['🗺 Ver Mapa Completo de Ventanas']),

    // Stats — 1 solo porcentaje neto
    h('div',{className:'stats-row'},[
      statBox(s.instaladasNeto+'/'+s.total,'Inst. Neto'),
      statBox(s.pctReal+'%','% Avance'),
      s.quitar?statBox(s.quitar.toString(),'A Quitar'):null,
      s.actionsPending?statBox(s.actionsPending.toString(),'Acciones'):null,
    ].filter(Boolean)),
    h('div',{className:'pbar',style:{marginBottom:'var(--gap)'}},[h('div',{className:'pbar-fill green',style:{width:s.pctReal+'%'}})]),

    // Resumen de pendientes: solo totales
    (()=>{
      const noInst=s.pendientes+s.noInstalada+s.quitar;
      if(noInst===0)return h('div',{className:'card'},[
        h('div',{style:{fontWeight:'600',fontSize:'0.85rem',marginBottom:'4px'}},['Resumen de Pendientes']),
        h('div',{style:{color:'var(--ac-green)',fontSize:'0.82rem',fontWeight:'600'}},['✓ Todas las ventanas instaladas correctamente']),
      ]);
      return h('div',{className:'card'},[
        h('div',{style:{fontWeight:'600',fontSize:'0.85rem',marginBottom:'10px'}},['Resumen de Pendientes']),
        h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}},[
          s.pendientes?h('span',{className:'badge badge-orange',style:{fontSize:'0.82rem',padding:'6px 10px'}},[s.pendientes+' pendiente'+(s.pendientes!==1?'s':'')]):null,
          s.noInstalada?h('span',{className:'badge',style:{fontSize:'0.82rem',padding:'6px 10px'}},[s.noInstalada+' sin instalar']):null,
          s.quitar?h('span',{className:'badge badge-red',style:{fontSize:'0.82rem',padding:'6px 10px'}},[s.quitar+' a quitar']):null,
          s.sinVentana?h('span',{className:'badge',style:{fontSize:'0.82rem',padding:'6px 10px',color:'var(--tx-2)'}},[s.sinVentana+' sin ventana']):null,
        ].filter(Boolean)),
      ]);
    })(),

    // Building stage tracker — 3 EIFS phases with sub-items + fechas (v2.26)
    h('div',{className:'card'},[
      h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'10px',flexWrap:'wrap',gap:'6px'}},[
        h('div',{style:{fontWeight:'600',fontSize:'0.9rem'}},['Etapas EIFS']),
        (()=>{
          const si=bData.stageItems||{};
          const sp=bData.stagePlan||{};
          const sr=bData.stageReal||{};
          const totalItems=EIFS_PHASES.reduce((s,p)=>s+p.items.length,0);
          const doneItems=Object.values(si).filter(Boolean).length;
          // Contar atrasados
          const allItems=EIFS_PHASES.flatMap(p=>p.items);
          let overdue=0,next=null,nextPlan=null;
          allItems.forEach(it=>{
            const status=eifsStatus(sp[it.id]||'',sr[it.id]||'',si[it.id]||false);
            if(status==='overdue')overdue++;
            if(status==='scheduled'){
              const plan=sp[it.id];
              if(!nextPlan||plan<nextPlan){nextPlan=plan;next=it;}
            }
          });
          return h('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap',justifyContent:'flex-end'}},[
            doneItems>0?h('span',{className:'badge badge-blue',style:{fontSize:'0.7rem'}},[`${doneItems}/${totalItems}`]):h('span',{className:'badge badge-orange',style:{fontSize:'0.7rem'}},['Sin iniciar']),
            overdue?h('span',{className:'badge badge-red',style:{fontSize:'0.7rem'}},[`⚠ ${overdue} atrasado${overdue>1?'s':''}`]):null,
            next?h('span',{className:'badge badge-blue',style:{fontSize:'0.7rem'},title:next.label},[`📅 Próx: ${nextPlan}`]):null,
          ].filter(Boolean));
        })(),
      ]),
      // Progress bar
      h('div',{className:'pbar',style:{marginBottom:'10px'}},[
        h('div',{className:'pbar-fill green',style:{width:pct(Object.values(bData.stageItems||{}).filter(Boolean).length,EIFS_PHASES.reduce((s,p)=>s+p.items.length,0))+'%'}})
      ]),
      // Phases
      ...EIFS_PHASES.map(phase=>{
        const si=bData.stageItems||{};
        const phaseDone=phase.items.every(it=>si[it.id]);
        const phasePartial=phase.items.some(it=>si[it.id]);
        return h('div',{style:{marginBottom:'8px',border:'1px solid '+(phaseDone?'var(--ac-green)':phasePartial?'var(--ac-orange)':'var(--border)'),borderRadius:'var(--radius-sm)',overflow:'hidden'}},[
          // Phase header
          h('div',{style:{
            display:'flex',alignItems:'center',gap:'10px',padding:'10px 12px',
            background:phaseDone?'var(--ac-green-soft)':phasePartial?'var(--ac-orange-soft)':'var(--bg-2)',
            fontWeight:'600',fontSize:'0.85rem',
            color:phaseDone?'var(--ac-green)':phasePartial?'var(--ac-orange)':'var(--tx-1)'
          }},[
            h('span',{style:{fontSize:'1rem'}},[phaseDone?'✓':phasePartial?'◷':'○']),
            h('span',{style:{flex:1}},[phase.label]),
            h('span',{style:{fontSize:'0.75rem',color:'var(--tx-2)'}},
              [phase.items.filter(it=>si[it.id]).length+'/'+phase.items.length]),
          ]),
          // Sub-items con fechas plan/real (v2.26)
          ...phase.items.map(it=>{
            const done=si[it.id]||false;
            const sp=bData.stagePlan||{};
            const sr=bData.stageReal||{};
            const plan=sp[it.id]||'';
            const real=sr[it.id]||'';
            const status=eifsStatus(plan,real,done);
            const badge=eifsStatusBadge(status);
            // Estilo del fondo según status
            const bgMap={'on-time':'var(--ac-green-soft)','late-done':'var(--ac-orange-soft)','done-no-plan':'var(--ac-cyan-soft)','overdue':'var(--ac-red-soft)','scheduled':'var(--ac-blue-soft)','no-plan':'transparent'};
            return h('div',{
              style:{
                display:'flex',flexDirection:'column',gap:'4px',padding:'8px 12px 8px 24px',
                borderTop:'1px solid var(--border)',
                background:bgMap[status]||'transparent',
              }
            },[
              // Fila 1: checkbox + label + status badge
              h('div',{
                style:{display:'flex',alignItems:'center',gap:'10px',cursor:isEditor()?'pointer':'default'},
                onClick:()=>{
                  if(!isEditor())return;
                  if(!DATA.buildings[bKey(edif)])DATA.buildings[bKey(edif)]={comment:'',accionesPendientes:{},stage:0};
                  const bd=DATA.buildings[bKey(edif)];
                  if(!bd.stageItems)bd.stageItems={};
                  if(!bd.stageReal)bd.stageReal={};
                  const newDone=!done;
                  bd.stageItems[it.id]=newDone;
                  // Auto-set fecha real al marcar; limpiar al desmarcar
                  if(newDone&&!bd.stageReal[it.id])bd.stageReal[it.id]=todayISO();
                  else if(!newDone)delete bd.stageReal[it.id];
                  saveLocal();
                  renderBuilding();
                }
              },[
                h('div',{style:{
                  width:'22px',height:'22px',borderRadius:'4px',display:'flex',alignItems:'center',justifyContent:'center',
                  fontSize:'0.75rem',fontWeight:'700',flexShrink:0,
                  background:done?'var(--ac-green)':'var(--bg-3)',
                  color:done?'#fff':'var(--tx-2)',border:done?'none':'1px solid var(--border)'
                }},[done?'✓':'']),
                h('div',{style:{flex:1,fontSize:'0.8rem',color:done?'var(--ac-green)':'var(--tx-1)'}},[it.label]),
                badge.color?h('span',{className:'badge badge-'+badge.color,style:{fontSize:'0.65rem',padding:'2px 6px'},title:badge.label},[badge.sym+' '+badge.label]):null,
              ].filter(Boolean)),
              // Fila 2: inputs de fecha (solo editor o lectura)
              h('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap',fontSize:'0.7rem',color:'var(--tx-2)',paddingLeft:'32px'},onClick:(ev)=>ev.stopPropagation()},[
                h('label',{style:{display:'flex',alignItems:'center',gap:'4px'}},[
                  '📅 Plan:',
                  isEditor()?h('input',{type:'date',value:plan,
                    style:{padding:'2px 4px',fontSize:'0.7rem',border:'1px solid var(--border)',borderRadius:'4px',background:'var(--bg-2)',color:'var(--tx-1)'},
                    onChange:(e)=>{
                      if(!DATA.buildings[bKey(edif)])DATA.buildings[bKey(edif)]={comment:'',accionesPendientes:{},stage:0};
                      const bd=DATA.buildings[bKey(edif)];
                      if(!bd.stagePlan)bd.stagePlan={};
                      if(e.target.value)bd.stagePlan[it.id]=e.target.value;
                      else delete bd.stagePlan[it.id];
                      saveLocal();
                      renderBuilding();
                    }
                  }):h('span',{style:{fontFamily:'var(--font-mono)'}},[plan||'—']),
                ]),
                h('label',{style:{display:'flex',alignItems:'center',gap:'4px'}},[
                  '🏁 Real:',
                  isEditor()?h('input',{type:'date',value:real,
                    style:{padding:'2px 4px',fontSize:'0.7rem',border:'1px solid var(--border)',borderRadius:'4px',background:'var(--bg-2)',color:'var(--tx-1)'},
                    onChange:(e)=>{
                      if(!DATA.buildings[bKey(edif)])DATA.buildings[bKey(edif)]={comment:'',accionesPendientes:{},stage:0};
                      const bd=DATA.buildings[bKey(edif)];
                      if(!bd.stageReal)bd.stageReal={};
                      if(e.target.value){
                        bd.stageReal[it.id]=e.target.value;
                        // Si setean fecha real, también marcar done
                        if(!bd.stageItems)bd.stageItems={};
                        bd.stageItems[it.id]=true;
                      } else {
                        delete bd.stageReal[it.id];
                      }
                      saveLocal();
                      renderBuilding();
                    }
                  }):h('span',{style:{fontFamily:'var(--font-mono)'}},[real||'—']),
                ]),
              ]),
            ]);
          }),
        ]);
      }),
    ]),

    // ── Conteo físico de ventanas en acopio (inventario terreno) ──
    (()=>{
      const cf=getConteoFisico(edif);
      const codes=getBldgWindowCodes(edif);
      const total=conteoTotal(cf);
      // Badge y fecha se actualizan in-place; NO se re-renderiza la vista al
      // tocar un stepper, para no perder la posición de scroll.
      const badgeTotal=h('span',{className:'badge '+(total?'badge-blue':'badge-orange'),style:{fontSize:'0.7rem'}},[total?total+' contadas':'Sin contar']);
      const spanFecha=h('span',{style:{fontSize:'0.68rem',color:'var(--tx-2)'}},[cf.fecha||'']);
      const refreshBadge=()=>{
        const t=conteoTotal(getConteoFisico(edif));
        badgeTotal.textContent=t?t+' contadas':'Sin contar';
        badgeTotal.className='badge '+(t?'badge-blue':'badge-orange');
        spanFecha.textContent=getConteoFisico(edif).fecha||'';
      };
      return h('div',{className:'card'},[
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px',flexWrap:'wrap',gap:'6px'}},[
          h('div',{style:{fontWeight:'600',fontSize:'0.9rem'}},['📦 Ventanas en acopio']),
          h('div',{style:{display:'flex',gap:'5px',alignItems:'center'}},[badgeTotal,spanFecha]),
        ]),
        h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',marginBottom:'8px'}},[
          'Unidades físicas presentes en la torre, sin instalar. Se usa para el pedido a oficina técnica.'
        ]),
        isEditor()?h('div',{},codes.map(({code,loc})=>{
          const qty=cf.items[code]||0;
          return h('div',{className:'conteo-row'},[
            h('span',{className:'conteo-code'},[code]),
            h('span',{className:'conteo-loc'},[loc]),
            stepper(qty,(n)=>{setConteoItem(edif,code,n);refreshBadge();}),
          ]);
        })):h('div',{},codes.filter(({code})=>cf.items[code]).map(({code,loc})=>
          h('div',{className:'conteo-row'},[
            h('span',{className:'conteo-code'},[code]),
            h('span',{className:'conteo-loc'},[loc]),
            h('span',{style:{fontFamily:'var(--font-mono)',fontWeight:'700'}},[String(cf.items[code])]),
          ])
        )),
        isEditor()?h('textarea',{
          className:'obs-area',id:'conteo-nota',style:{marginTop:'8px',minHeight:'44px',fontSize:'0.8rem'},
          placeholder:'Nota del conteo (ubicación del acopio, observaciones...)',
          onBlur:(e)=>{const cf2=getConteoFisico(edif);if(cf2.nota!==e.target.value){cf2.nota=e.target.value;saveLocalNow();}}
        }):(cf.nota?h('div',{style:{marginTop:'8px',fontSize:'0.78rem',color:'var(--tx-1)',fontStyle:'italic'}},['💬 '+cf.nota]):null),
        (isEditor()&&total>0)?h('button',{className:'btn btn-sm btn-ghost',style:{marginTop:'8px',color:'var(--ac-red)'},
          onClick:()=>{
            if(!confirm('¿Poner en cero todo el conteo de este edificio?'))return;
            const cf2=getConteoFisico(edif);cf2.items={};cf2.fecha=todayISO();saveLocalNow();renderBuilding();
          }
        },['🗑 Reiniciar conteo']):null,
      ].filter(Boolean));
    })(),

    // Quick nav buttons row
    h('div',{style:{display:'flex',gap:'6px',marginBottom:'var(--gap)',flexWrap:'wrap'}},[
      h('button',{className:'btn btn-sm btn-ghost',style:{color:'var(--ac-cyan)'},onClick:()=>navigate('inventario',{edif})},['📦 Inventario']),
      h('button',{className:'btn btn-sm btn-ghost',style:{color:'var(--ac-red)'},onClick:()=>navigate('danos',{edif})},['💥 Daños críticos']),
      h('button',{className:'btn btn-sm btn-ghost',onClick:()=>navigate('report',{edif})},['📄 Informe']),
      isEditor()?h('button',{className:'btn btn-sm btn-ghost',onClick:()=>showBulkModal('building',{edif})},['⚡ Cambio masivo']):null,
      isEditor()?h('button',{className:'btn btn-sm btn-ghost',style:{color:'var(--ac-orange)'},onClick:()=>showCambioCondicional('building',{edif})},['⚡ Por estado']):null,
      isEditor()?h('button',{className:'btn btn-sm btn-ghost',style:{color:'var(--ac-red)'},onClick:()=>confirmClearBuilding(edif)},['🗑 Limpiar edificio']):null,
    ].filter(Boolean)),

    // Floor grid
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',marginBottom:'8px',fontSize:'0.85rem'}},['Estado por Departamento']),
      ...([1,2,3,4,5].map(f=>{
        return h('div',{},[
          h('div',{className:'floor-label'},['Piso '+f]),
          h('div',{className:'grid-4'},[
            ...[0,1,2,3].map(p=>{
              const dn=deptNum(f,p);
              const tipo=getDeptType(edif,f,p);
              const st=getDeptStats(edif,dn);
              let cls='dept-cell';
              if(st.instaladas===st.total)cls+=' complete';
              else if(st.instaladas>0)cls+=' partial';
              if(st.defCount>0)cls+=' has-issues';
              return h('div',{className:cls,onClick:()=>navigate('dept',{edif,depto:dn})},[
                h('div',{className:'dept-num'},[dn.toString()]),
                h('div',{className:'dept-info'},[`${tipo} · ${st.instaladas}/${st.total}`]),
                (st.defCount||st.actionsPending)?h('div',{style:{display:'flex',gap:'4px',justifyContent:'center',marginTop:'4px',flexWrap:'wrap'}},[
                  st.defCount?h('span',{className:'badge badge-red',style:{fontSize:'0.65rem',padding:'2px 5px'}},[st.defCount+' def']):null,
                  st.actionsPending?h('span',{className:'badge badge-orange',style:{fontSize:'0.65rem',padding:'2px 5px'}},[st.actionsPending+' acc']):null,
                ].filter(Boolean)):null,
              ].filter(Boolean));
            }),
          ]),
        ]);
      })),
    ]),

    // Common areas — improved view with quick status
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',marginBottom:'8px',fontSize:'0.9rem'}},['Espacios Comunes']),
      ...[1,2,3,4,5].flatMap(f=>{
        const cw=getCommonWindows(f);
        return [
          h('div',{className:'ec-floor-sep'},[
            h('span',{className:'ec-floor-sep-label'},['Piso '+f]),
            h('div',{className:'ec-floor-sep-line'},[]),
          ]),
          ...cw.map(([code])=>{
            const wk=wKey(edif,`EC${f}`,code);
            const w=DATA.windows[wk];
            const loc=code==='PV1'?'Mampara Acceso':code==='PV2'?'Mampara Trasera':code==='V8'?'Ventanal Escalera':'Ventana Escalera';
            const hasD=w&&Object.values(w.deficiencias).some(v=>v);
            const activeDefIcons=w?DEFICIENCIES.filter(d=>w.deficiencias[d.id]):[];
            return h('div',{style:{padding:'8px 0',borderBottom:'1px solid var(--border)'}},[
              h('div',{style:{display:'flex',alignItems:'center',gap:'8px',cursor:'pointer'},
                onClick:()=>navigate('common',{edif,floor:f,code})},[
                h('span',{className:'win-code',style:{fontSize:'0.9rem'}},[code]),
                h('span',{className:'win-loc',style:{fontSize:'0.8rem'}},[loc]),
                h('span',{style:{flex:1}}),
                renderEstadoMini(w?w.estado:'noInstalada'),
                w?.estadoVano?h('span',{className:'badge badge-cyan',style:{fontSize:'0.65rem'}},[w.estadoVano+(w.separacionMm?' '+w.separacionMm+'mm':'')]):null,
              ]),
              // Quick status buttons for common areas (editor only)
              isEditor()?h('div',{style:{display:'flex',gap:'4px',marginTop:'6px',flexWrap:'wrap'}},
                ESTADOS.map(e=>h('div',{
                  className:'estado-opt'+(w&&w.estado===e.id?' '+e.cls:''),
                  style:{padding:'4px 10px',fontSize:'0.75rem'},
                  onClick:(ev)=>{
                    ev.stopPropagation();
                    updateWindow(wk,'estado',e.id,`Estado: ${w?.estado||'—'} → ${e.id}`);
                    renderBuilding();
                  }
                },[e.sym+' '+e.label]))
              ):null,
              w?.observaciones?h('div',{style:{
                marginTop:'5px',padding:'3px 8px',borderRadius:'var(--radius-sm)',
                background:'var(--ac-orange-soft)',borderLeft:'3px solid var(--ac-orange)',
                fontSize:'0.76rem',color:'var(--tx-1)',
              }},[
                h('span',{style:{fontWeight:'600',color:'var(--ac-orange)',marginRight:'4px'}},['💬']),
                w.observaciones.slice(0,70)+(w.observaciones.length>70?'…':''),
              ]):null,
              hasD?h('div',{style:{marginTop:'3px',paddingLeft:'4px',display:'flex',gap:'3px',flexWrap:'wrap'}},[
                ...activeDefIcons.map(d=>h('span',{title:d.label,style:{fontSize:'0.85rem'}},[d.icon])),
              ]):null,
            ].filter(Boolean));
          }),
        ];
      }),
    ]),

    // Type counts table
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',marginBottom:'4px',fontSize:'0.9rem'}},['Por Tipo (Edif. '+edif+')']),
      renderTypeTable(s.tipoCounts),
    ]),

    // Corrective actions summary — expandido
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',marginBottom:'10px',fontSize:'0.9rem'}},['Acciones Correctivas — Edif. '+edif]),
      renderActionsPanel(collectActions(edif,edif),'Edif. '+edif,false,'building',{edif}),
    ]),

    // Informes rápidos por acción correctiva
    (()=>{
      const actionItems=ACTIONS.map(a=>{
        let cnt=0;
        forEachWindowInBldg(edif, w=>{ if(w&&w.acciones[a.id]?.active&&!w.acciones[a.id]?.done) cnt++; });
        return cnt>0?{a,cnt}:null;
      }).filter(Boolean);
      if(!actionItems.length)return null;
      return h('div',{className:'card'},[
        h('div',{style:{fontWeight:'600',marginBottom:'8px',fontSize:'0.9rem'}},['📋 Informes por Acción Correctiva']),
        h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},
          actionItems.map(({a,cnt})=>h('button',{
            className:'btn btn-ghost',
            style:{justifyContent:'flex-start',gap:'10px',fontSize:'0.85rem'},
            onClick:()=>navigate('actionReport',{edif,actionId:a.id,backView:'building',backParams:{edif}})
          },[
            h('span',{},[a.icon]),
            h('span',{style:{flex:1}},[a.label]),
            h('span',{className:'badge badge-orange',style:{fontSize:'0.75rem'}},[cnt+' pend.']),
            h('span',{style:{color:'var(--tx-2)',fontSize:'0.8rem'}},['ver informe →']),
          ]))
        ),
      ]);
    })(),

    renderSyncBar(),
  ].filter(Boolean));
  app().innerHTML='';
  app().appendChild(el);
  const ta=$('#bld-comment-ta',app());
  if(ta)ta.value=bData.comment||'';
}

// Quick-estado picker triggered by long-press on grid tile
function showQuickEstado(key,code,deptoLabel,currentEstado,onDone,navView,navParams){
  const overlay=document.createElement('div');
  overlay.className='overlay';
  closeOverlayOnBackdrop(overlay);
  const modal=h('div',{className:'modal'},[
    h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'14px'}},[
      h('div',{style:{fontFamily:'var(--font-mono)',fontWeight:'700',fontSize:'0.9rem'}},[code]),
      h('span',{style:{fontSize:'0.78rem',color:'var(--tx-2)'}},[deptoLabel]),
    ]),
    h('div',{style:{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:'8px',marginBottom:'12px'}},[
      ...ESTADOS.map(est=>{
        const isCurrent=currentEstado===est.id;
        return h('div',{
          className:'estado-opt'+(isCurrent?' '+est.cls:''),
          style:{padding:'12px 8px',fontSize:'0.85rem',textAlign:'center',cursor:'pointer',borderRadius:'var(--radius-sm)'},
          onClick:()=>{
            updateWindow(key,'estado',est.id,`Estado: ${currentEstado} → ${est.id}`);
            overlay.remove();
            onDone();
          }
        },[est.sym+' '+est.label]);
      })
    ]),
    navView?h('button',{className:'btn btn-sm btn-ghost',style:{width:'100%'},onClick:()=>{overlay.remove();navigate(navView,navParams);}},['Ver perfil completo →']):null,
  ]);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

// Estado de filtros en el mapa (mutuamente exclusivos)
let gridMapActionFilter=null;
let gridMapEstadoFilter=null;
let gridMapDefFilter=null;
function gridMapClearFilters(){gridMapActionFilter=null;gridMapEstadoFilter=null;gridMapDefFilter=null;}

function renderGridMap(){
  const edif=viewParams.edif;
  const s=getBldgStats(edif);

  // Color maps compartidos
  const {estadoBg, estadoBorder, estadoText, actionColorMap} = WINDOW_COLOR_MAPS;

  function winTile(key,code,navView,navParams){
    const w=DATA.windows[key];
    const estado=(w&&w.estado)||'noInstalada';
    // Find first active+undone action
    let primaryAct=null;
    if(w&&w.acciones){
      primaryAct=ACTIONS.find(a=>w.acciones[a.id]?.active&&!w.acciones[a.id]?.done)||null;
    }
    // Filtros activos (mutuamente exclusivos)
    const hasFilterAction=gridMapActionFilter&&w&&w.acciones[gridMapActionFilter]?.active&&!w.acciones[gridMapActionFilter]?.done;
    const hasFilterEstado=gridMapEstadoFilter&&estado===gridMapEstadoFilter;
    const hasFilterDef=gridMapDefFilter&&w&&w.deficiencias[gridMapDefFilter];
    const anyFilter=gridMapActionFilter||gridMapEstadoFilter||gridMapDefFilter;
    const filteredOut=anyFilter&&!hasFilterAction&&!hasFilterEstado&&!hasFilterDef;

    const style={};
    if(hasFilterAction){
      // Highlight fuerte para la acción filtrada
      const fAct=ACTIONS.find(a=>a.id===gridMapActionFilter);
      const ac=fAct?fAct.color:'blue';
      style.background=`var(--ac-${ac}-soft)`;
      style.borderColor=`var(--ac-${ac})`;
      style.color=`var(--ac-${ac})`;
      style.borderWidth='2px';
    } else if(hasFilterEstado){
      // Highlight estado filtrado — borde más grueso
      style.background=estadoBg[estado];
      style.borderColor=estadoBorder[estado];
      style.color=estadoText[estado];
      style.borderWidth='3px';
    } else if(hasFilterDef){
      // Highlight deficiencia filtrada — borde rojo grueso
      style.background='var(--ac-red-soft)';
      style.borderColor='var(--ac-red)';
      style.color='var(--ac-red)';
      style.borderWidth='3px';
    } else if(primaryAct&&!anyFilter){
      const ac=actionColorMap[primaryAct.id]||'blue';
      style.background=`linear-gradient(to right,${estadoBg[estado]} 50%,var(--ac-${ac}-soft) 50%)`;
      style.borderColor=`var(--ac-${ac})`;
      style.color=estadoText[estado];
    } else {
      style.background=estadoBg[estado];
      style.borderColor=estadoBorder[estado];
      style.color=estadoText[estado];
    }
    if(filteredOut){style.opacity='0.18';}
    // Build tile element manually to attach touch events
    const el=document.createElement('div');
    el.className='win-tile';
    Object.assign(el.style,style);
    el.textContent=code;
    // Franja inferior: una banda de color por deficiencia activa.
    // Más bandas = ventana más crítica. Las críticas van en rojo.
    const defs=defsDeVentana(w);
    if(defs.length){
      const banda=document.createElement('span');
      banda.className='win-tile-defs';
      const paso=100/defs.length;
      banda.style.background='linear-gradient(to right,'+defs.map((d,i)=>
        d.color+' '+(i*paso).toFixed(2)+'% '+((i+1)*paso).toFixed(2)+'%').join(',')+')';
      banda.title=defs.map(d=>d.label).join(' · ');
      el.appendChild(banda);
      if(defs.length>=2){
        const cnt=document.createElement('span');
        cnt.className='win-tile-defcount';
        cnt.textContent=String(defs.length);
        cnt.title=defs.length+' inconformidades';
        el.appendChild(cnt);
      }
      if(defs.some(d=>d.critico))el.style.borderColor='var(--ac-red)';
    }
    // Marca 💬 si la ventana tiene observaciones cargadas en su perfil
    if(w&&w.observaciones&&String(w.observaciones).trim()){
      const nota=document.createElement('span');
      nota.className='win-tile-note';
      nota.textContent='💬';
      nota.title=String(w.observaciones).slice(0,120);
      el.appendChild(nota);
    }

    let pressTimer=null;
    let longFired=false;
    let touchHandled=false;
    let scrolled=false;
    let startX=0,startY=0;

    el.addEventListener('touchstart',(e)=>{
      longFired=false;
      touchHandled=false;
      scrolled=false;
      startX=e.touches[0].clientX;
      startY=e.touches[0].clientY;
      pressTimer=setTimeout(()=>{
        if(scrolled)return;
        longFired=true;
        touchHandled=true;
        navigator.vibrate&&navigator.vibrate(50);
        const deptoLabel=navParams.depto!==undefined?String(navParams.depto):`EC${navParams.floor}`;
        showQuickEstado(key,code,deptoLabel,estado,()=>renderGridMap(),navView,navParams);
      },450);
    },{passive:true});

    el.addEventListener('touchmove',(e)=>{
      const dx=Math.abs(e.touches[0].clientX-startX);
      const dy=Math.abs(e.touches[0].clientY-startY);
      if(dx>10||dy>10){scrolled=true;clearTimeout(pressTimer);}
    },{passive:true});

    el.addEventListener('touchend',()=>{
      clearTimeout(pressTimer);
      if(!longFired&&!scrolled){touchHandled=true;navigate(navView,navParams);}
    },{passive:true});

    // Prevent text-selection popup on long-press
    el.addEventListener('contextmenu',(e)=>e.preventDefault());

    // Desktop fallback
    el.addEventListener('click',()=>{
      if(!touchHandled&&!scrolled)navigate(navView,navParams);
      touchHandled=false;
      longFired=false;
      scrolled=false;
    });
    return el;
  }

  const legend=h('div',{className:'grid-map-legend'},[
    ...ESTADOS.map(est=>h('div',{className:'legend-item'},[
      h('div',{className:'legend-dot',style:{background:estadoBg[est.id],borderColor:estadoBorder[est.id]}},[]),
      est.label
    ])),
    h('div',{className:'legend-item'},[
      h('div',{className:'legend-dot-split',style:{
        background:'linear-gradient(to right,var(--ac-green-soft) 50%,var(--ac-purple-soft) 50%)',
        border:'1px solid var(--ac-purple)'
      }},[]),
      'Con acción correctiva'
    ]),
    h('div',{className:'legend-item'},[
      h('span',{style:{fontSize:'0.7rem'}},['💬']),
      'Con observaciones'
    ]),
    h('div',{className:'legend-item'},[
      h('span',{style:{width:'22px',height:'7px',borderRadius:'2px',flexShrink:0,
        background:'linear-gradient(to right,var(--ac-red) 0% 34%,var(--ac-purple) 34% 67%,var(--ac-cyan) 67% 100%)'}},[]),
      'Franja inferior: una banda por inconformidad (rojo = daño crítico)'
    ]),
  ]);

  const floorSections=[1,2,3,4,5].map(f=>{
    const fs=getFloorStats(edif,f);
    const deptoCols=[0,1,2,3].map(p=>{
      const tipo=getDeptType(edif,f,p);
      const dn=deptNum(f,p);
      const wins=getDeptWindows(tipo);
      return h('div',{className:'grid-map-col'},[
        h('div',{className:'grid-map-col-hdr'},[String(dn)]),
        ...wins.map(([code,loc])=>winTile(wKey(edif,dn,code),code,'window',{edif,depto:dn,code,loc,backView:'gridmap',backParams:{edif}}))
      ]);
    });
    const cw=getCommonWindows(f);
    const commonCol=h('div',{className:'grid-map-col ec-col'},[
      h('div',{className:'grid-map-col-hdr'},[`EC${f}`]),
      ...cw.map(([code,loc])=>winTile(wKey(edif,`EC${f}`,code),code,'common',{edif,floor:f,code,backView:'gridmap',backParams:{edif}}))
    ]);
    // Stats por piso
    const pctPiso=pct(fs.instaladas,fs.total);
    const floorStats=h('div',{style:{
      display:'flex',gap:'6px',flexWrap:'wrap',alignItems:'center',
      padding:'4px 8px',marginBottom:'6px',background:'var(--bg-2)',borderRadius:'var(--radius-sm)',fontSize:'0.72rem'
    }},[
      h('span',{style:{fontWeight:'700',color:'var(--ac-blue)',minWidth:'20px'}},['P'+f]),
      h('span',{style:{color:pctPiso>=100?'var(--ac-green)':pctPiso>0?'var(--ac-blue)':'var(--tx-2)',fontWeight:'600'}},[fs.instaladas+'/'+fs.total]),
      fs.pendientes?h('span',{className:'badge badge-orange',style:{fontSize:'0.65rem',padding:'2px 5px'}},[fs.pendientes+' pend.']):null,
      fs.noInstalada?h('span',{className:'badge',style:{fontSize:'0.65rem',padding:'2px 5px'}},[fs.noInstalada+' sin inst.']):null,
      fs.quitar?h('span',{className:'badge badge-red',style:{fontSize:'0.65rem',padding:'2px 5px'}},[fs.quitar+' quitar']):null,
      fs.actionsPending?h('span',{className:'badge badge-orange',style:{fontSize:'0.65rem',padding:'2px 5px'}},[fs.actionsPending+' acc.']):null,
    ].filter(Boolean));
    return h('div',{className:'grid-map-section'},[
      h('div',{className:'grid-map-floor-hdr'},[`Piso ${f}`]),
      floorStats,
      h('div',{className:'grid-map-cols'},[
        ...deptoCols,
        h('div',{className:'grid-map-col-sep'},[]),
        commonCol
      ])
    ]);
  });

  // Conteos por estado y deficiencia (single pass)
  const estadoCounts={};
  const defCounts={};
  ESTADOS.forEach(e=>{estadoCounts[e.id]=0;});
  DEFICIENCIES.forEach(d=>{defCounts[d.id]=0;});
  forEachWindowInBldg(edif, w=>{
    if(!w)return;
    if(estadoCounts[w.estado]!==undefined)estadoCounts[w.estado]++;
    DEFICIENCIES.forEach(d=>{if(w.deficiencias[d.id])defCounts[d.id]++;});
  });

  // Botones de filtro por acción correctiva
  const filterBtns=h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'10px'}},[
    h('button',{
      className:'btn btn-sm '+(!gridMapActionFilter&&!gridMapEstadoFilter&&!gridMapDefFilter?'btn-primary':'btn-ghost'),
      style:{fontSize:'0.72rem',padding:'5px 9px'},
      onClick:()=>{gridMapClearFilters();renderGridMap();}
    },['Todos']),
    ...ACTIONS.map(a=>{
      const isActive=gridMapActionFilter===a.id;
      // Contar cuántas ventanas tienen esta acción pendiente en este edificio
      let cnt=0;
      forEachWindowInBldg(edif, w=>{ if(w&&w.acciones[a.id]?.active&&!w.acciones[a.id]?.done) cnt++; });
      if(!cnt&&!isActive)return null;
      return h('button',{
        className:'btn btn-sm '+(isActive?'btn-primary':'btn-ghost'),
        style:{fontSize:'0.72rem',padding:'5px 9px'},
        onClick:()=>{gridMapClearFilters();gridMapActionFilter=isActive?null:a.id;renderGridMap();}
      },[a.icon+' '+a.label.slice(0,12)+(cnt?' ('+cnt+')':'')]);
    }).filter(Boolean),
  ]);

  // Botones de filtro por estado de ventana
  const estadoFilterBtns=h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'10px'}},[
    ...ESTADOS.map(e=>{
      const isActive=gridMapEstadoFilter===e.id;
      const cnt=estadoCounts[e.id]||0;
      if(!cnt&&!isActive)return null;
      return h('button',{
        className:'btn btn-sm '+(isActive?'btn-primary':'btn-ghost'),
        style:{fontSize:'0.72rem',padding:'5px 9px'},
        onClick:()=>{gridMapClearFilters();gridMapEstadoFilter=isActive?null:e.id;renderGridMap();}
      },[e.sym+' '+e.label+(cnt?' ('+cnt+')':'')]);
    }).filter(Boolean),
  ]);

  // Botones de filtro por deficiencia
  const defFilterBtns=h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'10px'}},[
    ...DEFICIENCIES.map(d=>{
      const isActive=gridMapDefFilter===d.id;
      const cnt=defCounts[d.id]||0;
      if(!cnt&&!isActive)return null;
      return h('button',{
        className:'btn btn-sm '+(isActive?'btn-primary':'btn-ghost'),
        style:{fontSize:'0.72rem',padding:'5px 9px'},
        onClick:()=>{gridMapClearFilters();gridMapDefFilter=isActive?null:d.id;renderGridMap();}
      },[d.icon+' '+d.label.slice(0,18)+(cnt?' ('+cnt+')':'')]);
    }).filter(Boolean),
  ]);
  const hasDefBtns=defFilterBtns.children.length>0;

  const el=h('div',{className:'fade-in'},[
    topbar(`Mapa — Edif. ${edif}`,'building',{edif}),
    h('div',{className:'card'},[
      // Totals summary — sin defCount
      h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'8px'}},[
        h('span',{className:'badge badge-green',style:{fontSize:'0.78rem',padding:'5px 8px'}},[`${s.instaladasNeto}/${s.total} inst. neto`]),
        s.pendientes?h('span',{className:'badge badge-orange',style:{fontSize:'0.78rem',padding:'5px 8px'}},[s.pendientes+' pendientes']):null,
        s.noInstalada?h('span',{className:'badge',style:{fontSize:'0.78rem',padding:'5px 8px'}},[s.noInstalada+' sin instalar']):null,
        s.quitar?h('span',{className:'badge badge-red',style:{fontSize:'0.78rem',padding:'5px 8px'}},[s.quitar+' quitar']):null,
        s.actionsPending?h('span',{className:'badge badge-orange',style:{fontSize:'0.78rem',padding:'5px 8px'}},[s.actionsPending+' acc']):null,
      ].filter(Boolean)),
      // Filtros — agrupados por categoría
      h('div',{style:{marginBottom:'8px'}},[
        h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',fontWeight:'600',marginBottom:'4px'}},['🔍 Filtrar por acción correctiva:']),
        filterBtns,
        h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',fontWeight:'600',marginBottom:'4px'}},['📊 Filtrar por estado de ventana:']),
        estadoFilterBtns,
        hasDefBtns?h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',fontWeight:'600',marginBottom:'4px'}},['⚠ Filtrar por deficiencia:']):null,
        hasDefBtns?defFilterBtns:null,
      ].filter(Boolean)),

/* ============================================
   MM PICKER (drum-roll scroll selector 1-50mm)
   ============================================ */
function showMmPicker(currentMm,label,onConfirm){
  // Inject webkit scrollbar-hide style once
  if(!document.getElementById('mm-drum-css')){
    const s=document.createElement('style');
    s.id='mm-drum-css';
    s.textContent='.mm-drum::-webkit-scrollbar{display:none}';
    document.head.appendChild(s);
  }
  const ITEM_H=48;
  const overlay=document.createElement('div');
  overlay.className='overlay';

  const modal=document.createElement('div');
  modal.className='modal';
  modal.style.cssText='max-width:260px;padding:24px 20px;text-align:center;';

  const title=document.createElement('div');
  title.style.cssText='font-weight:700;font-size:1rem;margin-bottom:2px;';
  title.textContent=label;

  const sub=document.createElement('div');
  sub.style.cssText='font-size:0.78rem;color:var(--tx-2);margin-bottom:16px;';
  sub.textContent='Separación en milímetros';

  // Wrapper with fade overlays
  const wrap=document.createElement('div');
  wrap.style.cssText=`position:relative;height:${ITEM_H*3}px;margin:0 auto;max-width:160px;overflow:hidden;border-radius:var(--radius-sm);`;

  const fadeTop=document.createElement('div');
  fadeTop.style.cssText=`position:absolute;top:0;left:0;right:0;height:${ITEM_H}px;background:linear-gradient(to bottom,var(--bg-1),transparent);z-index:3;pointer-events:none;`;

  const fadeBot=document.createElement('div');
  fadeBot.style.cssText=`position:absolute;bottom:0;left:0;right:0;height:${ITEM_H}px;background:linear-gradient(to top,var(--bg-1),transparent);z-index:3;pointer-events:none;`;

  const selBar=document.createElement('div');
  selBar.style.cssText=`position:absolute;top:${ITEM_H}px;left:0;right:0;height:${ITEM_H}px;border-top:2px solid var(--ac-blue);border-bottom:2px solid var(--ac-blue);background:var(--ac-blue-soft);z-index:1;pointer-events:none;`;

  // Drum scroll container
  const drum=document.createElement('div');
  drum.className='mm-drum';
  drum.style.cssText=`height:${ITEM_H*3}px;overflow-y:scroll;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;scrollbar-width:none;position:relative;z-index:2;`;

  // Top spacer
  const sp1=document.createElement('div');sp1.style.height=ITEM_H+'px';drum.appendChild(sp1);
  // 50 items
  for(let mm=1;mm<=50;mm++){
    const item=document.createElement('div');
    item.style.cssText=`height:${ITEM_H}px;display:flex;align-items:center;justify-content:center;font-size:1.15rem;font-weight:600;scroll-snap-align:center;color:var(--tx-0);`;
    item.textContent=mm+' mm';
    drum.appendChild(item);
  }
  // Bottom spacer
  const sp2=document.createElement('div');sp2.style.height=ITEM_H+'px';drum.appendChild(sp2);

  wrap.appendChild(selBar);
  wrap.appendChild(fadeTop);
  wrap.appendChild(fadeBot);
  wrap.appendChild(drum);

  // Init scroll position
  const initVal=Math.max(1,Math.min(50,parseInt(currentMm)||1));
  setTimeout(()=>{drum.scrollTop=(initVal-1)*ITEM_H;},60);

  function getVal(){return Math.min(50,Math.max(1,Math.round(drum.scrollTop/ITEM_H)+1));}

  // Buttons
  const btnRow=document.createElement('div');
  btnRow.style.cssText='display:flex;gap:8px;margin-top:20px;';

  const btnCancel=document.createElement('button');
  btnCancel.className='btn btn-ghost';btnCancel.style.flex='1';btnCancel.textContent='Cancelar';
  btnCancel.onclick=()=>overlay.remove();

  const btnOk=document.createElement('button');
  btnOk.className='btn btn-primary';btnOk.style.flex='1';btnOk.textContent='✓ Confirmar';
  btnOk.onclick=()=>{const val=getVal();overlay.remove();onConfirm(String(val));};

  btnRow.appendChild(btnCancel);btnRow.appendChild(btnOk);
  modal.appendChild(title);modal.appendChild(sub);modal.appendChild(wrap);modal.appendChild(btnRow);
  overlay.appendChild(modal);
  closeOverlayOnBackdrop(overlay);
  document.body.appendChild(overlay);
}

// Estado agregado de un depto: 'complete'|'partial'|'issues'|'allSinventana'|'empty'
function deptAggState(e, depto){
  const st = getDeptStats(e, depto);
  if(!st || st.total===0) return 'empty';
  if(st.defCount>0) return 'issues';
  // Si todas las ventanas son sinVentana (no quitar, no instalar)
  const e2 = parseInt(e);
  const floor = Math.floor(depto/100);
  const posIdx = (depto%100)-1;
  const tipo = getDeptType(e2, floor, posIdx);
  const wins = getDeptWindows(tipo);
  let allSin = wins.length>0;
  for(const [code] of wins){
    const w = DATA.windows[wKey(e2,depto,code)];
    if(!w || w.estado!=='sinVentana'){ allSin=false; break; }
  }
  if(allSin) return 'allSinventana';
  if(st.instaladas===st.total) return 'complete';
  if(st.instaladas>0) return 'partial';
  return 'empty';
}

function commonAggState(e, floor, code){
  const w = DATA.windows[wKey(e, `EC${floor}`, code)];
  if(!w) return 'empty';
  const hasDef = w.deficiencias && Object.values(w.deficiencias).some(v=>v);
  if(hasDef) return 'issue';
  if(w.estado==='instalada') return 'installed';
  return 'empty';
}

function renderPrintFloor(e, f, cfg, layout){
  const positions = (f===1) ? cfg.p1 : cfg.p25;
  const grid = h('div',{className:'grid'},[]);

  // Icono por estado con código de ventana
  function winIcon(w, code){
    const est = w?.estado || 'noInstalada';
    const map = {
      instalada:   {sym:'✓', cls:'wi-instalada'},
      pendiente:   {sym:'◷', cls:'wi-pendiente'},
      noInstalada: {sym:'✗', cls:'wi-noInstalada'},
      quitar:      {sym:'↩', cls:'wi-quitar'},
      sinVentana:  {sym:'▢', cls:'wi-sinVentana'},
    };
    const wc = map[est] || map.noInstalada;
    const hasDef = w && w.deficiencias && Object.values(w.deficiencias).some(v=>v);
    return h('span',{className:'wicon-wrap'},[
      h('span',{className:`wicon ${wc.cls}${hasDef?' wi-def':''}`,title:est+(hasDef?' · con defecto':'')},[wc.sym]),
      h('span',{className:'wi-label'},[code||'?']),
    ]);
  }

  layout.deptPositions.forEach((dp, idx)=>{
    const tipo = positions[idx];
    if(!tipo){
      grid.appendChild(h('div',{
        className:'print-cell dept empty',
        style:{ gridColumn:`${dp.col} / span ${dp.w}`, gridRow:`${dp.row} / span ${dp.h}` }
      },[h('div',{className:'sub'},['—'])]));
      return;
    }
    const dn = deptNum(f, idx);
    const st = getDeptStats(e, dn);
    const aggSt = deptAggState(e, dn);
    const wins = getDeptWindows(tipo);
    const iconRow = h('div',{className:'wicons-row'},
      wins.map(([code])=>winIcon(DATA.windows[wKey(e,dn,code)], code))
    );
    grid.appendChild(h('div',{
      className:`print-cell dept ${aggSt}`,
      style:{ gridColumn:`${dp.col} / span ${dp.w}`, gridRow:`${dp.row} / span ${dp.h}` }
    },[
      h('div',{className:'dept-head'},[
        h('span',{className:'num'},[`${dn}`]),
        h('span',{className:'sub'},[`${tipo}·${dp.mano}`]),
      ]),
      iconRow,
      h('div',{className:'sub dept-foot'},[
        `${st.instaladas}/${st.total}`,
        st.defCount>0 ? h('span',{className:'def-badge'},[` ⚠${st.defCount}`]) : null,
      ].filter(Boolean)),
    ]));
  });

  const centralWindows = (f===1) ? layout.accessPoints : layout.commonStairway;
  centralWindows.forEach(cw=>{
    const aggSt = commonAggState(e, f, cw.code);
    const w = DATA.windows[wKey(e, `EC${f}`, cw.code)];
    const cls = (f===1) ? 'access' : 'stairway';
    grid.appendChild(h('div',{
      className:`print-cell ${cls} ${aggSt}`,
      style:{ gridColumn:`${cw.col} / span ${cw.w}`, gridRow:`${cw.row} / span ${cw.h}` }
    },[
      h('div',{className:'num'},[cw.code]),
      winIcon(w, cw.code),
    ]));
  });

  if(layout.centralFiller){
    const fl = layout.centralFiller;
    grid.appendChild(h('div',{
      className:'print-cell filler',
      style:{ gridColumn:`${fl.col} / span ${fl.w}`, gridRow:`${fl.row} / span ${fl.h}` }
    },[fl.label]));
  }

  let totF=0, instF=0, defF=0;
  for(let p=0;p<4;p++){
    const tipo = positions[p];
    if(!tipo) continue;
    const dn = deptNum(f,p);
    const st = getDeptStats(e, dn);
    totF += st.total; instF += st.instaladas; defF += st.defCount;
  }
  const cs = getCommonStats(e, f);
  totF += cs.total; instF += cs.instaladas;

  return h('div',{className:'print-floor'},[
    h('h3',{},[
      h('span',{},[`Piso ${f}`]),
      h('span',{className:'stat'},[`${instF}/${totF} instaladas${defF>0?` · ${defF} defectos`:''}`]),
    ]),
    grid,
  ]);
}

/* ============================================
   REPORT GENERATOR
   ============================================ */
function generateReport(edif){
  const e=parseInt(edif);
  const b=BUILDINGS[e];
  const s=getBldgStats(e);
  const now=new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines=[];
  const add=(t='')=>lines.push(t);
  const SEP='='.repeat(48);
  const sep2='-'.repeat(48);
  const pad=(s,n)=>String(s).padEnd(n);
  const padr=(s,n)=>String(s).padStart(n);

  // Collect all windows
  const byEstado={instalada:[],pendiente:[],noInstalada:[],quitar:[],sinVentana:[]};
  const byTipo={};
  const withDef=[];

  function collect(key,depto,code,loc,isCommon){
    const w=DATA.windows[key]||newWindowRecord();
    const estado=w.estado||'noInstalada';
    const entry={depto,code,loc,estado,w,isCommon};
    if(byEstado[estado])byEstado[estado].push(entry);
    else byEstado['noInstalada'].push(entry); // fallback para estados no reconocidos
    if(!byTipo[code])byTipo[code]={total:0,instalada:0,pendiente:0,noInstalada:0,quitar:0,sinVentana:0};
    byTipo[code].total++;
    byTipo[code][estado]=(byTipo[code][estado]||0)+1;
    const defs=DEFICIENCIES.filter(d=>w.deficiencias[d.id]);
    if(defs.length)withDef.push({...entry,defs});
  }
  for(let f=1;f<=5;f++){
    for(let p=0;p<4;p++){
      const tipo=getDeptType(e,f,p);
      const dn=deptNum(f,p);
      getDeptWindows(tipo).forEach(([code,loc])=>collect(wKey(e,dn,code),dn,code,loc,false));
    }
    getCommonWindows(f).forEach(([code,loc])=>collect(wKey(e,`EC${f}`,code),`EC${f}`,code,loc,true));
  }

  // ── ENCABEZADO ──────────────────────────────
  add(`INFORME DE INSTALACIÓN — EDIFICIO ${e}  (Tipo ${b.tipo})`);
  add(`Generado: ${now}`);
  add(SEP);
  add('');

  // ── RESUMEN ──────────────────────────────────
  const instaladasNeto=s.instaladas-s.quitar;
  const noInstaladoTotal=s.total-instaladasNeto;
  add('RESUMEN GENERAL');
  add(sep2);
  add(`  Total ventanas       : ${s.total}`);
  add('');
  add(`  ✓ INSTALADAS (neto)  : ${instaladasNeto}  (${pct(instaladasNeto,s.total)}%)`);
  add(`    → Incluye: ${s.instaladas} instaladas − ${s.quitar} a quitar`);
  add('');
  add(`  ✗ NO INSTALADAS      : ${noInstaladoTotal}  (${pct(noInstaladoTotal,s.total)}%)`);
  if(byEstado.pendiente.length)add(`    Pendientes de inst.: ${byEstado.pendiente.length}`);
  if(byEstado.noInstalada.length)add(`    Sin instalar       : ${byEstado.noInstalada.length}`);
  if(s.quitar)add(`    A quitar (remover) : ${s.quitar}`);
  if(byEstado.sinVentana.length)add(`    Sin ventana        : ${byEstado.sinVentana.length}`);
  add('');
  if(withDef.length)add(`  Con inconformidades  : ${withDef.length} ventanas`);
  add('');

  // ── PENDIENTES ───────────────────────────────
  if(byEstado.pendiente.length){
    add(SEP);
    add(`PENDIENTES DE INSTALACIÓN  (${byEstado.pendiente.length})`);
    add(sep2);
    byEstado.pendiente.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | ${getOrientacion(it.depto)||'—'}`);
      if(it.w.observaciones)add(`    Obs: ${it.w.observaciones}`);
    });
    add('');
  }

  // ── SIN INSTALAR ─────────────────────────────
  if(byEstado.noInstalada.length){
    add(SEP);
    add(`SIN INSTALAR  (${byEstado.noInstalada.length})`);
    add(sep2);
    byEstado.noInstalada.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | ${getOrientacion(it.depto)||'—'}`);
    });
    add('');
  }

  // ── A QUITAR ─────────────────────────────────
  if(byEstado.quitar.length){
    add(SEP);
    add(`A QUITAR  (${byEstado.quitar.length})`);
    add(sep2);
    byEstado.quitar.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | ${getOrientacion(it.depto)||'—'}`);
      const mainDef=DEFICIENCIES.find(d=>it.w.deficiencias[d.id]);
      if(mainDef)add(`    Deficiencia: ${mainDef.label}`);
      if(it.w.observaciones)add(`    Observación: ${it.w.observaciones}`);
    });
    add('');
  }

  // ── INCONFORMIDADES ──────────────────────────
  if(withDef.length){
    add(SEP);
    add(`INCONFORMIDADES ACTIVAS  (${withDef.length} ventanas)`);
    add(sep2);
    withDef.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${it.loc}  [${it.estado}]`);
      it.defs.forEach(d=>add(`    • ${d.label}`));
      const acts=ACTIONS.filter(a=>it.w.acciones[a.id]?.active&&!it.w.acciones[a.id]?.done);
      if(acts.length)add(`    Acciones: ${acts.map(a=>a.label).join(' | ')}`);
      if(it.w.observaciones)add(`    Obs: ${it.w.observaciones}`);
    });
    add('');
  }

  // ── ACCIONES CORRECTIVAS PENDIENTES ──────────
  const actionCounts={};
  Object.entries(byEstado).forEach(([,list])=>{
    list.forEach(it=>{
      ACTIONS.forEach(a=>{
        if(it.w.acciones[a.id]?.active&&!it.w.acciones[a.id]?.done){
          if(!actionCounts[a.id])actionCounts[a.id]={label:a.label,count:0,items:[]};
          actionCounts[a.id].count++;
          actionCounts[a.id].items.push(`${it.depto} ${it.code}`);
        }
      });
    });
  });
  const pendingActions=Object.values(actionCounts).filter(a=>a.count>0);
  if(pendingActions.length){
    add(SEP);
    add(`ACCIONES CORRECTIVAS PENDIENTES`);
    add(sep2);
    pendingActions.sort((a,b)=>b.count-a.count).forEach(a=>{
      add(`  ${pad(a.label,24)} : ${a.count} ventanas`);
    });
    add('');
  }


  // ── PEDIDO DE VENTANAS (sinVentana) ──────────
  const sinVentanaList=byEstado.sinVentana||[];
  add(SEP);
  add(`PEDIDO DE VENTANAS  (${sinVentanaList.length} unidades)`);
  add(sep2);
  if(sinVentanaList.length){
    add(`  ${'Tipo'.padEnd(10)} ${'Dpto'.padEnd(8)} ${'Orientación'.padEnd(14)} Recinto`);
    add('  '+'-'.repeat(52));
    // Ordenar: por depto numérico, luego EC al final
    const sorted=[...sinVentanaList].sort((a,b)=>{
      const an=typeof a.depto==='number'?a.depto:9999;
      const bn=typeof b.depto==='number'?b.depto:9999;
      return an-bn||a.code.localeCompare(b.code);
    });
    sorted.forEach(it=>{
      const ori=getOrientacion(it.depto)||'—';
      add(`  ${pad(it.code,10)} ${pad(it.depto,8)} ${pad(ori,14)} ${it.loc}`);
      if(it.w.observaciones)add(`    ↳ ${it.w.observaciones.slice(0,60)}`);
    });
    add('');
    // Resumen agrupado por tipo
    add('  Resumen por tipo:');
    const porTipo={};
    sinVentanaList.forEach(it=>{porTipo[it.code]=(porTipo[it.code]||0)+1;});
    Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).forEach(([tipo,cnt])=>{
      add(`    ${pad(tipo,10)} × ${cnt}`);
    });
  } else {
    add('  — Sin ventanas marcadas como "Sin Ventana" —');
  }
  add('');
  add(SEP);
  add('FIN DEL INFORME');

  return lines.join('\n');
}

/* ============================================
   INFORME RÁPIDO POR ACCIÓN CORRECTIVA
   ============================================ */
function generateActionReport(edif,actionId){
  const e=parseInt(edif);
  const b=BUILDINGS[e];
  const actionDef=ACTIONS.find(a=>a.id===actionId);
  if(!actionDef)return 'Acción no encontrada';
  const now=new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines=[];
  const add=(t='')=>lines.push(t);
  const SEP='='.repeat(56);
  const sep2='-'.repeat(56);
  const pad=(s,n)=>String(s).padEnd(n);
  const padr=(s,n)=>String(s).padStart(n);

  // Collect windows with this action
  const items=[];
  for(let f=1;f<=5;f++){
    for(let p=0;p<4;p++){
      const tipo=getDeptType(e,f,p);
      const dn=deptNum(f,p);
      getDeptWindows(tipo).forEach(([code,loc])=>{
        const k=wKey(e,dn,code);
        const w=DATA.windows[k];
        if(!w)return;
        const act=w.acciones[actionId];
        if(act&&act.active){
          items.push({depto:dn,code,loc,done:act.done,obs:w.observaciones||''});
        }
      });
    }
    getCommonWindows(f).forEach(([code,loc])=>{
      const k=wKey(e,`EC${f}`,code);
      const w=DATA.windows[k];
      if(!w)return;
      const act=w.acciones[actionId];
      if(act&&act.active){
        items.push({depto:`EC${f}`,code,loc,done:act.done,obs:w.observaciones||''});
      }
    });
  }

  const pending=items.filter(i=>!i.done);
  const done=items.filter(i=>i.done);

  // ── ENCABEZADO ──────────────────────────────
  add(SEP);
  add(`ACCIÓN CORRECTIVA: ${actionDef.icon} ${actionDef.label.toUpperCase()}`);
  add(`Edificio ${e}  (Tipo ${b.tipo} · SA${b.sa})`);
  add(`Generado: ${now}`);
  add(SEP);
  add(`Total registros  : ${items.length}  (${pending.length} pendientes, ${done.length} completadas)`);
  add('');

  // ── TABLA 1: DETALLE ─────────────────────────
  if(items.length){
    add(sep2);
    add('TABLA 1 — DETALLE DE VENTANAS');
    add(sep2);
    add(`  ${pad('Dpto',8)} ${pad('Recinto',26)} ${pad('Tipo',10)} Estado   Observación`);
    add('  '+'-'.repeat(54));
    // Pendientes primero, luego completadas
    const sorted=[...pending,...done].sort((a,b)=>{
      // Ordenar por depto (numérico), luego EC al final
      const an=typeof a.depto==='number'?a.depto:9999;
      const bn=typeof b.depto==='number'?b.depto:9999;
      return an-bn||a.code.localeCompare(b.code);
    });
    sorted.forEach(it=>{
      const estado=it.done?'[CUMPLIDA]':'[PENDIENTE]';
      const obsShort=it.obs?(it.obs.length>30?it.obs.slice(0,29)+'…':it.obs):'—';
      add(`  ${pad(it.depto,8)} ${pad(it.loc,26)} ${pad(it.code,10)} ${estado}`);
      if(it.obs)add(`    ↳ ${obsShort}`);
    });
    add('');

    // ── TABLA 2: RESUMEN POR DEPTO ──────────────
    add(sep2);
    add('TABLA 2 — RESUMEN POR DEPARTAMENTO');
    add(sep2);
    // Agrupar por depto
    const byDepto={};
    pending.forEach(it=>{
      const k=String(it.depto);
      if(!byDepto[k])byDepto[k]={depto:it.depto,items:[]};
      byDepto[k].items.push(it);
    });
    const deptoList=Object.values(byDepto).sort((a,b)=>{
      const an=typeof a.depto==='number'?a.depto:9999;
      const bn=typeof b.depto==='number'?b.depto:9999;
      return an-bn;
    });
    if(deptoList.length){
      add(`  ${pad('Dpto',8)} ${padr('Ventanas',9)}  Recintos`);
      add('  '+'-'.repeat(54));
      deptoList.forEach(({depto,items:its})=>{
        const recintos=[...new Set(its.map(i=>i.loc))].join(', ');
        const recShort=recintos.length>32?recintos.slice(0,31)+'…':recintos;
        add(`  ${pad(depto,8)} ${padr(its.length,9)}  ${recShort}`);
      });
      add('');
      add(`  Total departamentos afectados (pendiente): ${deptoList.length}`);
      add(`  Total ventanas pendientes                : ${pending.length}`);
    } else {
      add('  — Sin ventanas pendientes —');
    }
    add('');
  } else {
    add('  — Sin registros para esta acción en este edificio —');
    add('');
  }

  add(SEP);
  add('FIN DEL INFORME DE ACCIÓN');
  return lines.join('\n');
}

function renderTypeTable(tipoCounts){
  const tbl=h('table',{className:'type-table'});
  // Sort entries by a logical order
  const order=['V1','V1a','V2','V3','V4','V5','V5a','V6','V7','V8','V9','PV1','PV2'];
  const sorted=Object.entries(tipoCounts).sort((a,b)=>{
    const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);
    return(ia===-1?99:ia)-(ib===-1?99:ib);
  });
  sorted.forEach(([tipo,{t,i}])=>{
    const row=h('tr',{},[
      h('td',{},[tipo]),
      h('td',{},[`${i}/${t}`]),
    ]);
    tbl.appendChild(row);
  });
  return tbl;
}

function getFloorStats(edif,floor){
  const e=parseInt(edif);
  let total=0,instaladas=0,pendientes=0,quitar=0,actionsPending=0,noInstalada=0;
  for(let p=0;p<4;p++){
    const tipo=getDeptType(e,floor,p);
    const dn=deptNum(floor,p);
    getDeptWindows(tipo).forEach(([code])=>{
      const w=DATA.windows[wKey(e,dn,code)];
      if(!w)return;
      total++;
      if(w.estado==='instalada')instaladas++;
      if(w.estado==='pendiente')pendientes++;
      if(w.estado==='quitar')quitar++;
      if(w.estado==='noInstalada')noInstalada++;
      Object.values(w.acciones).forEach(a=>{if(a.active&&!a.done)actionsPending++;});
    });
  }
  getCommonWindows(floor).forEach(([code])=>{
    const w=DATA.windows[wKey(e,`EC${floor}`,code)];
    if(!w)return;
    total++;
    if(w.estado==='instalada')instaladas++;
    if(w.estado==='pendiente')pendientes++;
    if(w.estado==='quitar')quitar++;
    if(w.estado==='noInstalada')noInstalada++;
    Object.values(w.acciones).forEach(a=>{if(a.active&&!a.done)actionsPending++;});
  });
  return{total,instaladas,pendientes,quitar,noInstalada,actionsPending};
}

function countBldgActions(edif,actionId){
  let pending=0,done=0;
  const e=parseInt(edif);
  for(let f=1;f<=5;f++){
    for(let p=0;p<4;p++){
      const tipo=getDeptType(e,f,p);
      const dn=deptNum(f,p);
      getDeptWindows(tipo).forEach(([code])=>{
        const w=DATA.windows[wKey(e,dn,code)];
        if(!w)return;
        if(w.acciones[actionId]?.active&&!w.acciones[actionId]?.done)pending++;
        if(w.acciones[actionId]?.done)done++;
      });
    }
    getCommonWindows(f).forEach(([code])=>{
      const w=DATA.windows[wKey(e,`EC${f}`,code)];
      if(!w)return;
      if(w.acciones[actionId]?.active&&!w.acciones[actionId]?.done)pending++;
      if(w.acciones[actionId]?.done)done++;
    });
  }
  return{pending,done};
}

          (hasD||activeActions.length)?h('div',{style:{marginTop:'5px',paddingLeft:'4px',display:'flex',gap:'4px',alignItems:'flex-start',flexWrap:'wrap'}},[
            ...activeDefIcons.map(d=>h('span',{style:{fontSize:'0.7rem',padding:'2px 6px',borderRadius:'8px',background:'var(--ac-red-soft)',color:'var(--ac-red)',fontWeight:'500',whiteSpace:'nowrap'}},[d.label])),
            ...activeActions.map(a=>{
              const act=w.acciones[a.id];
              return h('span',{title:a.label+(act.done?' ✓':' pendiente'),style:{
                fontSize:'0.75rem',padding:'1px 5px',borderRadius:'8px',
                background:act.done?'var(--ac-green-soft)':'var(--ac-orange-soft)',
                color:act.done?'var(--ac-green)':'var(--ac-orange)',fontWeight:'600'
              }},[a.icon+(act.done?'✓':'')]);
            }),
          ].filter(Boolean)):null,
          // Quick status buttons (editor only) — clearly separated area
          isEditor()?h('div',{style:{display:'flex',gap:'5px',marginTop:'8px',flexWrap:'wrap',paddingTop:'6px',borderTop:'1px dashed var(--border)'}},
            ESTADOS.map(e=>h('div',{
              className:'estado-opt'+(w.estado===e.id?' '+e.cls:''),
              style:{padding:'6px 12px',fontSize:'0.8rem',flex:'1',textAlign:'center',justifyContent:'center',minHeight:'36px'},
              onClick:(ev)=>{
                ev.stopPropagation();
                updateWindow(key,'estado',e.id,`Estado: ${w.estado} → ${e.id}`);
                renderDept();
              }
            },[e.sym+' '+e.label]))
          ):null,
        ].filter(Boolean));
      }),
    ]),
    renderSyncBar(),
  ].filter(Boolean));
  app().innerHTML='';
  app().appendChild(el);
}

function renderEstadoMini(estado){
  const cfg=ESTADOS.find(e=>e.id===estado)||ESTADOS[2];
  const colors={instalada:'var(--ac-green)',pendiente:'var(--ac-orange)',noInstalada:'var(--tx-2)',quitar:'var(--ac-red)',noInstalar:'var(--tx-2)',sinVentana:'#64748b'};
  return h('span',{style:{fontSize:'1.2rem',color:colors[estado]||'var(--tx-2)'}},[cfg.sym]);
}

/* ============================================
   VIEW: COMMON AREA WINDOW
   ============================================ */
function renderCommon(){
  const{edif,floor,code,backView,backParams}=viewParams;
  const key=wKey(edif,`EC${floor}`,code);
  const w=DATA.windows[key];
  if(!w)return;
  const loc=code==='PV1'?'Mampara Acceso':code==='PV2'?'Mampara Trasera':code==='V8'?'Ventanal Escalera':'Ventana Escalera';
  renderWindowDetail(key,code,loc,`EC Piso ${floor} — Edif. ${edif}`,
    backView||'building', backParams||(backView?{}:{edif}));
}

/* ============================================
   VIEW: WINDOW DETAIL
   ============================================ */
function renderWindow(){
  const{edif,depto,code,loc,backView,backParams}=viewParams;
  const key=wKey(edif,depto,code);
  renderWindowDetail(key,code,loc,`${depto} — Edif. ${edif}`,
    backView||'dept', backParams||(backView?{}:{edif,depto}));
}

function renderWindowDetail(key,code,loc,subtitle,backView,backParams){
  const w=DATA.windows[key];
  if(!w){app().innerHTML='<p>Ventana no encontrada</p>';return;}

  // Build sibling window list for prev/next nav
  const _parts=key.split('-');
  const _edifN=parseInt(_parts[0]);
  const _deptoStr=_parts[1];
  const _sibWins=(()=>{
    if(_deptoStr.startsWith('EC')){
      const f=parseInt(_deptoStr.replace('EC',''));
      return getCommonWindows(f).map(([c,l])=>({code:c,loc:l}));
    }
    const dn=parseInt(_deptoStr);
    const f=Math.floor(dn/100);
    const pi=(dn%100)-1;
    const tipo=getDeptType(_edifN,f,pi);
    return getDeptWindows(tipo).map(([c,l])=>({code:c,loc:l}));
  })();
  const _curIdx=_sibWins.findIndex(w=>w.code===code);
  const _prevWin=_curIdx>0?_sibWins[_curIdx-1]:null;
  const _nextWin=_curIdx<_sibWins.length-1?_sibWins[_curIdx+1]:null;

  const el=h('div',{className:'fade-in'},[
    topbar(`${winFullName(code)} · ${loc}`,backView,backParams),
    h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}},[
      h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)',flex:1}},[subtitle]),
      (()=>{
        const deptoFromKey=key.split('-')[1];
        const ori=getOrientacion(deptoFromKey);
        return ori?h('span',{className:'badge badge-cyan',style:{fontSize:'0.68rem'}},[
          (ori==='Derecha'?'→':'←')+' '+ori
        ]):null;
      })(),
    ]),
    // ── Observaciones — ARRIBA ────────────────────
    (w.observaciones||isEditor())?h('div',{className:'card',style:{borderLeft:'3px solid var(--ac-orange)',background:w.observaciones?'var(--ac-orange-soft)':'var(--bg-2)',marginBottom:'var(--gap)'}},[
      h('div',{style:{fontWeight:'600',fontSize:'0.82rem',color:'var(--ac-orange)',marginBottom:'6px'}},[
        '💬 Observaciones'+(w.observaciones?'':' (sin comentarios)'),
      ]),
      isEditor()?h('textarea',{
        className:'obs-area',
        id:'obs-ta',
        placeholder:'Agregar observaciones...',
        style:{minHeight:'56px'},
        onBlur:(e)=>{
          if(e.target.value!==w.observaciones)
            updateWindow(key,'observaciones',e.target.value,'Observación actualizada');
        }
      },[w.observaciones||'']):
      h('div',{style:{fontSize:'0.85rem',color:'var(--tx-1)',whiteSpace:'pre-wrap',lineHeight:'1.5'}},[w.observaciones]),
    ].filter(Boolean)):null,

    // Prev / Next navigation row
    (_prevWin||_nextWin)?h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'10px'}},[
      _prevWin?h('button',{
        className:'btn btn-sm btn-ghost',
        style:{flex:1,minHeight:'38px',fontSize:'0.8rem'},
        onClick:()=>{
          const prevKey=wKey(_edifN,_deptoStr,_prevWin.code);
          renderWindowDetail(prevKey,_prevWin.code,_prevWin.loc,subtitle,backView,backParams);
        }
      },['◀ '+_prevWin.code]):h('div',{style:{flex:1}},[]),
      h('span',{style:{fontSize:'0.72rem',color:'var(--tx-2)',whiteSpace:'nowrap'}},
        [(_curIdx+1)+'/'+_sibWins.length]),
      _nextWin?h('button',{
        className:'btn btn-sm btn-ghost',
        style:{flex:1,minHeight:'38px',fontSize:'0.8rem'},
        onClick:()=>{
          const nextKey=wKey(_edifN,_deptoStr,_nextWin.code);
          renderWindowDetail(nextKey,_nextWin.code,_nextWin.loc,subtitle,backView,backParams);
        }
      },[_nextWin.code+' ▶']):h('div',{style:{flex:1}},[]),
    ]):null,

    // Estado selector
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',fontSize:'0.85rem',marginBottom:'8px'}},['Estado']),
      h('div',{className:'estado-group',id:'estado-group'},
        ESTADOS.map(e=>
          h('div',{
            className:'estado-opt'+(w.estado===e.id?' '+e.cls:''),
            style:{opacity:isEditor()?1:0.6,pointerEvents:isEditor()?'auto':'none'},
            onClick:()=>{
              if(!isEditor())return;
              updateWindow(key,'estado',e.id,`Estado: ${w.estado} → ${e.id}`);
              renderWindowDetail(key,code,loc,subtitle,backView,backParams);
            }
          },[e.sym+' '+e.label])
        )
      ),
    ]),

    // Estado Rasgo
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',fontSize:'0.85rem',marginBottom:'8px'}},['Estado Rasgo']),
      h('div',{className:'vano-group'},
        VANO_OPTS.map(v=>
          h('span',{
            className:'vano-opt'+(w.estadoVano===v?' sel':''),
            style:{opacity:isEditor()?1:0.6,pointerEvents:isEditor()?'auto':'none'},
            onClick:()=>{
              if(!isEditor())return;
              if(w.estadoVano===v){
                updateWindow(key,'estadoVano','',`Rasgo: ${v} → —`);
                w.separacionMm='';
                saveLocal();
                renderWindowDetail(key,code,loc,subtitle,backView,backParams);
                return;
              }
              if(v==='Sobredimensionado'||v==='Subdimensionado'){
                showMmPicker(w.separacionMm||'',v,(mm)=>{
                  w.separacionMm=mm;

              renderWindowDetail(key,code,loc,subtitle,backView,backParams);

          },[v])
        )
      ),
      // Separación info row
      (w.estadoVano==='Sobredimensionado'||w.estadoVano==='Subdimensionado')&&w.separacionMm?

          h('span',{style:{fontSize:'0.78rem',color:'var(--tx-2)'}},

          },['✏️ '+w.separacionMm+'mm']):null,
        ].filter(Boolean)):null,
    ].filter(Boolean)),

    // ── Reposición al proveedor — v2.26 ──
    (()=>{
      const rp=getRepo(w);
      const refresh=()=>renderWindowDetail(key,code,loc,subtitle,backView,backParams);
      const est=repoEstado(rp.estado);
      const pill=(r)=>{

        },[r.sym+' '+r.label]);

      const campoFecha=(campo,etiqueta)=>h('label',{style:{display:'flex',alignItems:'center',gap:'5px',fontSize:'0.72rem',color:'var(--tx-2)'}},[

          h('div',{style:{fontWeight:'600',fontSize:'0.85rem'}},['🔄 Reposición']),

        rp.estado?h('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'8px'}},[
          campoFecha('fechaRetiro','📤 Retirada de obra:'),

        ].filter(Boolean)):null,
        (rp.estado&&isEditor())?h('textarea',{
          className:'obs-area',style:{minHeight:'42px',fontSize:'0.8rem'},
          placeholder:'Detalle: motivo, N° de guía, quién la retiró...',
          onBlur:(e)=>{ const v=e.target.value.trim(); if(getRepo(w).comentario!==v)setRepo(key,'comentario',v,'Comentario de reposición'); }

      ].filter(Boolean));

    // ── Hojas de la ventana (corredera / fija / medida) — v2.26 ──
    (()=>{

      const orient=getOrientacion(key.split('-')[1]);

                background:sel?'var(--ac-cyan-soft)':'var(--bg-2)',
                border:'1px solid '+(sel?'var(--ac-cyan)':'var(--border)'),
                color:sel?'var(--ac-cyan)':'var(--tx-2)',fontWeight:sel?'700':'400'},

        if(!w.acciones[a.id])w.acciones[a.id]={active:false,done:false};

          ]),
          isEditor()?h('label',{className:'btn btn-sm btn-ghost',style:{cursor:'pointer'}},[
            '📷 Capturar',
            h('input',{type:'file',accept:'image/*',capture:'environment',style:{display:'none'},
              onChange:(e)=>{
                const file=e.target.files[0];
                if(!file)return;
                const reader=new FileReader();
                reader.onload=(ev)=>{
                  const img=new Image();
                  img.onload=()=>{
                    try{
                      // Comprimir: máx 1024px (mejor calidad para zoom), JPEG 0.7
                      const MAX=1024;
                      let W=img.width,H=img.height;
                      if(W>MAX||H>MAX){const s=Math.min(MAX/W,MAX/H);W=Math.round(W*s);H=Math.round(H*s);}
                      const canvas=document.createElement('canvas');
                      canvas.width=W;canvas.height=H;
                      canvas.getContext('2d').drawImage(img,0,0,W,H);
                      const compressed=canvas.toDataURL('image/jpeg',0.7);
                      w.fotos.push({data:compressed,ts:ts(),comentario:''});
                      if(w.fotos.length>MAX_FOTOS){
                        w.fotos=w.fotos.slice(-MAX_FOTOS);
                        showSyncMsg('⚠ Reemplazada foto más antigua (límite '+MAX_FOTOS+')');
                      }
                      w.historial.unshift({t:ts(),cambio:'Foto agregada'});
                      dirtyKeys.add(key);
                      saveLocalNow();
                      refresh();
                    }catch(err){
                      alert('Error procesando foto: '+err.message);
                    }
                  };
                  img.onerror=()=>alert('No se pudo cargar la imagen');
                  img.src=ev.target.result;
                };
                reader.onerror=()=>alert('No se pudo leer el archivo');
                reader.readAsDataURL(file);
                e.target.value=''; // permite re-capturar misma foto
              }
            }),
          ]):null,
        ]),
        w.fotos.length?
          h('div',{style:{display:'flex',gap:'8px',overflowX:'auto',paddingBottom:'6px'}},
            w.fotos.map((f,i)=>
              h('div',{
                style:{position:'relative',flexShrink:0,cursor:'pointer'},

              },[
                h('img',{src:f.data,style:{width:'88px',height:'88px',objectFit:'cover',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',display:'block'}}),
                f.comentario?h('div',{style:{position:'absolute',bottom:'0',left:'0',right:'0',background:'rgba(0,0,0,0.6)',color:'#fff',fontSize:'0.6rem',padding:'2px 4px',borderRadius:'0 0 var(--radius-sm) var(--radius-sm)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},['💬 '+f.comentario]):null,
              ].filter(Boolean))
            )
          ):
          h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)',padding:'8px 0'}},[
            isEditor()?'Sin fotos. Toca 📷 Capturar para agregar.':'Sin fotos.'
          ]),
      ]);
    })(),

    // History
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',fontSize:'0.85rem',marginBottom:'8px'}},['Historial']),
      w.historial.length?
        h('div',{},w.historial.slice(0,15).map(hi=>
          h('div',{className:'hist-item'},[
            h('span',{className:'hist-time'},[hi.t+' ']),
            h('span',{},[hi.cambio]),
          ])
        )):
        h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)'}},['Sin cambios registrados']),
    ]),

    renderSyncBar(),
  ]);
  app().innerHTML='';
  app().appendChild(el);
  // Set textarea value
  const ta=$('#obs-ta');
  if(ta)ta.value=w.observaciones||'';
}

/* Modal del cambio condicional: elegís alcance y qué estados pasar a otro.
   Muestra el conteo exacto antes de aplicar y guarda un respaldo previo. */
function showCambioCondicional(scopeIni,paramsIni){
  let scope=scopeIni||'global';
  let params=paramsIni||{};
  let desde=['pendiente','noInstalada'];   // "todo lo que no está instalado"
  let hacia='sinVentana';
  const overlay=h('div',{className:'overlay',onClick:closeOnBackdropClick},[]);

  const nombreScope=()=>{
    if(scope==='global')return 'Todo el proyecto';
    if(scope==='sa')return SA_NAMES[params.sa];
    if(scope==='building')return 'Edif. '+params.edif;
    if(scope==='floor')return 'Edif. '+params.edif+' · piso '+params.floor;
    if(scope==='dept')return 'Depto '+params.depto+' (Edif. '+params.edif+')';
    return '';
  };

  function draw(){
    overlay.innerHTML='';
    const afectadas=keysPorEstado(scope,params,desde);
    const chip=(txt,activo,onClick)=>h('button',{
      className:'btn btn-sm '+(activo?'btn-primary':'btn-ghost'),
      style:{fontSize:'0.72rem',padding:'5px 9px'},onClick},[txt]);
    const estadoChip=(est,lista,toggle)=>chip(est.sym+' '+est.label,lista.indexOf(est.id)>=0,()=>{toggle(est.id);draw();});

    overlay.appendChild(h('div',{className:'modal',style:{maxHeight:'92vh',overflowY:'auto'}},[
      h('h3',{style:{marginBottom:'4px'}},['⚡ Cambio masivo por estado']),
      h('div',{style:{fontSize:'0.74rem',color:'var(--tx-2)',marginBottom:'10px'}},
        ['Cambia sólo las ventanas que hoy están en los estados que elijas. Las demás no se tocan.']),

      h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',fontWeight:'600',marginBottom:'4px'}},['Alcance']),
      h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'10px'}},[
        chip('Todo el proyecto',scope==='global',()=>{scope='global';params={};draw();}),
        ...[1,2,3,4,5].map(sa=>chip(SA_NAMES[sa],scope==='sa'&&params.sa===sa,()=>{scope='sa';params={sa};draw();})),
        paramsIni&&paramsIni.edif?chip('Edif. '+paramsIni.edif,scope==='building',
          ()=>{scope='building';params={edif:paramsIni.edif};draw();}):null,
        (paramsIni&&paramsIni.depto)?chip('Depto '+paramsIni.depto,scope==='dept',
          ()=>{scope='dept';params={edif:paramsIni.edif,depto:paramsIni.depto};draw();}):null,
      ].filter(Boolean)),

      h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',fontWeight:'600',marginBottom:'4px'}},['Cambiar las que estén en:']),
      h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'4px'}},
        ESTADOS.filter(e=>e.id!==hacia).map(e=>estadoChip(e,desde,(id)=>{
          const i=desde.indexOf(id);
          if(i>=0)desde.splice(i,1); else desde.push(id);
        }))),
      h('button',{className:'btn btn-sm btn-ghost',style:{fontSize:'0.7rem',marginBottom:'10px',color:'var(--ac-cyan)'},
        onClick:()=>{desde=['pendiente','noInstalada'];draw();}},['↺ Todo lo no instalado']),

      h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',fontWeight:'600',marginBottom:'4px'}},['Pasarlas a:']),
      h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'12px'}},
        ESTADOS.map(e=>chip(e.sym+' '+e.label,hacia===e.id,()=>{
          hacia=e.id;
          const i=desde.indexOf(e.id);
          if(i>=0)desde.splice(i,1);   // no tiene sentido cambiar algo a sí mismo
          draw();
        }))),

      h('div',{style:{padding:'10px',borderRadius:'var(--radius-sm)',marginBottom:'12px',
        background:afectadas.length?'var(--ac-orange-soft)':'var(--bg-2)',
        color:afectadas.length?'var(--ac-orange)':'var(--tx-2)'}},[
        h('div',{style:{fontWeight:'700',fontSize:'0.9rem'}},
          [afectadas.length?('Se van a cambiar '+afectadas.length+' ventanas'):'Ninguna ventana coincide']),
        h('div',{style:{fontSize:'0.74rem',marginTop:'3px'}},[nombreScope()]),
        desde.length?h('div',{style:{fontSize:'0.74rem',marginTop:'3px'}},
          [desde.map(id=>(ESTADOS.find(x=>x.id===id)||{}).label||id).join(', ')+
           ' → '+((ESTADOS.find(x=>x.id===hacia)||{}).label||hacia)]):null,
      ].filter(Boolean)),

      h('div',{style:{fontSize:'0.7rem',color:'var(--tx-2)',marginBottom:'10px'}},
        ['Antes de aplicar se guarda un respaldo, por si hay que volver atrás desde ⋮ → Backups locales.']),

      h('div',{style:{display:'flex',gap:'8px'}},[
        h('button',{className:'btn btn-sm btn-ghost',style:{flex:1},onClick:()=>overlay.remove()},['Cancelar']),
        h('button',{className:'btn btn-sm',
          style:{flex:1,background:afectadas.length?'var(--ac-orange)':'var(--bg-3)',
            color:afectadas.length?'#fff':'var(--tx-2)'},
          disabled:!afectadas.length,
          onClick:()=>{
            if(!afectadas.length)return;
            const eh=(ESTADOS.find(x=>x.id===hacia)||{}).label||hacia;
            if(!confirm('Vas a cambiar '+afectadas.length+' ventanas a "'+eh+'".\n\n'+
              nombreScope()+'\n\nSe guarda un respaldo antes. ¿Continuar?'))return;
            saveBackupSnapshot();
            const n=aplicarCambioCondicional(afectadas,hacia,'Cambio masivo → '+eh);
            _searchIndex=null;
            overlay.remove();
            showSyncMsg('✓ '+n+' ventanas pasadas a '+eh+' · recordá hacer ⬆ Sync');
            render();
          }
        },['⚡ Aplicar']),
      ]),
    ].filter(Boolean)));
  }
  draw();
  document.body.appendChild(overlay);
}

function applyBulkStatus(scope,params,newEstado){
  if(!isEditor())return;
  const e=parseInt(params.edif);
  const label=`Cambio masivo → ${newEstado}`;
  function changeWin(key){
    if(!DATA.windows[key])return;
    DATA.windows[key].estado=newEstado;
    DATA.windows[key].historial.unshift({t:ts(),cambio:label});
    if(DATA.windows[key].historial.length>5)DATA.windows[key].historial=DATA.windows[key].historial.slice(0,5);
    dirtyKeys.add(key);
  }
  if(scope==='dept'){
    const depto=parseInt(params.depto);
    const fl=Math.floor(depto/100),pi=(depto%100)-1;
    getDeptWindows(getDeptType(e,fl,pi)).forEach(([c])=>changeWin(wKey(e,depto,c)));
  } else if(scope==='floor'){
    forEachWindowInFloor(e, params.floor, (_w, key)=>changeWin(key));
  } else if(scope==='building'){
    forEachWindowInBldg(e, (_w, key)=>changeWin(key));
  }
  saveLocalNow();
}

/* ---- CAMBIO MASIVO CONDICIONAL (v2.26) ----
   Cambia de estado sólo las ventanas que hoy están en ciertos estados, en
   vez de pisar todo el alcance. El caso que lo motivó: marcar como
   "Sin Ventana" todo lo que todavía no está instalado. */
// Recorre el alcance y devuelve las keys cuyo estado está en `desde`.
function keysPorEstado(scope,params,desde){
  const out=[];
  const mira=(w,key)=>{ if(w&&desde.indexOf(w.estado)>=0)out.push(key); };
  if(scope==='global'){
    Object.keys(BUILDINGS).map(Number).forEach(e=>forEachWindowInBldg(e,mira));
  } else if(scope==='sa'){
    const[a,b]=SA_RANGES[params.sa];
    for(let e=a;e<=b;e++)forEachWindowInBldg(e,mira);
  } else if(scope==='building'){
    forEachWindowInBldg(parseInt(params.edif),mira);
  } else if(scope==='floor'){
    forEachWindowInFloor(parseInt(params.edif),params.floor,mira);
  } else if(scope==='dept'){
    const e=parseInt(params.edif), depto=parseInt(params.depto);
    const fl=Math.floor(depto/100), pi=(depto%100)-1;
    getDeptWindows(getDeptType(e,fl,pi)).forEach(([c])=>{
      const k=wKey(e,depto,c);
      mira(DATA.windows[k],k);
    });
  }
  return out;
}
function aplicarCambioCondicional(keys,nuevoEstado,etiqueta){
  if(!isEditor())return 0;
  keys.forEach(key=>{
    const w=DATA.windows[key];
    if(!w)return;
    w.estado=nuevoEstado;
    if(!w.historial)w.historial=[];
    w.historial.unshift({t:ts(),cambio:etiqueta});
    if(w.historial.length>5)w.historial=w.historial.slice(0,5);
    dirtyKeys.add(key);
  });
  saveLocalNow();
  return keys.length;
}

    ]))
  );
