// Collect all pending corrective actions with location info
function collectActions(edifStart,edifEnd){
  const items=[];
  for(let e=edifStart;e<=edifEnd;e++){
    for(let f=1;f<=5;f++){
      for(let p=0;p<4;p++){
        const tipo=getDeptType(e,f,p);
        const dn=deptNum(f,p);
        getDeptWindows(tipo).forEach(([code,loc])=>{
          const w=DATA.windows[wKey(e,dn,code)];
          if(!w)return;
          ACTIONS.forEach(a=>{
            const act=w.acciones[a.id];
            if(act&&act.active){
              items.push({edif:e,depto:dn,floor:f,code,loc,action:a,done:act.done,key:wKey(e,dn,code)});
            }
          });
        });
      }
      getCommonWindows(f).forEach(([code])=>{
        const w=DATA.windows[wKey(e,`EC${f}`,code)];
        if(!w)return;
        const loc=code==='PV1'?'Mampara Acceso':code==='PV2'?'Mampara Trasera':code==='V8'?'Ventanal Escalera':'Ventana Escalera';
        ACTIONS.forEach(a=>{
          const act=w.acciones[a.id];
          if(act&&act.active){
            items.push({edif:e,depto:`EC${f}`,floor:f,code,loc,action:a,done:act.done,key:wKey(e,`EC${f}`,code)});
          }
        });
      });
    }
  }
  return items;
}

// Auto-expand actions card — carga datos con requestIdleCallback para no bloquear render inicial
function renderLazyActionsCard(title,edifStart,edifEnd,showEdif,backView,backParams){
  const containerId='lac-'+edifStart+'-'+edifEnd;
  const card=h('div',{className:'card'},[
    h('div',{style:{fontWeight:'600',fontSize:'0.9rem',marginBottom:'10px'}},[title]),
    h('div',{id:containerId,style:{color:'var(--tx-2)',fontSize:'0.8rem',padding:'4px 0'}},['⏳ Cargando acciones...']),
  ]);
  // Auto-expand asíncrono para no bloquear el render de la vista
  const expand=()=>{
    const container=document.getElementById(containerId);
    if(!container)return;
    const items=collectActions(edifStart,edifEnd);
    container.innerHTML='';
    container.appendChild(renderActionsPanel(items,title,showEdif,backView||'dashboard',backParams||{}));
  };
  if(typeof requestIdleCallback!=='undefined'){
    requestIdleCallback(expand,{timeout:500});
  } else {
    setTimeout(expand,80);
  }
  return card;
}

// Render corrective actions panel (used in dashboard, SA, and building detail)
// backView/backParams: contexto de navegación para la vista actionDetail
function renderActionsPanel(items,title,showEdif=true,backView='dashboard',backParams={}){
  if(!items.length)return h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)',padding:'8px 0'}},['Sin acciones correctivas registradas']);
  // Group by action type
  const grouped={};
  ACTIONS.forEach(a=>{grouped[a.id]={action:a,pending:[],done:[]};});
  items.forEach(it=>{
    if(!grouped[it.action.id])return;
    if(it.done)grouped[it.action.id].done.push(it);
    else grouped[it.action.id].pending.push(it);
  });
  const totalPending=items.filter(i=>!i.done).length;
  const totalDone=items.filter(i=>i.done).length;

  return h('div',{},[
    h('div',{style:{display:'flex',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}},[
      totalPending?h('span',{className:'badge badge-orange'},[totalPending+' pendientes']):null,
      totalDone?h('span',{className:'badge badge-green'},[totalDone+' completadas']):null,
      (!totalPending&&!totalDone)?h('span',{style:{fontSize:'0.8rem',color:'var(--tx-2)'}},[' Sin acciones activas']):null,
    ].filter(Boolean)),
    ...ACTIONS.map(a=>{
      const g=grouped[a.id];
      if(!g.pending.length&&!g.done.length)return null;
      // Para navigación correcta: si showEdif=false (single building), scope=ese edif
      const navEdifStart=showEdif?edifStart(items):items[0]?.edif||1;
      const navEdifEnd=showEdif?edifEnd(items):items[0]?.edif||1;
      return h('div',{style:{marginBottom:'10px'}},[
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'8px 10px',borderBottom:'1px solid var(--border)',cursor:'pointer',borderRadius:'var(--radius-sm)',background:'var(--bg-2)',marginBottom:'4px'},
          onClick:()=>{
            const eStart=showEdif?(typeof edifStart==='function'?edifStart(items):1):items[0]?.edif||1;
            const eEnd=showEdif?(typeof edifEnd==='function'?edifEnd(items):34):items[0]?.edif||1;
            navigate('actionDetail',{actionId:a.id,edifStart:eStart,edifEnd:eEnd,backView,backParams});
          }
        },[
          h('span',{style:{fontSize:'1.3rem'}},[a.icon]),
          h('span',{style:{fontWeight:'600',fontSize:'0.9rem',flex:1}},[a.label]),
          g.pending.length?h('span',{className:'badge badge-orange',style:{fontSize:'0.82rem',padding:'4px 8px'}},[g.pending.length+' pend.']):null,
          g.done.length?h('span',{className:'badge badge-green',style:{fontSize:'0.82rem',padding:'4px 8px'}},[g.done.length+' ✓']):null,
          h('span',{style:{color:'var(--ac-blue)',fontSize:'1rem',marginLeft:'4px'}},['▶']),
        ]),
        // Preview de los primeros pendientes (agrupados por edif cuando showEdif=true)
        ...g.pending.slice(0,2).map(it=>
          h('div',{style:{fontSize:'0.77rem',color:'var(--tx-1)',padding:'2px 0 2px 28px',display:'flex',gap:'6px'}},[
            showEdif?h('span',{style:{fontWeight:'700',color:'var(--ac-blue)',minWidth:'24px'}},[`E${it.edif}`]):null,
            h('span',{style:{fontFamily:'var(--font-mono)',fontWeight:'600'}},[String(it.depto)]),
            h('span',{},[it.code]),
            h('span',{style:{color:'var(--tx-2)'}},[it.loc.slice(0,18)]),
          ].filter(Boolean))
        ),
        g.pending.length>2?h('div',{style:{fontSize:'0.72rem',color:'var(--ac-blue)',padding:'2px 0 2px 28px',cursor:'pointer'},
          onClick:()=>{
            const eStart=showEdif?1:items[0]?.edif||1;
            const eEnd=showEdif?34:items[0]?.edif||1;
            navigate('actionDetail',{actionId:a.id,edifStart:eStart,edifEnd:eEnd,backView,backParams});
          }
        },['... ver todas ('+g.pending.length+')']):null,
      ]);
    }).filter(Boolean),
  ]);

  // Helpers para resolver el scope de edif dinámicamente
  function edifStart(items){return Math.min(...items.map(i=>i.edif));}
  function edifEnd(items){return Math.max(...items.map(i=>i.edif));}
}

/* ============================================
   VIEW: ACTION DETAIL — per action type
   ============================================ */
function renderActionDetail(){
  const{actionId,edifStart,edifEnd,backView:passedBack,backParams:passedBackParams}=viewParams;
  const actionDef=ACTIONS.find(a=>a.id===actionId);
  if(!actionDef){app().innerHTML='<p>Acción no encontrada</p>';return;}

  // Back nav: usa el contexto pasado, o infiere
  const isSingleEdif=edifStart===edifEnd;
  const backView=passedBack||(isSingleEdif?'building':'dashboard');
  const backParams=passedBackParams||(isSingleEdif?{edif:edifStart}:{});
  const scopeLabel=isSingleEdif?`Edif. ${edifStart}`:
    (edifStart===1&&edifEnd===34?'Proyecto global':`SA (Edif. ${edifStart}–${edifEnd})`);

  // Collect all items for this action
  const allItems=[];
  for(let e=edifStart;e<=edifEnd;e++){
    for(let f=1;f<=5;f++){
      for(let p=0;p<4;p++){
        const tipo=getDeptType(e,f,p);
        const dn=deptNum(f,p);
        getDeptWindows(tipo).forEach(([code,loc])=>{
          const k=wKey(e,dn,code);
          const w=DATA.windows[k];
          if(!w)return;
          const act=w.acciones[actionId];
          if(act&&act.active){
            const defCnt=Object.values(w.deficiencias).filter(Boolean).length;
            allItems.push({edif:e,depto:dn,floor:f,code,loc,done:act.done,key:k,defCnt,obs:w.observaciones||''});
          }
        });
      }
      getCommonWindows(f).forEach(([code])=>{
        const k=wKey(e,`EC${f}`,code);
        const w=DATA.windows[k];
        if(!w)return;
        const loc=code==='PV1'?'Mampara Acceso':code==='PV2'?'Mampara Trasera':code==='V8'?'Ventanal Escalera':'Ventana Escalera';
        const act=w.acciones[actionId];
        if(act&&act.active){
          const defCnt=Object.values(w.deficiencias).filter(Boolean).length;
          allItems.push({edif:e,depto:`EC${f}`,floor:f,code,loc,done:act.done,key:k,defCnt,obs:w.observaciones||''});
        }
      });
    }
  }

  const pending=allItems.filter(i=>!i.done);
  const done=allItems.filter(i=>i.done);

  // renderActionItem — ítem NO desaparece al marcar: solo actualiza el DOM del ítem
  function renderActionItem(it,container){
    const w=DATA.windows[it.key];
    const itemEl=document.createElement('div');
    itemEl.style.cssText='padding:11px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:background 0.2s;';
    if(it.done)itemEl.style.background='var(--ac-green-soft)';

    // Circle toggle
    const circle=document.createElement('div');
    circle.style.cssText=`width:36px;height:36px;border-radius:50%;border:2px solid ${it.done?'var(--ac-green)':'var(--border)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${it.done?'var(--ac-green)':'transparent'};color:${it.done?'#fff':'var(--tx-2)'};font-size:0.9rem;${isEditor()?'cursor:pointer;':''};user-select:none;`;
    circle.textContent=it.done?'✓':'';
    if(isEditor()){
      circle.addEventListener('click',()=>{
        if(!w||!w.acciones[actionId])return;
        w.acciones[actionId].done=!w.acciones[actionId].done;
        it.done=w.acciones[actionId].done;
        w.historial.unshift({t:ts(),cambio:`Acción ${actionDef.label}: ${it.done?'Completada':'Reabierta'}`});
        saveLocal();
        // Actualizar solo este ítem visualmente (no re-render completo)
        itemEl.style.background=it.done?'var(--ac-green-soft)':'transparent';
        circle.style.background=it.done?'var(--ac-green)':'transparent';
        circle.style.borderColor=it.done?'var(--ac-green)':'var(--border)';
        circle.style.color=it.done?'#fff':'var(--tx-2)';
        circle.textContent=it.done?'✓':'';
        statPend.textContent=allItems.filter(i=>!i.done).length.toString();
        statDone.textContent=allItems.filter(i=>i.done).length.toString();
      });
    }
    itemEl.appendChild(circle);

    // Info
    const info=h('div',{style:{flex:'1',minWidth:'0'}},[
      h('div',{style:{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}},[
        !isSingleEdif?h('span',{style:{fontWeight:'700',fontSize:'0.82rem',color:'var(--ac-blue)'}},[`E${it.edif}`]):null,
        h('span',{style:{fontWeight:'600',fontFamily:'var(--font-mono)',fontSize:'0.85rem'}},[String(it.depto)]),
        h('span',{style:{fontFamily:'var(--font-mono)',fontSize:'0.82rem',color:'var(--tx-2)'}},[it.code]),
        h('span',{style:{fontSize:'0.78rem',color:'var(--tx-2)'}},[it.loc]),
      ].filter(Boolean)),
      it.obs?h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',marginTop:'2px'}},[it.obs.slice(0,50)+(it.obs.length>50?'…':'')]):null,
    ].filter(Boolean));
    itemEl.appendChild(info);

    // Ir al detalle de ventana
    const navBtn=h('button',{className:'btn-icon',style:{color:'var(--ac-blue)',fontSize:'1.1rem',flexShrink:0,padding:'8px'},
      onClick:()=>{
        if(it.depto.toString().startsWith('EC')){
          const fl=parseInt(it.depto.replace('EC',''));
          navigate('common',{edif:it.edif,floor:fl,code:it.code,backView:'actionDetail',backParams:viewParams});
        } else {
          navigate('window',{edif:it.edif,depto:parseInt(it.depto),code:it.code,loc:it.loc,backView:'actionDetail',backParams:viewParams});
        }
      }
    },['▶']);
    itemEl.appendChild(navBtn);
    return itemEl;
  }

  // Bulk complete/reopen
  function bulkToggle(items,setDone){
    if(!isEditor())return;
    items.forEach(it=>{
      const w=DATA.windows[it.key];
      if(w&&w.acciones[actionId]){
        w.acciones[actionId].done=setDone;
        w.historial.unshift({t:ts(),cambio:`Acción ${actionDef.label}: ${setDone?'Completada':'Reabierta'} (masivo)`});
      }
    });
    saveLocalNow();
    renderActionDetail();
  }

  // Agrupar por edificio cuando scope multi-edif
  function renderGroupedByEdif(items){
    if(isSingleEdif){
      const wrap=h('div',{className:'card',style:{padding:0}});
      items.forEach(it=>wrap.appendChild(renderActionItem(it)));
      return wrap;
    }
    // Agrupar por edif
    const byEdif={};
    items.forEach(it=>{
      if(!byEdif[it.edif])byEdif[it.edif]=[];
      byEdif[it.edif].push(it);
    });
    const wrap=h('div',{});
    Object.entries(byEdif).sort((a,b)=>parseInt(a[0])-parseInt(b[0])).forEach(([edif,edifItems])=>{
      const isExpanded={v:true};
      const edifCard=h('div',{className:'card',style:{padding:0,marginBottom:'8px'}});
      const edifHdr=h('div',{style:{
        padding:'10px 14px',fontWeight:'700',fontSize:'0.88rem',
        display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',
        background:'var(--ac-blue-soft)',borderRadius:'var(--radius) var(--radius) 0 0',
        color:'var(--ac-blue)',userSelect:'none'
      }},[
        h('span',{style:{flex:1}},['Edif. '+edif]),
        h('span',{className:'badge badge-orange',style:{fontSize:'0.75rem'}},[edifItems.filter(i=>!i.done).length+' pend.']),
        edifItems.filter(i=>i.done).length?h('span',{className:'badge badge-green',style:{fontSize:'0.75rem'}},[edifItems.filter(i=>i.done).length+' ✓']):null,
        h('span',{style:{fontSize:'0.9rem'}},['▾']),
      ].filter(Boolean));
      const edifBody=h('div',{});
      edifItems.forEach(it=>edifBody.appendChild(renderActionItem(it)));
      edifHdr.addEventListener('click',()=>{
        isExpanded.v=!isExpanded.v;
        edifBody.style.display=isExpanded.v?'block':'none';
        edifHdr.lastChild.textContent=isExpanded.v?'▾':'▸';
      });
      edifCard.appendChild(edifHdr);
      edifCard.appendChild(edifBody);
      wrap.appendChild(edifCard);
    });
    return wrap;
  }

  // Construir stats boxes (referencias guardadas para actualizar inline)
  let statPend,statDone;
  const statsRow=h('div',{className:'stats-row'},[]);
  const makeStatBox=(val,label)=>{
    const b=statBox(val,label);
    return b;
  };
  const pendStatEl=h('div',{className:'stat-box'},[
    (statPend=h('div',{className:'stat-val'},[pending.length.toString()])),
    h('div',{className:'stat-label'},['Pendientes']),
  ]);
  const doneStatEl=h('div',{className:'stat-box'},[
    (statDone=h('div',{className:'stat-val'},[done.length.toString()])),
    h('div',{className:'stat-label'},['Completadas']),
  ]);
  const totalStatEl=statBox(allItems.length.toString(),'Total');
  statsRow.appendChild(pendStatEl);
  statsRow.appendChild(doneStatEl);
  statsRow.appendChild(totalStatEl);

  const el=h('div',{className:'fade-in'},[
    topbar(`${actionDef.icon} ${actionDef.label}`,backView,backParams),
    h('div',{style:{fontSize:'0.82rem',color:'var(--tx-2)',marginBottom:'12px'}},[scopeLabel+' — '+allItems.length+' registros']),
    statsRow,

    // Botón informe (solo cuando scope = edificio único)
    isSingleEdif&&allItems.length?h('button',{
      className:'btn btn-ghost',
      style:{width:'100%',justifyContent:'center',marginBottom:'var(--gap)',fontSize:'0.85rem'},
      onClick:()=>navigate('actionReport',{edif:edifStart,actionId,backView:'actionDetail',backParams:viewParams})
    },['📋 Ver informe detallado — Edif. '+edifStart]):null,

    // Bulk actions
    isEditor()&&allItems.length?h('div',{style:{display:'flex',gap:'8px',marginBottom:'var(--gap)',flexWrap:'wrap'}},[
      pending.length?h('button',{className:'btn btn-sm btn-primary',onClick:()=>{
        if(confirm(`¿Marcar las ${pending.length} acciones pendientes como completadas?`))bulkToggle(pending,true);
      }},['✓ Completar todas ('+pending.length+')']):null,
      done.length?h('button',{className:'btn btn-sm btn-ghost',onClick:()=>{
        if(confirm(`¿Reabrir las ${done.length} acciones completadas?`))bulkToggle(done,false);
      }},['↩ Reabrir ('+done.length+')']):null,
    ].filter(Boolean)):null,

    // Lista pendientes — ítems NO desaparecen al marcar (toggle inline)
    pending.length?h('div',{},[
      h('div',{style:{padding:'8px 12px',fontWeight:'600',fontSize:'0.85rem',color:'var(--ac-orange)',marginBottom:'4px',display:'flex',alignItems:'center',gap:'8px'}},[
        h('span',{style:{flex:1}},['⏳ Pendientes']),
        h('span',{className:'badge badge-orange'},[pending.length.toString()]),
      ]),
      renderGroupedByEdif(pending),
    ]):null,

    // Lista completadas — colapsable, visible
    done.length?h('div',{},[
      h('div',{style:{padding:'8px 12px',fontWeight:'600',fontSize:'0.85rem',color:'var(--ac-green)',marginBottom:'4px',display:'flex',alignItems:'center',gap:'8px',cursor:'pointer'},
        onClick:(ev)=>{
          const next=ev.currentTarget.nextElementSibling;
          if(next)next.style.display=next.style.display==='none'?'block':'none';
          ev.currentTarget.lastChild.textContent=next&&next.style.display!=='none'?'▾':'▸';
        }
      },[
        h('span',{style:{flex:1}},['✓ Completadas']),
        h('span',{className:'badge badge-green'},[done.length.toString()]),
        h('span',{style:{fontSize:'0.9rem'}},['▾']),
      ]),
      h('div',{},[renderGroupedByEdif(done)]),
    ]):null,

    !allItems.length?h('div',{className:'card'},[
      h('div',{style:{color:'var(--tx-2)',fontSize:'0.85rem',padding:'8px 0',textAlign:'center'}},['Sin registros de esta acción']),
    ]):null,

    renderSyncBar(),
  ].filter(Boolean));
  app().innerHTML='';
  app().appendChild(el);
}

/* ============================================
   VIEW: INVENTARIO — faltantes, acopio, recepciones y pedido
   ============================================ */
function getInventario(){
  if(!DATA.inventario)DATA.inventario={recepciones:[],meta:{}};
  if(!DATA.bodega)DATA.bodega={items:[]};
  if(!DATA.inventario.recepciones)DATA.inventario.recepciones=[];
  if(!DATA.inventario.meta)DATA.inventario.meta={};
  return DATA.inventario;
}
// scope: {tipo:'global'} | {tipo:'sa',sa:N} | {tipo:'bldg',edif:N}
function scopeEdifs(scope){
  if(!scope||scope.tipo==='global')return Object.keys(BUILDINGS).map(Number);
  if(scope.tipo==='sa'){const[a,b]=SA_RANGES[scope.sa];const r=[];for(let e=a;e<=b;e++)r.push(e);return r;}
  if(scope.tipo==='bldg')return [parseInt(scope.edif)];
  return Object.keys(BUILDINGS).map(Number);
}
function scopeLabel(scope){
  if(!scope||scope.tipo==='global')return 'Todo el proyecto';
  if(scope.tipo==='sa')return SA_NAMES[scope.sa];
  if(scope.tipo==='bldg')return 'Edif. '+scope.edif;
  return 'Todo el proyecto';
}

// Agrega por código de ventana. Devuelve filas ordenadas + totales.
function computeInventario(edifs){
  const set=new Set(edifs.map(Number));
  const byCode={};
  const ensure=(code,loc)=>{
    if(!byCode[code])byCode[code]={code,loc:loc||'',requeridas:0,instaladas:0,pendientes:0,
      faltantes:0,aQuitar:0,faltaHoja:0,enAcopio:0,recibidas:0,saldo:0,detalle:[],
      orient:{Derecha:0,Izquierda:0,'—':0},
      hojas:{correderaFalta:0,correderaDanada:0,fijaFalta:0,fijaDanada:0,m130:0,m1285:0,sinMedir:0}};
    if(loc&&!byCode[code].loc)byCode[code].loc=loc;
    return byCode[code];
  };
  edifs.forEach(e=>{
    forEachWindowInBldg(e,(w,key,ctx)=>{
      const r=ensure(ctx.code,ctx.loc);
      r.requeridas++;
      const o=getOrientacion(ctx.depto)||'—';
      if(r.orient[o]===undefined)r.orient[o]=0;
      r.orient[o]++;
      if(!w)return;
      if(w.estado==='instalada')r.instaladas++;
      else if(w.estado==='quitar')r.aQuitar++;
      else if(w.estado==='sinVentana'){r.faltantes++;r.detalle.push({edif:e,depto:ctx.depto,loc:ctx.loc,orient:o});}
      else r.pendientes++;
      const d=w.deficiencias||{};
      if(d.faltaHojaCorredera||d.faltaHojaFija)r.faltaHoja++;
      // Desglose de hojas y medidas
      const hj=w.hojas||{};
      if(hj.corredera==='falta')r.hojas.correderaFalta++;
      else if(hj.corredera==='danada')r.hojas.correderaDanada++;
      if(hj.fija==='falta')r.hojas.fijaFalta++;
      else if(hj.fija==='danada')r.hojas.fijaDanada++;
      if(hj.medida==='130')r.hojas.m130++;
      else if(hj.medida==='128.5')r.hojas.m1285++;
      else if(codeUsaMedida(ctx.code))r.hojas.sinMedir++;
    });
    const cf=(DATA.buildings[bKey(e)]||{}).conteoFisico;
    if(cf&&cf.items)Object.entries(cf.items).forEach(([code,n])=>{ensure(code).enAcopio+=(n||0);});
  });
  // Recepciones: si el scope es acotado, solo cuentan las dirigidas a algún edificio del scope.
  const global=set.size>=Object.keys(BUILDINGS).length;
  getInventario().recepciones.forEach(rec=>{
    const dest=rec.edifsDestino||[];
    const aplica=global||dest.length===0||dest.some(e=>set.has(Number(e)));
    if(!aplica)return;
    Object.entries(rec.items||{}).forEach(([code,n])=>{if(byCode[code])byCode[code].recibidas+=(n||0);});
  });
  const rows=Object.values(byCode);
  rows.forEach(r=>{r.saldo=r.enAcopio+r.recibidas-r.faltantes;});
  rows.sort((a,b)=>(b.faltantes-a.faltantes)||a.code.localeCompare(b.code));
  const tot=rows.reduce((t,r)=>({
    requeridas:t.requeridas+r.requeridas, instaladas:t.instaladas+r.instaladas,
    pendientes:t.pendientes+r.pendientes, aQuitar:t.aQuitar+r.aQuitar,
    faltantes:t.faltantes+r.faltantes, faltaHoja:t.faltaHoja+r.faltaHoja,
    enAcopio:t.enAcopio+r.enAcopio, recibidas:t.recibidas+r.recibidas,
    saldo:t.saldo+Math.min(0,r.saldo),
  }),{requeridas:0,instaladas:0,pendientes:0,aQuitar:0,faltantes:0,faltaHoja:0,enAcopio:0,recibidas:0,saldo:0});
  return {rows,tot};
}

function renderInventario(){
  const inv=getInventario();
  const scope=inv.meta.scope||(viewParams.edif?{tipo:'bldg',edif:viewParams.edif}:{tipo:'global'});
  const edifs=scopeEdifs(scope);
  const {rows,tot}=computeInventario(edifs);
  const setScope=(s)=>{inv.meta.scope=s;saveLocalNow();renderInventario();};
  const chip=(label,s,active)=>h('button',{
    className:'btn btn-sm '+(active?'btn-primary':'btn-ghost'),
    style:{fontSize:'0.72rem',padding:'5px 9px'},onClick:()=>setScope(s)
  },[label]);

  const el=h('div',{className:'fade-in'},[
    topbar('📦 Inventario de Ventanas', viewParams.edif?'building':'dashboard', viewParams.edif?{edif:viewParams.edif}:{}),

    h('div',{className:'card'},[
      h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',fontWeight:'600',marginBottom:'5px'}},['Alcance:']),
      h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'10px'}},[
        chip('Todo el proyecto',{tipo:'global'},scope.tipo==='global'),

        viewParams.edif?chip('Edif. '+viewParams.edif,{tipo:'bldg',edif:viewParams.edif},scope.tipo==='bldg'&&String(scope.edif)===String(viewParams.edif)):null,
      ].filter(Boolean)),
      h('div',{className:'stats-row'},[
        statBox(String(tot.requeridas-tot.instaladas),'Faltan instalar'),
        statBox(String(tot.faltantes),'Sin ventana'),
        statBox(String(tot.enAcopio+tot.recibidas),'Disponibles'),
        statBox(String(Math.abs(tot.saldo)),'A pedir'),
      ]),
      // Desglose del universo de vanos, para que los números cierren a la vista.
      h('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'6px'}},[
        h('span',{className:'badge',style:{fontSize:'0.7rem'}},[tot.requeridas+' vanos']),
        h('span',{className:'badge badge-green',style:{fontSize:'0.7rem'}},[tot.instaladas+' instaladas']),
        tot.pendientes?h('span',{className:'badge badge-orange',style:{fontSize:'0.7rem'},
          title:'La ventana está en obra, todavía no se instaló. No se pide.'},[tot.pendientes+' pendientes']):null,
        tot.faltantes?h('span',{className:'badge badge-red',style:{fontSize:'0.7rem'},
          title:'Marcadas "Sin Ventana": no hay unidad física. Esto es lo que se pide.'},[tot.faltantes+' sin ventana']):null,
        tot.aQuitar?h('span',{className:'badge badge-purple',style:{fontSize:'0.7rem'}},[tot.aQuitar+' a quitar']):null,
      ].filter(Boolean)),
      h('div',{style:{fontSize:'0.7rem',color:'var(--tx-2)',marginBottom:'8px',lineHeight:'1.5'}},[
        'Faltan instalar '+(tot.requeridas-tot.instaladas)+': '+tot.pendientes+' ya están en obra, '+
        tot.faltantes+' hay que pedirlas'+(tot.aQuitar?', '+tot.aQuitar+' son a quitar':'')+'.'
      ]),
      (tot.instaladas+tot.pendientes+tot.faltantes+tot.aQuitar!==tot.requeridas)
        ? h('div',{style:{padding:'6px 8px',background:'var(--ac-red-soft)',color:'var(--ac-red)',
            borderRadius:'var(--radius-sm)',fontSize:'0.75rem',fontWeight:'600',marginBottom:'8px'}},
            ['⚠ Los estados no suman el total de vanos — revisá las filas marcadas con ⚠'])
        : null,
      tot.faltaHoja?h('div',{style:{padding:'6px 8px',background:'var(--ac-purple-soft)',color:'var(--ac-purple)',
        borderRadius:'var(--radius-sm)',fontSize:'0.78rem',fontWeight:'600',marginBottom:'8px'}},
        ['🪟 '+tot.faltaHoja+' ventana(s) instaladas con hoja faltante']):null,
    ].filter(Boolean)),

    // Tabla por tipo
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',fontSize:'0.88rem',marginBottom:'8px'}},['Detalle por tipo — '+scopeLabel(scope)]),
      h('div',{className:'inv-scroll'},[
        h('table',{className:'inv-table'},[
          h('thead',{},[h('tr',{},[
            h('th',{},['Tipo']),h('th',{},['Req']),h('th',{},['Inst']),
            h('th',{title:'Vanos que faltan instalar = Req − Inst'},['x Inst']),
            h('th',{title:'La ventana está en obra pero todavía no se instaló'},['Pend']),
            h('th',{title:'Marcadas "Sin Ventana": no hay unidad física, esto es lo que se pide'},['S/Vent']),
            h('th',{title:'Marcadas para quitar'},['Quit']),
            h('th',{},['Hoja']),h('th',{},['Acopio']),
            h('th',{},['Recib']),h('th',{},['Saldo']),
          ])]),
          h('tbody',{},rows.map(r=>{
            // Dos lecturas distintas que antes se confundían:
            //  - porInstalar: todo lo que falta instalar (Req − Inst)
            //  - faltantes:   solo las que no tienen unidad física (a pedir)

// Busca vanos donde falta / está dañada la corredera, filtrando por medida, tipo y orientación.
// Las ventanas sin medida registrada se incluyen al final (candidatas, hay que medir).
function findHojaDestinos({medida,code,orientacion}={}){
  const exactas=[],sinMedir=[];
  Object.keys(BUILDINGS).map(Number).forEach(e=>{
    forEachWindowInBldg(e,(w,key,ctx)=>{
      if(!w)return;
      const hj=w.hojas||{};
      if(hj.corredera!=='falta'&&hj.corredera!=='danada')return;
      if(code&&ctx.code!==code)return;
      const o=getOrientacion(ctx.depto);
      if(orientacion&&o!==orientacion)return;
      const row={edif:e,depto:ctx.depto,code:ctx.code,loc:ctx.loc,orient:o||'—',
        medida:hj.medida||'',estado:hj.corredera,key,comentario:hj.comentario||''};
      if(!medida){exactas.push(row);return;}
      if(hj.medida===medida)exactas.push(row);
      else if(!hj.medida)sinMedir.push(row);
    });
  });
  const ord=(a,b)=>(a.edif-b.edif)||String(a.depto).localeCompare(String(b.depto))||a.code.localeCompare(b.code);
  exactas.sort(ord);sinMedir.sort(ord);
  return {exactas,sinMedir};
}

let danosFiltro=null;
function collectDanos(edifs,filtro){
  const res=[];
  edifs.forEach(e=>forEachWindowInBldg(e,(w,key,ctx)=>{
    if(!w||!w.deficiencias)return;
    const activos=DEFS_CRITICAS.filter(id=>w.deficiencias[id]);
    if(!activos.length)return;
    if(filtro&&!activos.includes(filtro))return;
    const hj=w.hojas||{};
    res.push({edif:e,depto:ctx.depto,code:ctx.code,loc:ctx.loc,
      orient:getOrientacion(ctx.depto)||'—',medida:hj.medida||'',
      danos:activos,estado:w.estado,obs:w.observaciones||'',key});
  }));
  res.sort((a,b)=>(a.edif-b.edif)||String(a.depto).localeCompare(String(b.depto))||a.code.localeCompare(b.code));
  return res;
}

        ...DEFS_CRITICAS.map(id=>{

          return h('button',{className:'btn btn-sm '+(act?'btn-primary':'btn-ghost'),

// Modal de alta/edición de cargamento recibido
function showRecepcionModal(recId,onDone){
  const inv=getInventario();
  const existing=recId?inv.recepciones.find(r=>r.id===recId):null;
  const draft=existing
    ? {id:existing.id,fecha:existing.fecha,guia:existing.guia||'',nota:existing.nota||'',
       edifsDestino:(existing.edifsDestino||[]).slice(),
       esperado:Object.assign({},existing.esperado||{}),
       items:Object.assign({},existing.items||{})}
    : {id:'rec_'+Date.now(),fecha:todayISO(),guia:'',nota:'',edifsDestino:[],esperado:{},items:{}};
  // modo: 'guia' = cargar lo que dice la guía de despacho · 'contar' = contar en obra
  let modo=(existing&&Object.keys(draft.esperado).length)?'contar':'guia';
  const overlay=h('div',{className:'overlay',onClick:closeOnBackdropClick},[]);
  // Referencias a los badges de totales, para actualizarlos sin redibujar.
  let badgeGuia=null,badgeContado=null,badgeDif=null;
  function refreshTotales(){
    const t=Object.values(draft.items).reduce((s,q)=>s+q,0);
    const te=Object.values(draft.esperado).reduce((s,q)=>s+q,0);
    if(badgeGuia)badgeGuia.textContent='Guía: '+te;
    if(badgeContado){
      badgeContado.textContent='Contado: '+t;
      badgeContado.className='badge '+(t?'badge-green':'badge-orange');
    }
    if(badgeDif){
      const hay=te>0&&t!==te;
      badgeDif.hidden=!hay;
      if(hay)badgeDif.textContent=(t-te>0?'+':'')+(t-te);
    }
  }

  function draw(){
    // preservar inputs de texto antes del redraw
    const g=overlay.querySelector('#rec-guia'); if(g)draft.guia=g.value;
    const n=overlay.querySelector('#rec-nota'); if(n)draft.nota=n.value;
    const t=overlay.querySelector('#rec-torres'); if(t)draft.edifsDestino=t.value.split(/[,\s]+/).map(s=>parseInt(s)).filter(x=>x>=1&&x<=34);
    const f=overlay.querySelector('#rec-fecha'); if(f&&f.value)draft.fecha=f.value;
    overlay.innerHTML='';
    const total=Object.values(draft.items).reduce((s,q)=>s+q,0);
    const totalEsp=Object.values(draft.esperado).reduce((s,q)=>s+q,0);
    const inputStyle={padding:'8px 10px',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',
      background:'var(--bg-2)',color:'var(--tx-1)',fontSize:'0.85rem',width:'100%'};
    overlay.appendChild(h('div',{className:'modal',style:{maxHeight:'92vh',overflowY:'auto'}},[
      h('h3',{style:{marginBottom:'10px'}},[existing?'✏️ Editar cargamento':'🚚 Registrar cargamento']),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'8px',marginBottom:'12px'}},[
        h('label',{style:{fontSize:'0.75rem',color:'var(--tx-2)',fontWeight:'600'}},['Fecha de llegada']),
        h('input',{id:'rec-fecha',type:'date',value:draft.fecha,style:inputStyle}),
        h('label',{style:{fontSize:'0.75rem',color:'var(--tx-2)',fontWeight:'600'}},['Guía / remito (opcional)']),
        h('input',{id:'rec-guia',type:'text',value:draft.guia,placeholder:'N° de guía de despacho',style:inputStyle}),
        h('label',{style:{fontSize:'0.75rem',color:'var(--tx-2)',fontWeight:'600'}},['Torres destino (opcional, separadas por coma)']),
        h('input',{id:'rec-torres',type:'text',value:draft.edifsDestino.join(', '),placeholder:'12, 13, 14',style:inputStyle}),
      ]),
      // Selector de modo: cargar guía / contar en obra
      h('div',{style:{display:'flex',gap:'5px',marginBottom:'10px'}},[
        h('button',{className:'btn btn-sm '+(modo==='guia'?'btn-primary':'btn-ghost'),
          style:{flex:1,justifyContent:'center',fontSize:'0.78rem'},
          onClick:()=>{modo='guia';draw();}},['1️⃣ Cargar guía']),
        h('button',{className:'btn btn-sm '+(modo==='contar'?'btn-primary':'btn-ghost'),
          style:{flex:1,justifyContent:'center',fontSize:'0.78rem'},
          onClick:()=>{modo='contar';draw();}},['2️⃣ Contar en obra']),
      ]),
      // Badges de totales: se actualizan in-place al tocar un stepper, sin
      // redibujar el modal (si no, la lista salta al tope y se corta la carga).
      (()=>{
        badgeGuia=h('span',{className:'badge badge-blue',style:{fontSize:'0.7rem'}},['Guía: '+totalEsp]);
        badgeContado=h('span',{className:'badge '+(total?'badge-green':'badge-orange'),style:{fontSize:'0.7rem'}},['Contado: '+total]);
        badgeDif=h('span',{className:'badge badge-red',style:{fontSize:'0.7rem'}},['']);
        badgeDif.hidden=!(totalEsp>0&&total!==totalEsp);
        if(!badgeDif.hidden)badgeDif.textContent=(total-totalEsp>0?'+':'')+(total-totalEsp);
        return h('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'6px',gap:'6px',flexWrap:'wrap'}},[
          h('div',{style:{fontWeight:'600',fontSize:'0.85rem'}},[modo==='guia'?'Según guía de despacho':'Contado al descargar']),
          h('div',{style:{display:'flex',gap:'4px'}},[badgeGuia,badgeContado,badgeDif]),
        ]);
      })(),
      modo==='contar'&&totalEsp===0?h('div',{style:{fontSize:'0.72rem',color:'var(--ac-orange)',marginBottom:'6px'}},
        ['Sin guía cargada — se registra solo lo contado.']):null,
      h('div',{style:{maxHeight:'40vh',overflowY:'auto',marginBottom:'12px'}},
        getAllWindowCodes().map(({code,loc})=>{
          const esp=draft.esperado[code]||0;
          const got=draft.items[code]||0;
          // En modo contar, ocultar tipos que no vienen en la guía (si hay guía cargada)
          if(modo==='contar'&&totalEsp>0&&esp===0&&got===0)return null;
          const mostrarDif=modo==='contar'&&esp>0;
          const celdaDif=h('span',{style:{fontSize:'0.7rem',fontFamily:'var(--font-mono)',minWidth:'54px',textAlign:'right',fontWeight:'700'}},['']);
          const pintarDif=()=>{
            if(!mostrarDif)return;
            const g=draft.items[code]||0, e2=draft.esperado[code]||0;
            celdaDif.textContent=(g===e2)?('✓ '+e2):(g+'/'+e2);
            celdaDif.style.color=(g===e2)?'var(--ac-green)':'var(--ac-red)';
          };
          pintarDif();
          return h('div',{className:'conteo-row'},[
            h('span',{className:'conteo-code'},[code]),
            h('span',{className:'conteo-loc'},[loc]),
            mostrarDif?celdaDif:null,
            modo==='guia'
              ? stepper(esp,(v)=>{if(v>0)draft.esperado[code]=v;else delete draft.esperado[code];refreshTotales();})
              : stepper(got,(v)=>{if(v>0)draft.items[code]=v;else delete draft.items[code];pintarDif();refreshTotales();}),
          ].filter(Boolean));
        }).filter(Boolean)
      ),
      (modo==='guia'&&totalEsp>0)?h('button',{className:'btn btn-sm btn-ghost',style:{width:'100%',marginBottom:'10px',color:'var(--ac-cyan)'},
        onClick:()=>{draft.items=Object.assign({},draft.esperado);modo='contar';draw();}
      },['📋 Copiar guía a contado (y revisar diferencias)']):null,
      h('label',{style:{fontSize:'0.75rem',color:'var(--tx-2)',fontWeight:'600'}},['Nota (opcional)']),
      h('textarea',{id:'rec-nota',className:'obs-area',style:{minHeight:'44px',fontSize:'0.8rem',marginBottom:'12px'},
        placeholder:'Observaciones del cargamento...'},[draft.nota]),
      h('div',{style:{display:'flex',gap:'8px'}},[
        h('button',{className:'btn btn-sm btn-ghost',style:{flex:1},onClick:()=>overlay.remove()},['Cancelar']),
        h('button',{className:'btn btn-sm btn-primary',style:{flex:1},onClick:()=>{
          const g2=overlay.querySelector('#rec-guia'); if(g2)draft.guia=g2.value.trim();
          const n2=overlay.querySelector('#rec-nota'); if(n2)draft.nota=n2.value.trim();
          const t2=overlay.querySelector('#rec-torres'); if(t2)draft.edifsDestino=t2.value.split(/[,\s]+/).map(s=>parseInt(s)).filter(x=>x>=1&&x<=34);
          const f2=overlay.querySelector('#rec-fecha'); if(f2&&f2.value)draft.fecha=f2.value;
          if(Object.keys(draft.items).length===0&&Object.keys(draft.esperado).length===0)
            return alert('Cargá la guía o contá al menos una unidad antes de guardar.');
          const i2=getInventario();
          const idx=i2.recepciones.findIndex(r=>r.id===draft.id);
          if(idx>=0)i2.recepciones[idx]=draft; else i2.recepciones.push(draft);
          saveLocalNow();
          overlay.remove();
          if(onDone)onDone();
        }},['💾 Guardar']),
      ]),
    ]));
  }
  draw();
  document.body.appendChild(overlay);
}

// Texto del pedido para oficina técnica
function generatePedidoText(scope){
  const edifs=scopeEdifs(scope);
  const {rows,tot}=computeInventario(edifs);
  const L=[];
  L.push('PEDIDO DE VENTANAS — Condominio Alberto Fuchslocher');
  L.push('Generado: '+ts()+' · Alcance: '+scopeLabel(scope));
  L.push('='.repeat(52));
  L.push('');
  const conFalta=rows.filter(r=>r.faltantes>0);
  L.push('RESUMEN POR TIPO');
  if(!conFalta.length)L.push('  Sin ventanas faltantes registradas.');
  else{
    conFalta.forEach(r=>{
      const pad=(winFullName(r.code)+'                ').slice(0,16);
      L.push('  '+pad+String(r.faltantes).padStart(3)+' faltan · '+String(r.enAcopio).padStart(3)+' acopio · '+
        String(r.recibidas).padStart(3)+' recib · saldo '+(r.saldo<0?String(r.saldo):'OK'));
    });
    const aPedir=conFalta.reduce((s,r)=>s+Math.max(0,-r.saldo),0);
    L.push('');
    L.push('  TOTAL A PEDIR: '+aPedir+' unidades');
  }
  L.push('');
  if(tot.faltaHoja>0){
    let hc=0,hf=0;
    edifs.forEach(e=>forEachWindowInBldg(e,(w)=>{
      if(!w||!w.deficiencias)return;
      if(w.deficiencias.faltaHojaCorredera)hc++;
      if(w.deficiencias.faltaHojaFija)hf++;
    }));
    L.push('FALTA HOJA (ventana instalada, hoja faltante)');
    L.push('  Hoja corredera: '+hc+' · Hoja fija: '+hf);
    L.push('');
  }
  const reps=collectReposiciones(edifs,null);
  if(reps.length){
    L.push('REPOSICIONES');
    REPO_ESTADOS.forEach(r=>{
      const n=reps.filter(x=>x.estado===r.id).length;
      if(n)L.push('  '+(r.label+'                    ').slice(0,24)+String(n).padStart(3));
    });
    const pend=reps.filter(x=>x.estado==='enviada');
    if(pend.length){
      L.push('');
      L.push('  Pendientes de volver del proveedor:');
      pend.forEach(r=>L.push('    Torre '+r.edif+' — '+r.depto+' — '+winFullName(r.code)+
        (r.fechaRetiro?'  (retirada '+r.fechaRetiro+')':'')));
    }
    L.push('');
  }
  if(conFalta.length){
    L.push('DETALLE POR TORRE Y DEPTO');
    const det=[];
    conFalta.forEach(r=>r.detalle.forEach(d=>det.push({...d,code:r.code})));
    det.sort((a,b)=>(a.edif-b.edif)||String(a.depto).localeCompare(String(b.depto))||a.code.localeCompare(b.code));
    det.forEach(d=>L.push('  Torre '+d.edif+' — '+d.depto+' — '+winFullName(d.code)+(d.loc?' ('+d.loc+')':'')));
    L.push('');
    L.push('  Total vanos sin ventana: '+det.length);
  }
  L.push('');
  L.push('='.repeat(52));
  L.push('VentaControl v2.26');
  return L.join('\n');
}

    L.push('  '+(r.label+'                      ').slice(0,26)+String(n).padStart(3));

/* ============================================
   BODEGA — material disponible para reponer
   ============================================ */
// Categorias de material que se guardan en bodega.
const BODEGA_CATS = [
  {id:'termopanelCorredera', label:'Termopanel de corredera', icon:'▧', usaMedida:true,  repone:'corredera'},
  {id:'termopanelFijo',      label:'Termopanel de hoja fija',  icon:'▨', usaMedida:false, repone:'fija'},
  {id:'hojaCorredera',       label:'Hoja corredera completa',  icon:'⬌', usaMedida:true,  repone:'corredera'},
  {id:'ventanaCompleta',     label:'Ventana completa',         icon:'🪟', usaMedida:false, repone:'ventana'},
];
function bodegaCat(id){ return BODEGA_CATS.find(c=>c.id===id)||null; }

function getBodega(){
  if(!DATA.bodega)DATA.bodega={items:[]};
  if(!DATA.bodega.items)DATA.bodega.items=[];
  return DATA.bodega;
}
function bodegaTotal(){ return getBodega().items.reduce((s,it)=>s+(it.cantidad||0),0); }

// Un item de bodega: {id, cat, tipoVentana, medida, orientacion, cantidad, ubicacion, nota}
// tipoVentana / medida / orientacion pueden ir vacios cuando no se conocen.
function bodegaUpsert(item){
  const b=getBodega();
  const i=b.items.findIndex(x=>x.id===item.id);
  if(i>=0)b.items[i]=item; else b.items.push(item);
  saveLocalNow();
}
function bodegaDelete(id){
  const b=getBodega();
  b.items=b.items.filter(x=>x.id!==id);
  saveLocalNow();
}

/* Buscador inverso: dado un item de bodega, devuelve los vanos donde encaja.
   - Para correderas: vanos con hoja corredera faltante o danada.
   - Para hoja fija:  vanos con hoja fija faltante o danada.
   - Para ventana completa: vanos marcados 'sinVentana'.
   Separa los que calzan exacto en medida de los que aun no tienen medida
   relevada (candidatos: hay que ir a medir). */
function bodegaDestinos(item){
  const cat=bodegaCat(item.cat);
  if(!cat)return {exactas:[],sinMedir:[]};
  const exactas=[],sinMedir=[];
  Object.keys(BUILDINGS).map(Number).forEach(e=>{
    forEachWindowInBldg(e,(w,key,ctx)=>{
      if(!w)return;
      if(item.tipoVentana&&ctx.code!==item.tipoVentana)return;
      const o=getOrientacion(ctx.depto)||'—';
      if(item.orientacion&&o!==item.orientacion)return;
      const hj=w.hojas||{};
      let aplica=false;
      if(cat.repone==='corredera')      aplica=(hj.corredera==='falta'||hj.corredera==='danada');
      else if(cat.repone==='fija')      aplica=(hj.fija==='falta'||hj.fija==='danada');
      else if(cat.repone==='ventana')   aplica=(w.estado==='sinVentana');
      if(!aplica)return;
      const row={edif:e,depto:ctx.depto,code:ctx.code,loc:ctx.loc,orient:o,
        medida:hj.medida||'',estado:w.estado,key};
      if(!cat.usaMedida||!item.medida){exactas.push(row);return;}
      if(hj.medida===item.medida)exactas.push(row);
      else if(!hj.medida)sinMedir.push(row);
    });
  });
  const ord=(a,b)=>(a.edif-b.edif)||String(a.depto).localeCompare(String(b.depto))||a.code.localeCompare(b.code);
  exactas.sort(ord);sinMedir.sort(ord);
  return {exactas,sinMedir};
}

let syncing=false;

function fetchWithTimeout(url,opts={},timeoutMs=30000){
  return Promise.race([
    fetch(url,opts),
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timeout: el servidor no respondió en '+Math.round(timeoutMs/1000)+'s')),timeoutMs))
  ]);
}

// ---- BACKUP SNAPSHOTS (auto al sync, manual restore) ----
const BACKUP_PREFIX='vc2_bak_';
const MAX_BACKUPS=3;
function saveBackupSnapshot(){
  try{
    // Snapshot en formato compacto y sin fotos: comparte cupo con el registro
    // principal, así que tiene que ocupar lo mínimo.
    const safe={ts:ts(),version:'v2.26',compact:true,data:packData(true)};
    const keys=Object.keys(localStorage).filter(k=>k.indexOf(BACKUP_PREFIX)===0).sort();
    while(keys.length>=MAX_BACKUPS) localStorage.removeItem(keys.shift());
    localStorage.setItem(BACKUP_PREFIX+Date.now(),JSON.stringify(safe));
    if(DEBUG)console.log('[VC] Backup snapshot guardado');
  }catch(e){
    // Si no entra, se descartan los backups viejos antes que arriesgar el
    // registro principal.
    Object.keys(localStorage).filter(k=>k.indexOf(BACKUP_PREFIX)===0)
      .forEach(k=>localStorage.removeItem(k));
    if(DEBUG)console.warn('[VC] Backup falló:',e.message);
  }
}
function listBackups(){
  return Object.keys(localStorage)
    .filter(k=>k.startsWith(BACKUP_PREFIX))
    .sort().reverse()  // más reciente primero
    .map(k=>{try{const v=JSON.parse(localStorage.getItem(k));return{key:k,ts:v.ts,version:v.version,size:localStorage.getItem(k).length};}catch(e){return null;}})
    .filter(Boolean);
}
function restoreBackup(key){
  if(!confirm('¿Restaurar este backup?\n\nSe sobreescribirán TODOS los datos locales actuales. Las fotos no se restauran (no se incluyen en backup por tamaño).\n\nNo se puede deshacer.'))return;
  try{
    const snap=JSON.parse(localStorage.getItem(key));
    if(!snap||!snap.data)throw new Error('Backup corrupto');
    // Los snapshots nuevos vienen en formato compacto; los viejos, enteros.
    DATA=(snap.compact||(snap.data&&snap.data._v===STORE_VERSION))?unpackData(snap.data):snap.data;
    saveLocalNow();
    _searchIndex=null;
    alert('Backup restaurado: '+snap.ts+'\n\nLa app se recargará.');
    location.reload();
  }catch(e){alert('Error restaurando: '+e.message);}
}

// Push-only: solo SUBE cambios locales al Sheet. NUNCA descarga. Seguro contra pérdida de datos.
async function doPushOnly(){
  if(syncing)return showSyncMsg('Ya sincronizando, espera...');
  if(!APPS_SCRIPT_URL)return showSyncMsg('⚠ Configura APPS_SCRIPT_URL primero');
  const payload=buildSyncPayload(true);
  if(payload.length===0)return showSyncMsg('✓ Sin cambios locales para subir');
  syncing=true;
  saveBackupSnapshot();  // backup ANTES de cualquier operación de red
  const btn=$('#sync-btn');
  if(btn)btn.disabled=true;
  try{
    showSyncMsg(`⏳ Subiendo ${payload.length} cambios (PUSH ONLY)...`);
    const CHUNK=100;
    let tU=0,tI=0;
    for(let i=0;i<payload.length;i+=CHUNK){
      const chunk=payload.slice(i,i+CHUNK);
      if(payload.length>CHUNK)showSyncMsg(`⏳ Subiendo lote ${Math.floor(i/CHUNK)+1}/${Math.ceil(payload.length/CHUNK)}...`);
      const r=await fetchWithTimeout(APPS_SCRIPT_URL,{
        method:'POST',headers:{'Content-Type':'text/plain'},redirect:'follow',
        body:JSON.stringify({action:'sync',records:chunk})
      },120000);
      const res=await r.json();
      if(res.status!=='ok')throw new Error(res.message||'Error del servidor');
      tU+=(res.updates||0);tI+=(res.inserts||0);
    }
    dirtyKeys.clear();
    saveDirtyKeys();
    DATA.meta.lastSync=ts();
    saveLocalNow();
    showSyncMsg(`✓ PUSH: ${tU} actualizados, ${tI} nuevos · ${ts()}`);
  }catch(err){
    showSyncMsg('⚠ Push falló: '+err.message+' — dirty keys NO se borraron');
  }
  syncing=false;
  if(btn)btn.disabled=false;
}

// Sync principal (v2.26): SOLO PUSH. Antes hacía pull automático que sobrescribía
// datos locales con remoto desactualizado. Ahora pull es estrictamente opt-in.
// Alias de doPushOnly para compat con botón existente.
async function doSync(){ return doPushOnly(); }

// Si querés bajar datos del sheet (cambiar dispositivo, recovery), usa
// "⬇ Restaurar desde Sheet" en menú ⋮ → con doble confirm.
async function doRestoreFromSheet(){
  if(syncing)return showSyncMsg('Ya sincronizando, espera...');
  if(!APPS_SCRIPT_URL)return showSyncMsg('⚠ Configura APPS_SCRIPT_URL primero');
  // Doble confirm
  const msg1=`⚠ RESTAURAR DESDE GOOGLE SHEET\n\nEsto descarga el contenido actual de la hoja y lo aplica encima de los datos locales.\n\nSi hay diferencias entre tu app y el sheet, tu app gana SOLO en las ventanas marcadas como dirty (con cambios sin subir): ${dirtyKeys.size} ventanas dirty.\n\nLas demás se sobrescriben con lo del sheet, aunque el sheet esté desactualizado.\n\n¿Continuar?`;
  if(!confirm(msg1))return showSyncMsg('Restore cancelado');
  if(dirtyKeys.size>0&&!confirm(`Tenés ${dirtyKeys.size} cambios SIN SUBIR. Subilos primero con "⬆ Push" para no perderlos.\n\n¿Restaurar de todas formas?`))return showSyncMsg('Restore cancelado');
  syncing=true;
  saveBackupSnapshot();
  const btn=$('#sync-btn');
  if(btn)btn.disabled=true;
  try{
    showSyncMsg('⬇ Descargando del sheet...');
    const res=await fetchWithTimeout(APPS_SCRIPT_URL+'?action=read',{redirect:'follow'},60000);
    const data=await res.json();
    if(data.status==='ok'&&(data.records||data.rows)){
      const records=data.records||data.rows;
      mergeFromSheets(records);
      DATA.meta.lastSync=ts();
      saveLocalNow();
      showSyncMsg(`✓ Restaurado: ${records.length} registros · ${ts()}`);
      render();
    } else {
      showSyncMsg('⚠ '+(data.message||'Sin datos en respuesta'));
    }
  }catch(err){
    showSyncMsg('⚠ '+err.message);
  }
  syncing=false;
  if(btn)btn.disabled=false;
}

// Pull only — download data from Sheets without pushing anything
async function doPullOnly(){
  if(syncing)return showSyncMsg('Ya sincronizando, espera...');
  if(!APPS_SCRIPT_URL)return showSyncMsg('⚠ Configura APPS_SCRIPT_URL primero');
  // ⚠ AVISO si hay cambios locales sin subir
  if(dirtyKeys.size>0){
    if(!confirm(`⚠ Tienes ${dirtyKeys.size} ventanas con cambios locales sin subir.\n\nSi haces PULL ahora, esos cambios se PROTEGEN (mergeFromSheets salta dirty keys). PERO si la lista de dirty se perdió por algún bug previo, podrías sobrescribir datos.\n\nRecomendado: cancela, usa "⬆ Push only" primero para subir cambios.\n\n¿Continuar con PULL?`)){
      return showSyncMsg('PULL cancelado por usuario');
    }
  }
  syncing=true;
  saveBackupSnapshot();  // backup ANTES del pull (siempre)
  showSyncMsg('⬇ Descargando datos de Sheets...');
  const btn=$('#pull-btn');
  if(btn)btn.disabled=true;
  try{
    logMsg('Pull: iniciando descarga...');
    const res=await fetchWithTimeout(APPS_SCRIPT_URL+'?action=read',{redirect:'follow'},60000);
    const data=await res.json();
    logMsg(`Pull: respuesta status=${data.status}, records=${(data.records||data.rows||[]).length}`);
    if(data.status==='ok'&&(data.records||data.rows)){
      const records=data.records||data.rows;
      mergeFromSheets(records);
      DATA.meta.lastSync=ts();
      saveLocalNow();
      logMsg('Pull: datos guardados en localStorage');
      showSyncMsg(`✓ ${records.length} registros descargados · ${ts()}`);
      render();
    } else {
      showSyncMsg('⚠ '+(data.message||'Sin datos en respuesta'));
    }
  }catch(err){
    showSyncMsg('⚠ '+err.message);
  }
  syncing=false;
  if(btn)btn.disabled=false;
}

// Pull section — download data for a specific building (optionally filtered to dept client-side)
async function doPullSection(edif,depto){
  if(syncing)return showSyncMsg('Ya sincronizando, espera...');
  if(!APPS_SCRIPT_URL)return showSyncMsg('⚠ Configura APPS_SCRIPT_URL primero');
  // Aviso si hay cambios dirty del edificio que está bajando
  const dirtyOfBldg=[...dirtyKeys].filter(k=>k.startsWith(String(edif)+'-')).length;
  if(dirtyOfBldg>0){
    if(!confirm(`⚠ Tienes ${dirtyOfBldg} cambios locales SIN SUBIR en Edif. ${edif}.\n\nEl pull los protege (skip dirty), pero recomendado: cancela y usa "⬆ Push only" primero.\n\n¿Continuar pull?`)){
      return showSyncMsg('Pull sección cancelado');
    }
  }
  syncing=true;
  saveBackupSnapshot();  // backup ANTES
  const label=depto?`Depto ${depto} (Edif. ${edif})`:`Edif. ${edif}`;
  showSyncMsg(`⬇ Descargando ${label}...`);
  logMsg(`Pull sección: ${label}`);
  const btn=$('#pull-btn');
  if(btn)btn.disabled=true;
  try{
    // Pedir solo el edificio al servidor
    const res=await fetchWithTimeout(APPS_SCRIPT_URL+`?action=read&edif=${edif}`,{redirect:'follow'},45000);
    const data=await res.json();
    if(data.status==='ok'&&(data.records||data.rows)){
      let records=data.records||data.rows;
      logMsg(`Pull sección: ${records.length} registros para Edif. ${edif}`);
      // Si se pidió un depto específico, filtrar client-side
      if(depto){
        const deptoStr=String(depto);
        records=records.filter(r=>String(r.depto).trim()===deptoStr);
        logMsg(`Filtrado a depto ${depto}: ${records.length} registros`);
      }
      mergeFromSheets(records);
      DATA.meta.lastSync=ts();
      saveLocalNow();
      showSyncMsg(`✓ ${records.length} reg. de ${label} · ${ts()}`);
      render();
    } else {
      showSyncMsg('⚠ '+(data.message||'Sin datos'));
    }
  }catch(err){
    showSyncMsg('⚠ '+err.message);
    logMsg('Pull sección error: '+err.message);
  }
  syncing=false;
  if(btn)btn.disabled=false;
}

// Push all — for first-time full sync
async function doFullSync(){
  if(syncing)return;
  if(!confirm('¿Enviar TODAS las ventanas? Esto puede tardar varios minutos.\n\nUsa esto solo si es la primera sincronización o necesitas resubir todo.'))return;
  // Mark all keys as dirty
  Object.keys(DATA.windows).forEach(k=>dirtyKeys.add(k));
  doSync();
}

function buildSyncPayload(dirtyOnly=false){
  const rows=[];
  for(const[key,w] of Object.entries(DATA.windows)){
    if(dirtyOnly&&!dirtyKeys.has(key))continue;
    const parts=key.split('-');
    const edif=parts[0];
    const depto=parts[1];                      // '101', 'EC1', etc.
    const code=parts.slice(2).join('-');        // rejoin codes con guión como 'V1-Izq'

    let piso='',tipoDept='',tipoElem='';
    if(depto.startsWith('EC')){
      piso=depto.replace('EC','');
      tipoDept='EC';
      tipoElem=code==='PV1'?'Mampara Acceso':code==='PV2'?'Mampara Trasera':code==='V8'?'Ventanal Escalera':'Ventana Escalera';
    } else {
      const dNum=parseInt(depto);
      piso=Math.floor(dNum/100);
      const posIdx=(dNum%100)-1;
      tipoDept=getDeptType(parseInt(edif),parseInt(piso),posIdx)||'?';
      const winDef=(getDeptWindows(tipoDept)||[]).find(([c])=>c===code);
      tipoElem=winDef?winDef[1]:code;
    }

    rows.push({
      edif:parseInt(edif), piso, depto, tipo_depto:tipoDept,
      elemento:code, tipo_elemento:tipoElem,
      estado:w.estado,
      separacion:w.deficiencias.separacion?1:0,
      descuadre:w.deficiencias.descuadre?1:0,
      desaplomo:w.deficiencias.desaplomo?1:0,
      sinSellador:w.deficiencias.sinSellador?1:0,
      sinSelladorFrente:w.deficiencias.sinSelladorFrente?1:0,
      retornoMalla:w.deficiencias.retornoMalla?1:0,
      mallaPulida:w.deficiencias.mallaPulida?1:0,
      vidrioTrizado:w.deficiencias.vidrioTrizado?1:0,
      marcoPerforado:w.deficiencias.marcoPerforado?1:0,
      faltaFijacion:w.deficiencias.faltaFijacion?1:0,
      sinImpermeabilizar:w.deficiencias.sinImpermeabilizar?1:0,
      faltaHojaCorredera:w.deficiencias.faltaHojaCorredera?1:0,
      faltaHojaFija:w.deficiencias.faltaHojaFija?1:0,
      funcionamientoDeficiente:w.deficiencias.funcionamientoDeficiente?1:0,
      termopanelTrizado:w.deficiencias.termopanelTrizado?1:0,
      pvcRoto:w.deficiencias.pvcRoto?1:0,
      filtracionAgua:w.deficiencias.filtracionAgua?1:0,
      hoja_corredera:(w.hojas||{}).corredera||'',
      hoja_fija:(w.hojas||{}).fija||'',
      hoja_medida:(w.hojas||{}).medida||'',
      hoja_comentario:(w.hojas||{}).comentario||'',
      repo_estado:(w.reposicion||{}).estado||'',
      repo_fechaRetiro:(w.reposicion||{}).fechaRetiro||'',
      repo_fechaRetorno:(w.reposicion||{}).fechaRetorno||'',
      repo_comentario:(w.reposicion||{}).comentario||'',
      vano:w.estadoVano||'',
      obs:w.observaciones||'',
      act_pulir:w.acciones.pulir?.active?(w.acciones.pulir.done?'done':'pending'):'',
      act_impermeabilizar:w.acciones.impermeabilizar?.active?(w.acciones.impermeabilizar.done?'done':'pending'):'',
      act_repararEIFS:w.acciones.repararEIFS?.active?(w.acciones.repararEIFS.done?'done':'pending'):'',
      act_aplomar:w.acciones.aplomar?.active?(w.acciones.aplomar.done?'done':'pending'):'',
      act_sellarFrente:w.acciones.sellarFrente?.active?(w.acciones.sellarFrente.done?'done':'pending'):'',
      act_reemplazarVidrio:w.acciones.reemplazarVidrio?.active?(w.acciones.reemplazarVidrio.done?'done':'pending'):'',
      act_repararMarco:w.acciones.repararMarco?.active?(w.acciones.repararMarco.done?'done':'pending'):'',
      act_instalarFijacion:w.acciones.instalarFijacion?.active?(w.acciones.instalarFijacion.done?'done':'pending'):'',
      act_cargarMortero:w.acciones.cargarMortero?.active?(w.acciones.cargarMortero.done?'done':'pending'):'',
      act_impermeabilizarRasgo:w.acciones.impermeabilizarRasgo?.active?(w.acciones.impermeabilizarRasgo.done?'done':'pending'):'',
      act_reponerHoja:w.acciones.reponerHoja?.active?(w.acciones.reponerHoja.done?'done':'pending'):'',
      etapa:(DATA.buildings[bKey(parseInt(edif))]||{}).stage||'',
    });
  }
  return rows;
}

function mergeFromSheets(rows){
  logMsg(`mergeFromSheets: recibidos ${rows.length} registros`);
  // Helper: parsear bool desde valor del sheet
  function pb(v){ if(v===undefined||v===null||v==='')return undefined; if(typeof v==='string')return v==='Sí'||v==='Si'||v==='1'||v==='true'; return !!parseInt(v); }
  function pd(r,newKey,oldKey,backcompat){ const v=r[newKey]!==undefined?r[newKey]:(r[oldKey]!==undefined?r[oldKey]:(backcompat!==undefined?r[backcompat]:undefined)); return pb(v); }

  function normalizeEstado(val){
    if(!val)return null;
    const s=String(val).toLowerCase().trim();
    if(s==='instalada'||s==='instalado'||s==='si'||s==='sí')return 'instalada';
    if(s==='pendiente')return 'pendiente';
    if(s.includes('no instal')||s==='no'||s==='noinstalada')return 'noInstalada';
    if(s==='quitar'||s==='desinstalar'||s==='retirar')return 'quitar';
    if(s==='no instalar'||s==='noinstalar')return 'noInstalada'; // migrado
    if(s==='sin ventana'||s==='sinventana')return 'sinVentana';
    if(['instalada','pendiente','noInstalada','quitar','sinVentana'].includes(val))return val;
    if(val==='noInstalar')return 'noInstalada'; // migrado
    return null;
  }

  function normalizeVano(val){
    if(!val)return '';
    const s=String(val).trim();
    // Mapear a los valores exactos de VANO_OPTS
    const sl=s.toLowerCase();
    if(sl==='ok')return 'OK';
    if(sl.startsWith('sobre'))return 'Sobredimensionado';
    if(sl.startsWith('sub'))return 'Subdimensionado';
    if(sl.startsWith('pulir')||sl==='pulir')return '';  // Pulir ya no es estado de rasgo
    return s;
  }

  let merged=0,skipped=0,noMatch=0,estadoUpdated=0,vanoUpdated=0;
  // Log primeros 3 registros como muestra
  if(rows.length>0){
    const samples=rows.slice(0,3);
    samples.forEach((r,i)=>logMsg(`Muestra[${i}]: edif=${r.edif} depto=${r.depto} elem=${r.elemento||r.code} estado="${r.estado}" vano="${r.vano}" obs="${(r.obs||'').slice(0,30)}"`));
  }

  rows.forEach(r=>{
    const edif=String(r.edif||'').trim();
    let depto=String(r.depto||'').trim();
    const elem=String(r.elemento||r.code||'').trim();
    const piso=String(r.piso||'').trim();
    if(!edif||!elem){skipped++;return;}

    // Espacios comunes
    if(!depto&&piso&&['V8','V9','PV1','PV2'].includes(elem)){
      depto='EC'+piso;
    }
    if((!depto||depto==='EC')&&(r.tipo_depto==='EC')&&piso){
      depto='EC'+piso;
    }
    if(!depto){skipped++;return;}

    // Legacy v2.26: V1_D2 en depto tipo B pasó a llamarse V1_D2-B.
    // Sin esto, las filas viejas del Sheet crearían registros fantasma.
    let elemNorm=elem;
    if(elem==='V1_D2'&&!String(depto).startsWith('EC')){
      const dn=parseInt(depto);
      if(!isNaN(dn)){
        const f=Math.floor(dn/100), pi=(dn%100)-1;
        if(f>=1&&f<=5&&pi>=0&&pi<4&&BUILDINGS[parseInt(edif)]&&getDeptType(parseInt(edif),f,pi)==='B')elemNorm='V1_D2-B';
      }
    }
    const key=r.key||`${edif}-${depto}-${elemNorm}`;
    const exists=!!DATA.windows[key];

    // CRITICAL: Skip keys with unsaved local changes — local wins over remote
    if(dirtyKeys.has(key)){
      logMsg(`merge SKIP dirty key: ${key}`);
      skipped++;
      return;
    }

    if(!exists){
      DATA.windows[key]=newWindowRecord();
      noMatch++;
    }
    const w=DATA.windows[key];

    // Estado
    const rawEstado=r.estado;
    const estado=normalizeEstado(rawEstado);
    if(estado){
      const oldEstado=w.estado;
      w.estado=estado;
      if(oldEstado!==estado)estadoUpdated++;
    }

    // Vano — normalizar para que coincida con VANO_OPTS
    const rawVano=r.vano!==undefined?r.vano:r.estadoVano;
    if(rawVano!==undefined&&rawVano!==''){
      const vano=normalizeVano(rawVano);
      if(vano){
        w.estadoVano=vano;
        vanoUpdated++;
      }
    }

    // Observaciones
    const obs=r.obs!==undefined?r.obs:r.observaciones;
    if(obs!==undefined&&obs!=='')w.observaciones=String(obs).trim();

    // Deficiencias
    const d=w.deficiencias;
    const dmap={
      separacion:   pd(r,'separacion',   'def_separacion'),
      descuadre:    pd(r,'descuadre',    'def_descuadre'),
      desaplomo:    pd(r,'desaplomo',    'def_desaplomo'),
      sinSellador:  pd(r,'sinSellador',  'def_sinSellador','fc11'),
      sinSelladorFrente: pd(r,'sinSelladorFrente','def_sinSelladorFrente'),
      retornoMalla: pd(r,'retornoMalla', 'def_retornoMalla','eifs'),
      mallaPulida:  pd(r,'mallaPulida',  'def_mallaPulida'),
      vidrioTrizado:pd(r,'vidrioTrizado','def_vidrioTrizado'),
      marcoPerforado:pd(r,'marcoPerforado','def_marcoPerforado'),
      faltaFijacion:pd(r,'faltaFijacion','def_faltaFijacion'),
      sinImpermeabilizar:pd(r,'sinImpermeabilizar','def_sinImpermeabilizar'),
      faltaHojaCorredera:pd(r,'faltaHojaCorredera','def_faltaHojaCorredera'),
      faltaHojaFija:pd(r,'faltaHojaFija','def_faltaHojaFija'),
      funcionamientoDeficiente:pd(r,'funcionamientoDeficiente','def_funcionamientoDeficiente'),
      termopanelTrizado:pd(r,'termopanelTrizado','def_termopanelTrizado'),
      pvcRoto:pd(r,'pvcRoto','def_pvcRoto'),
      filtracionAgua:pd(r,'filtracionAgua','def_filtracionAgua'),
    };
    Object.entries(dmap).forEach(([k,v])=>{if(v!==undefined)d[k]=v;});
    // Hojas (v2.26)
    if(r.hoja_corredera!==undefined||r.hoja_fija!==undefined||r.hoja_medida!==undefined){
      const hj=getHojas(w);
      if(r.hoja_corredera!==undefined&&r.hoja_corredera!=='')hj.corredera=String(r.hoja_corredera);
      if(r.hoja_fija!==undefined&&r.hoja_fija!=='')hj.fija=String(r.hoja_fija);
      if(r.hoja_medida!==undefined&&r.hoja_medida!=='')hj.medida=String(r.hoja_medida);
      if(r.hoja_comentario!==undefined&&r.hoja_comentario!=='')hj.comentario=String(r.hoja_comentario);
      syncHojasToDef(w);
    }
    // Reposición (v2.26)
    if(r.repo_estado!==undefined||r.repo_fechaRetiro!==undefined){
      const rp=getRepo(w);
      if(r.repo_estado!==undefined&&r.repo_estado!=='')rp.estado=String(r.repo_estado);
      if(r.repo_fechaRetiro!==undefined&&r.repo_fechaRetiro!=='')rp.fechaRetiro=String(r.repo_fechaRetiro);
      if(r.repo_fechaRetorno!==undefined&&r.repo_fechaRetorno!=='')rp.fechaRetorno=String(r.repo_fechaRetorno);
      if(r.repo_comentario!==undefined&&r.repo_comentario!=='')rp.comentario=String(r.repo_comentario);
    }
    ACTION_IDS.forEach(a=>{
      if(!w.acciones[a])w.acciones[a]={active:false,done:false};
      const val=r['act_'+a];
      if(val==='done'){w.acciones[a].active=true;w.acciones[a].done=true;}
      else if(val==='pending'){w.acciones[a].active=true;w.acciones[a].done=false;}
    });
    merged++;
  });

  logMsg(`Resultado merge: ${merged} procesados, ${estadoUpdated} estados actualizados, ${vanoUpdated} vanos, ${skipped} saltados, ${noMatch} keys nuevas (no existían en app)`);

  // Verificación post-merge: revisar si los datos se aplicaron
  if(rows.length>0){
    const sample=rows[0];
    const sKey=`${String(sample.edif).trim()}-${String(sample.depto||'').trim()}-${String(sample.elemento||sample.code||'').trim()}`;
    const sWin=DATA.windows[sKey];
    if(sWin){
      logMsg(`Verificación key "${sKey}": estado=${sWin.estado}, vano=${sWin.estadoVano}, obs=${(sWin.observaciones||'').slice(0,30)}`);
    } else {
      logMsg(`Verificación: key "${sKey}" NO ENCONTRADA en DATA.windows`);
      // Buscar keys similares
      const similar=Object.keys(DATA.windows).filter(k=>k.startsWith(String(sample.edif))).slice(0,5);
      logMsg(`Keys similares para edif ${sample.edif}: ${similar.join(', ')}`);
    }
  }

  saveLocalNow();
}

/* ============================================
   CSV EXPORT / IMPORT
   ============================================ */
function exportCSV(){
  const rows=buildSyncPayload();
  const headers=Object.keys(rows[0]);
  let csv=headers.join(',')+'\n';
  rows.forEach(r=>{
    csv+=headers.map(h=>{
      let v=String(r[h]||'');
      if(v.includes(',')||v.includes('"')||v.includes('\n'))v='"'+v.replace(/"/g,'""')+'"';
      return v;
    }).join(',')+'\n';
  });
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=`VentaControl_v2_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();URL.revokeObjectURL(url);
}

function importCSV(){
  const input=document.createElement('input');
  input.type='file';input.accept='.csv';
  input.onchange=(e)=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=(ev)=>{
      try{
        const lines=ev.target.result.split('\n').filter(l=>l.trim());
        const headers=lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
        // Procesar todas las filas en un solo batch
        const allRows=[];
        for(let i=1;i<lines.length;i++){
          const vals=parseCSVLine(lines[i]);
          const row={};
          headers.forEach((h,j)=>row[h]=vals[j]||'');
          allRows.push(row);
        }
        // Merge en un solo paso (sin saveLocal por cada fila)
        mergeFromSheets(allRows);
        saveLocalNow();
        alert('Importación completada: '+allRows.length+' filas');
        render();
      }catch(err){alert('Error importando: '+err.message);}
    };
    reader.readAsText(file);
  };
  input.click();
}

function parseCSVLine(line){
  const result=[];let current='';let inQuotes=false;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(inQuotes){
      if(c==='"'&&line[i+1]==='"'){current+='"';i++;}
      else if(c==='"')inQuotes=false;
      else current+=c;
    }else{
      if(c==='"')inQuotes=true;
      else if(c===','){result.push(current);current='';}
      else current+=c;
    }
  }
  result.push(current);
  return result;
}

/* ============================================
   V1 MIGRATION
   ============================================ */
function migrateV1(){
  // Try to read v1 localStorage
  const v1Data=localStorage.getItem('ventanas_data')||localStorage.getItem('control_ventanas');
  if(!v1Data){
    // Try common v1 key patterns
    const keys=Object.keys(localStorage).filter(k=>k.includes('ventana')||k.includes('window'));
    if(keys.length===0){
      alert('No se encontraron datos de v1 en localStorage.\n\nPuedes importar desde CSV usando el botón "Importar CSV".');
      return;
    }
  }
  try{
    const parsed=JSON.parse(v1Data);
    let migrated=0;
    // V1 format: rows with Edificio, Depto, Elemento, Estado, deficiencies
    if(Array.isArray(parsed)){
      parsed.forEach(row=>{
        const key=`${row.Edificio||row.edificio}-${row.Depto||row.depto}-${row.Elemento||row.elemento||row.Ventana||row.ventana}`;
        if(!DATA.windows[key])DATA.windows[key]=newWindowRecord();
        const w=DATA.windows[key];
        // Map v1 estado
        const est=(row.Estado||row.estado||'').toLowerCase();
        if(est.includes('instal'))w.estado='instalada';
        else if(est.includes('pend'))w.estado='pendiente';
        else w.estado='noInstalada';
        // Map v1 deficiencies
        if(row.separacion||row['Separación']||row.sep)w.deficiencias.separacion=true;
        if(row.descuadre||row['Descuadre'])w.deficiencias.descuadre=true;
        if(row.sellador||row['Sin sellador']||row.sinSellador)w.deficiencias.sinSellador=true;
        if(row.retorno||row['Retorno malla']||row.retornoMalla)w.deficiencias.retornoMalla=true;
        // Map vano
        const vano=(row.estadoVano||row.EstadoVano||row.vano||'');
        if(vano)w.estadoVano=vano;
        // Observations
        if(row.observaciones||row.Observaciones)w.observaciones=row.observaciones||row.Observaciones;
        w.historial.unshift({t:ts(),cambio:'Migrado desde v1'});
        migrated++;
      });
    }else if(typeof parsed==='object'){
      // Could be key-value format
      for(const[k,v] of Object.entries(parsed)){
        if(DATA.windows[k]&&v){
          Object.assign(DATA.windows[k],{...newWindowRecord(),...v});
          migrated++;
        }
      }
    }
    if(migrated>0)_searchIndex=null;
    saveLocalNow();
    alert(`Migración completada: ${migrated} registros importados.`);
    render();
  }catch(err){
    alert('Error en migración: '+err.message+'\n\nIntenta importar desde CSV.');
  }
}

/* ============================================
   INITIALIZATION
   ============================================ */
(function init(){
  // Apply saved theme
  const savedTheme=localStorage.getItem('vc2_theme');
  if(savedTheme)document.body.setAttribute('data-theme',savedTheme);

  // Apply saved paper size for printing (default 'letter')
  applyPaperSize(getPaperSize());

  // Init data
  initData();
  if(!DATA.personas)DATA.personas=[];
  if(!DATA.inventario)DATA.inventario={recepciones:[],meta:{}};
  if(!DATA.bodega)DATA.bodega={items:[]};

  // IMPORTANTE: debe correr ANTES del bloque de integridad. Si no, el loop de
  // integridad crearía fichas vacías con el código nuevo y dejaría huérfanas
  // las viejas con todos los datos cargados.
  migrateV1D2B();
  migrateFuncionalidad();

  // Verify data integrity - ensure all windows exist
  let added=0;
  for(const[edif,cfg] of Object.entries(BUILDINGS)){
    const e=parseInt(edif);
    if(!DATA.buildings[bKey(e)])DATA.buildings[bKey(e)]={comment:'',accionesPendientes:{},stage:0};
    if(DATA.buildings[bKey(e)].stage===undefined)DATA.buildings[bKey(e)].stage=0;
    for(let f=1;f<=5;f++){
      for(let p=0;p<4;p++){
        const tipo=getDeptType(e,f,p);
        const dn=deptNum(f,p);
        getDeptWindows(tipo).forEach(([code])=>{
          const key=wKey(e,dn,code);
          if(!DATA.windows[key]){DATA.windows[key]=newWindowRecord();added++;}
          // Ensure v2 fields exist on old records
          const w=DATA.windows[key];
          if(!w.acciones)w.acciones={};
          // Ensure all action fields exist
          ACTION_IDS.forEach(a=>{
            if(!w.acciones[a])w.acciones[a]={active:false,done:false};
          });
          if(!w.historial)w.historial=[];
          if(!w.fotos)w.fotos=[];
          if(!w.deficiencias)w.deficiencias={};
          // Ensure all deficiency fields exist (handles migration from older records)
          DEF_IDS.forEach(f=>{
            if(w.deficiencias[f]===undefined)w.deficiencias[f]=false;
          });
          if(!w.selloExterior)w.selloExterior={estado:'sinSellar',grado:0,comentario:''};
          if(!w.hojas)w.hojas={corredera:'',fija:'',medida:'',comentario:''};
          if(!w.reposicion)w.reposicion={estado:'',fechaRetiro:'',fechaRetorno:'',comentario:''};
          if(w.funcionalidad===undefined)w.funcionalidad=0;
          if(w.estadoVano==='Pulir'){w.estadoVano='';saveLocal();}
          if(w.estado===undefined)w.estado='noInstalada';
          // Migrar 'noInstalar' → 'noInstalada' (estado eliminado v2.6)
          if(w.estado==='noInstalar')w.estado='noInstalada';
        });
      }
      getCommonWindows(f).forEach(([code])=>{
        const key=wKey(e,`EC${f}`,code);
        if(!DATA.windows[key]){DATA.windows[key]=newWindowRecord();added++;}
        const w=DATA.windows[key];
        if(!w.acciones)w.acciones={};
        ACTION_IDS.forEach(a=>{
          if(!w.acciones[a])w.acciones[a]={active:false,done:false};
        });
        if(!w.historial)w.historial=[];
        if(!w.fotos)w.fotos=[];
        if(!w.deficiencias)w.deficiencias={};
        DEF_IDS.forEach(f=>{
          if(w.deficiencias[f]===undefined)w.deficiencias[f]=false;
        });
        if(!w.selloExterior)w.selloExterior={estado:'sinSellar',grado:0,comentario:''};
        if(!w.hojas)w.hojas={corredera:'',fija:'',medida:'',comentario:''};
        if(!w.reposicion)w.reposicion={estado:'',fechaRetiro:'',fechaRetorno:'',comentario:''};
        if(w.funcionalidad===undefined)w.funcionalidad=0;
        if(w.estadoVano==='Pulir'){w.estadoVano='';saveLocal();}
        // Migrar 'noInstalar' → 'noInstalada' (estado eliminado v2.6)
        if(w.estado==='noInstalar')w.estado='noInstalada';
      });
    }
  }
  if(added>0){_searchIndex=null;saveLocalNow();if(DEBUG)console.log('Agregadas '+added+' ventanas faltantes');}

  // Count total windows
  const totalWins=Object.keys(DATA.windows).length;
  if(DEBUG)console.log('VentaControl v2.26 — '+totalWins+' ventanas cargadas');

  // Prevent accidental exit — Android back-button / swipe gesture
  const _vcBase=location.href.split('#')[0];
  if(!history.state?.vc){
    history.pushState({vc:'app'},'',_vcBase+'#vc');
  }
  window.addEventListener('popstate',()=>{
    // Re-push sentinel so app stays "inside" history
    history.pushState({vc:'app'},'',_vcBase+'#vc');
    if(confirm('¿Salir de VentaControl?\n\nTus datos están guardados en el dispositivo.')){
      history.go(-2); // Jump past sentinel → exit / previous page
    }
  });
  // Desktop fallback
  window.addEventListener('beforeunload',(e)=>{e.preventDefault();e.returnValue='';});

  // Render
  render();
})();

// PWA service worker
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW:',e));
}
</script>
