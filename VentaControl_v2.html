/* ============================================
   VIEW: SEAL MAP — exterior seal status grid
   ============================================ */
function renderSealMap(){
  const edif=viewParams.edif;
  const e=parseInt(edif);

  const selloColors={
    sellado:  {bg:'var(--ac-green-soft)',  bdr:'var(--ac-green)',  txt:'var(--ac-green)'},
    pendiente:{bg:'var(--ac-orange-soft)', bdr:'var(--ac-orange)', txt:'var(--ac-orange)'},
    sinSellar:{bg:'var(--bg-2)',           bdr:'var(--border)',    txt:'var(--tx-2)'},
    deficiente:{bg:'var(--ac-red-soft)',   bdr:'var(--ac-red)',    txt:'var(--ac-red)'},
  };

  // Get selloExterior estado for a window key
  function getSelloEstado(key){
    const w=DATA.windows[key];
    if(!w)return null;
    return w.selloExterior;
  }

  // Global counts
  let cSellado=0,cPendiente=0,cSinSellar=0,cDeficiente=0;
  forEachWindowInBldg(e, (_w, key)=>{
    const se=getSelloEstado(key);
    if(!se)return;
    if(se.estado==='sellado')cSellado++;
    else if(se.estado==='pendiente')cPendiente++;
    else if(se.estado==='deficiente')cDeficiente++;
    else cSinSellar++;
  });

  // Build a single cell TD with touch events
  function sealCell(key,code,deptoLabel){
    const w=DATA.windows[key];
    const td=document.createElement('td');
    td.style.cssText='text-align:center;padding:2px 3px;border-bottom:1px solid var(--border);';

    if(!w){
      td.textContent='—';
      td.style.color='var(--tx-2)';
      return td;
    }
    const se=w.selloExterior;
    const c=selloColors[se.estado]||selloColors.sinSellar;

    const inner=document.createElement('div');
    inner.style.cssText=`
      width:40px;height:40px;border-radius:6px;display:flex;align-items:center;
      justify-content:center;margin:0 auto;background:${c.bg};
      border:2px solid ${c.bdr};font-size:${se.estado==='deficiente'?'0.75rem':'1rem'};
      font-weight:700;color:${c.txt};user-select:none;-webkit-user-select:none;
      -webkit-touch-callout:none;cursor:${isEditor()?'pointer':'default'};
      position:relative;
    `;
    let sym=se.estado==='sellado'?'✓':se.estado==='pendiente'?'◷':se.estado==='deficiente'?(se.grado?se.grado+'⚠':'⚠'):'·';
    inner.textContent=sym;
    td.appendChild(inner);

    if(!isEditor())return td;

    // Long-press → full popup, short tap → cycle sellado↔sinSellar
    let pressTimer=null,longFired=false,touchHandled=false,scrolled=false,startX=0,startY=0;

    inner.addEventListener('touchstart',(ev)=>{
      longFired=false;touchHandled=false;scrolled=false;
      startX=ev.touches[0].clientX;startY=ev.touches[0].clientY;
      pressTimer=setTimeout(()=>{
        if(scrolled)return;
        longFired=true;touchHandled=true;
        navigator.vibrate&&navigator.vibrate(50);
        showSelloPopup(key,code,deptoLabel,()=>renderSealMap());
      },450);
    },{passive:true});

    inner.addEventListener('touchmove',(ev)=>{
      if(Math.abs(ev.touches[0].clientX-startX)>10||Math.abs(ev.touches[0].clientY-startY)>10){
        scrolled=true;clearTimeout(pressTimer);
      }
    },{passive:true});

    inner.addEventListener('touchend',()=>{
      clearTimeout(pressTimer);
      if(!longFired&&!scrolled){
        touchHandled=true;
        // Quick tap: cycle sellado ↔ sinSellar
        w.selloExterior.estado=se.estado==='sellado'?'sinSellar':'sellado';
        if(w.selloExterior.estado!=='deficiente')w.selloExterior.grado=0;
        saveLocal();renderSealMap();
      }
    },{passive:true});

    inner.addEventListener('contextmenu',(ev)=>ev.preventDefault());

    inner.addEventListener('click',()=>{
      if(!touchHandled&&!scrolled){
        showSelloPopup(key,code,deptoLabel,()=>renderSealMap());
      }
      touchHandled=false;longFired=false;scrolled=false;
    });

    return td;
  }

  // Build section counts for a set of (key,code) pairs
  function secCounts(pairs){
    let done=0,total=0;
    pairs.forEach(({key})=>{
      const se=getSelloEstado(key);
      if(se){total++;if(se.estado==='sellado')done++;}
    });
    return{done,total,pct:total?Math.round(done/total*100):0};
  }

  // Render a depto position section (handles mixed types — MR piso 1, A/B pisos 2-5)
  function posSection(posIdx,posLabel){
    // Collect codes per floor (type may differ between floor 1 and floors 2-5)
    const floorCodes={};
    for(let f=1;f<=5;f++){
      floorCodes[f]=getDeptWindows(getDeptType(e,f,posIdx)).map(([c])=>c);
    }
    // All unique codes in appearance order (floor 1 first, then new ones from upper floors)
    const allCodes=[],seen=new Set();
    for(let f=1;f<=5;f++) floorCodes[f].forEach(c=>{if(!seen.has(c)){seen.add(c);allCodes.push(c);}});
    if(!allCodes.length)return null;

    // Detect mixed-type position (e.g. MR on floor 1, A/B on floors 2-5)
    const tipo1=getDeptType(e,1,posIdx);
    const tipo25=getDeptType(e,2,posIdx);
    const isMixed=tipo1!==tipo25;

    // Collect pairs for counts — only floors where that code actually exists
    const allPairs=[];
    allCodes.forEach(code=>{
      for(let f=1;f<=5;f++){
        if(floorCodes[f].includes(code))allPairs.push({key:wKey(e,deptNum(f,posIdx),code),code});
      }
    });
    const{done,total,pct}=secCounts(allPairs);
    const complete=done===total&&total>0;

    const CELL_STYLE='padding:4px 8px;font-family:var(--font-mono);font-weight:600;font-size:0.78rem;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg-1);';
    const EMPTY_STYLE='text-align:center;padding:2px 3px;border-bottom:1px solid var(--border);background:var(--bg-0);';

    const tbody=document.createElement('tbody');

    // Optional separator row between floor-1-only codes and upper-floor codes
    let addedSep=false;
    allCodes.forEach(code=>{
      const onlyFloor1=floorCodes[1].includes(code)&&![2,3,4,5].some(f=>floorCodes[f].includes(code));
      const onlyUpper=!floorCodes[1].includes(code);
      // Insert separator row when transitioning from floor-1-only to upper-only (mixed type)
      if(isMixed&&!addedSep&&onlyUpper){
        addedSep=true;
        const sepTr=document.createElement('tr');
        const sepTd=document.createElement('td');
        sepTd.colSpan=6;
        sepTd.style.cssText='padding:3px 8px;font-size:0.7rem;color:var(--tx-2);background:var(--bg-2);border-bottom:1px solid var(--border);font-style:italic;';
        sepTd.textContent=`↓ Pisos 2-5 (Tipo ${tipo25})`;
        sepTr.appendChild(sepTd);
        tbody.appendChild(sepTr);
      }

      const tr=document.createElement('tr');
      const tdCode=document.createElement('td');
      tdCode.style.cssText=CELL_STYLE;
      tdCode.textContent=code;
      tr.appendChild(tdCode);

      for(let f=1;f<=5;f++){
        if(floorCodes[f].includes(code)){
          tr.appendChild(sealCell(wKey(e,deptNum(f,posIdx),code),code,`${deptNum(f,posIdx)}`));
        } else {
          const td=document.createElement('td');
          td.style.cssText=EMPTY_STYLE;
          td.innerHTML='<span style="color:var(--tx-2);font-size:0.7rem;">—</span>';
          tr.appendChild(td);
        }
      }
      tbody.appendChild(tr);
    });

    const table=document.createElement('table');
    table.style.cssText='width:100%;border-collapse:collapse;font-size:0.8rem;';
    const thead=h('thead',{},[h('tr',{},[
      h('th',{style:{textAlign:'left',padding:'6px 8px',fontWeight:'700',borderBottom:'2px solid var(--border)',background:'var(--bg-1)',whiteSpace:'nowrap'}},['Ventana']),
      ...[1,2,3,4,5].map(f=>h('th',{style:{textAlign:'center',padding:'6px 8px',fontWeight:'700',borderBottom:'2px solid var(--border)',minWidth:'44px'}},['P'+f])),
    ])]);
    table.appendChild(thead);table.appendChild(tbody);
    const wrap=document.createElement('div');wrap.style.overflowX='auto';wrap.appendChild(table);

    return h('div',{style:{marginBottom:'16px'}},[
      h('div',{style:{
        display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'6px 10px',borderRadius:'var(--radius-sm)',marginBottom:'6px',
        background:complete?'var(--ac-green-soft)':'var(--ac-blue-soft)',
        border:'1px solid '+(complete?'var(--ac-green)':'var(--ac-blue)')
      }},[
        h('span',{style:{fontWeight:'700',fontSize:'0.85rem',color:complete?'var(--ac-green)':'var(--ac-blue)'}},[
          posLabel+(isMixed?` (P1:${tipo1} · P2-5:${tipo25})`:''),
        ]),
        h('span',{style:{fontSize:'0.78rem',color:'var(--tx-2)'}},[`${done}/${total} (${pct}%)`]),
      ]),
      wrap,
    ]);
  }

  // EC section
  function ecSection(){
    const codes=[...new Set(([1,2,3,4,5].flatMap(f=>getCommonWindows(f).map(([c])=>c))))];
    if(!codes.length)return null;
    const allPairs=[];
    codes.forEach(code=>{for(let f=1;f<=5;f++)allPairs.push({key:wKey(e,`EC${f}`,code),code});});
    const{done,total}=secCounts(allPairs);
    const complete=done===total&&total>0;

    const tbody=document.createElement('tbody');
    codes.forEach(code=>{
      const tr=document.createElement('tr');
      const tdCode=document.createElement('td');
      tdCode.style.cssText='padding:4px 8px;font-family:var(--font-mono);font-weight:600;font-size:0.78rem;border-bottom:1px solid var(--border);white-space:nowrap;background:var(--bg-1);';
      tdCode.textContent=code;
      tr.appendChild(tdCode);
      for(let f=1;f<=5;f++) tr.appendChild(sealCell(wKey(e,`EC${f}`,code),code,`EC${f}`));
      tbody.appendChild(tr);
    });
    const table=document.createElement('table');
    table.style.cssText='width:100%;border-collapse:collapse;font-size:0.8rem;';
    const thead=h('thead',{},[h('tr',{},[
      h('th',{style:{textAlign:'left',padding:'6px 8px',fontWeight:'700',borderBottom:'2px solid var(--border)',background:'var(--bg-1)'}},['Ventana']),
      ...[1,2,3,4,5].map(f=>h('th',{style:{textAlign:'center',padding:'6px 8px',fontWeight:'700',borderBottom:'2px solid var(--border)',minWidth:'44px'}},['P'+f])),
    ])]);
    table.appendChild(thead);table.appendChild(tbody);
    const wrap=document.createElement('div');wrap.style.overflowX='auto';wrap.appendChild(table);
    return h('div',{style:{marginBottom:'16px'}},[
      h('div',{style:{
        display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'6px 10px',borderRadius:'var(--radius-sm)',marginBottom:'6px',
        background:complete?'var(--ac-green-soft)':'var(--ac-cyan-soft)',
        border:'1px solid '+(complete?'var(--ac-green)':'var(--ac-cyan)')
      }},[
        h('span',{style:{fontWeight:'700',fontSize:'0.85rem',color:complete?'var(--ac-green)':'var(--ac-cyan)'}},['Espacios Comunes (EC)']),
        h('span',{style:{fontSize:'0.78rem',color:'var(--tx-2)'}},[`${done}/${total}`]),
      ]),
      wrap,
    ]);
  }

  const el=h('div',{className:'fade-in'},[
    topbar(`Sello Exterior — Edif. ${edif}`,'building',{edif}),
    h('div',{className:'card'},[
      // Resumen global
      h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'10px'}},[
        cSellado?h('span',{className:'badge badge-green',style:{fontSize:'0.78rem',padding:'5px 8px'}},[cSellado+' Sellado']):null,
        cPendiente?h('span',{className:'badge badge-orange',style:{fontSize:'0.78rem',padding:'5px 8px'}},[cPendiente+' Pendiente']):null,
        cSinSellar?h('span',{className:'badge',style:{fontSize:'0.78rem',padding:'5px 8px'}},[cSinSellar+' Sin Sellar']):null,
        cDeficiente?h('span',{className:'badge badge-red',style:{fontSize:'0.78rem',padding:'5px 8px'}},[cDeficiente+' Sello Deficiente']):null,
      ].filter(Boolean)),

      // Leyenda
      h('div',{style:{display:'flex',gap:'12px',flexWrap:'wrap',marginBottom:'16px',fontSize:'0.75rem',color:'var(--tx-2)'}},[
        h('span',{},[`✓ Sellado`]),h('span',{},[`◷ Pendiente`]),
        h('span',{},[`✗ Sin Sellar`]),h('span',{},[`⚠ Deficiente`]),
        isEditor()?h('span',{style:{color:'var(--ac-blue)'}},[`Toque corto = sellado/sin sellar · Mantener = popup completo`]):null,
      ].filter(Boolean)),

      posSection(0,'X01'),posSection(1,'X02'),posSection(2,'X03'),posSection(3,'X04'),
      ecSection(),
    ]),
    renderSyncBar(),
  ]);
  app().innerHTML='';
  app().appendChild(el);
}

/* ============================================
   REPORT GENERATOR
   ============================================ */
function generateReport(edif){
  const e=parseInt(edif);
  const b=BUILDINGS[e];
  const s=getBldgStats(e);
  const now=new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines=[];
  const add=(t='')=>lines.push(t);
  const SEP='='.repeat(48);
  const sep2='-'.repeat(48);
  const pad=(s,n)=>String(s).padEnd(n);
  const padr=(s,n)=>String(s).padStart(n);

  // Collect all windows
  const byEstado={instalada:[],pendiente:[],noInstalada:[],quitar:[],sinVentana:[]};
  const byTipo={};
  const withDef=[];
  const withFunc=[];

  function collect(key,depto,code,loc,isCommon){
    const w=DATA.windows[key]||newWindowRecord();
    const estado=w.estado||'noInstalada';
    const entry={depto,code,loc,estado,w,isCommon};
    if(byEstado[estado])byEstado[estado].push(entry);
    else byEstado['noInstalada'].push(entry); // fallback para estados no reconocidos
    if(!byTipo[code])byTipo[code]={total:0,instalada:0,pendiente:0,noInstalada:0,quitar:0,sinVentana:0};
    byTipo[code].total++;
    byTipo[code][estado]=(byTipo[code][estado]||0)+1;
    const defs=DEFICIENCIES.filter(d=>w.deficiencias[d.id]);
    if(defs.length)withDef.push({...entry,defs});
    if(w.funcionalidad>0)withFunc.push(entry);
  }
  for(let f=1;f<=5;f++){
    for(let p=0;p<4;p++){
      const tipo=getDeptType(e,f,p);
      const dn=deptNum(f,p);
      getDeptWindows(tipo).forEach(([code,loc])=>collect(wKey(e,dn,code),dn,code,loc,false));
    }
    getCommonWindows(f).forEach(([code,loc])=>collect(wKey(e,`EC${f}`,code),`EC${f}`,code,loc,true));
  }

  // ── ENCABEZADO ──────────────────────────────
  add(`INFORME DE INSTALACIÓN — EDIFICIO ${e}  (Tipo ${b.tipo})`);
  add(`Generado: ${now}`);
  add(SEP);
  add('');

  // ── RESUMEN ──────────────────────────────────
  const instaladasNeto=s.instaladas-s.quitar;
  const noInstaladoTotal=s.total-instaladasNeto;
  add('RESUMEN GENERAL');
  add(sep2);
  add(`  Total ventanas       : ${s.total}`);
  add('');
  add(`  ✓ INSTALADAS (neto)  : ${instaladasNeto}  (${pct(instaladasNeto,s.total)}%)`);
  add(`    → Incluye: ${s.instaladas} instaladas − ${s.quitar} a quitar`);
  add('');
  add(`  ✗ NO INSTALADAS      : ${noInstaladoTotal}  (${pct(noInstaladoTotal,s.total)}%)`);
  if(byEstado.pendiente.length)add(`    Pendientes de inst.: ${byEstado.pendiente.length}`);
  if(byEstado.noInstalada.length)add(`    Sin instalar       : ${byEstado.noInstalada.length}`);
  if(s.quitar)add(`    A quitar (remover) : ${s.quitar}`);
  if(byEstado.sinVentana.length)add(`    Sin ventana        : ${byEstado.sinVentana.length}`);
  add('');
  if(withDef.length)add(`  Con inconformidades  : ${withDef.length} ventanas`);
  add('');

  // ── PENDIENTES ───────────────────────────────
  if(byEstado.pendiente.length){
    add(SEP);
    add(`PENDIENTES DE INSTALACIÓN  (${byEstado.pendiente.length})`);
    add(sep2);
    byEstado.pendiente.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | ${getOrientacion(it.depto)||'—'}`);
      if(it.w.observaciones)add(`    Obs: ${it.w.observaciones}`);
    });
    add('');
  }

  // ── SIN INSTALAR ─────────────────────────────
  if(byEstado.noInstalada.length){
    add(SEP);
    add(`SIN INSTALAR  (${byEstado.noInstalada.length})`);
    add(sep2);
    byEstado.noInstalada.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | ${getOrientacion(it.depto)||'—'}`);
    });
    add('');
  }

  // ── A QUITAR ─────────────────────────────────
  if(byEstado.quitar.length){
    add(SEP);
    add(`A QUITAR  (${byEstado.quitar.length})`);
    add(sep2);
    byEstado.quitar.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | ${getOrientacion(it.depto)||'—'}`);
      const mainDef=DEFICIENCIES.find(d=>it.w.deficiencias[d.id]);
      if(mainDef)add(`    Deficiencia: ${mainDef.label}`);
      if(it.w.observaciones)add(`    Observación: ${it.w.observaciones}`);
    });
    add('');
  }

  // ── INCONFORMIDADES ──────────────────────────
  if(withDef.length){
    add(SEP);
    add(`INCONFORMIDADES ACTIVAS  (${withDef.length} ventanas)`);
    add(sep2);
    withDef.forEach(it=>{
      add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${it.loc}  [${it.estado}]`);
      it.defs.forEach(d=>add(`    • ${d.label}`));
      const acts=ACTIONS.filter(a=>it.w.acciones[a.id]?.active&&!it.w.acciones[a.id]?.done);
      if(acts.length)add(`    Acciones: ${acts.map(a=>a.label).join(' | ')}`);
      if(it.w.observaciones)add(`    Obs: ${it.w.observaciones}`);
    });
    add('');
  }

  // ── ACCIONES CORRECTIVAS PENDIENTES ──────────
  const actionCounts={};
  Object.entries(byEstado).forEach(([,list])=>{
    list.forEach(it=>{
      ACTIONS.forEach(a=>{
        if(it.w.acciones[a.id]?.active&&!it.w.acciones[a.id]?.done){
          if(!actionCounts[a.id])actionCounts[a.id]={label:a.label,count:0,items:[]};
          actionCounts[a.id].count++;
          actionCounts[a.id].items.push(`${it.depto} ${it.code}`);
        }
      });
    });
  });
  const pendingActions=Object.values(actionCounts).filter(a=>a.count>0);
  if(pendingActions.length){
    add(SEP);
    add(`ACCIONES CORRECTIVAS PENDIENTES`);
    add(sep2);
    pendingActions.sort((a,b)=>b.count-a.count).forEach(a=>{
      add(`  ${pad(a.label,24)} : ${a.count} ventanas`);
    });
    add('');
  }

  // ── SELLO EXTERIOR ───────────────────────────
  const selloCounts={sellado:0,pendiente:0,sinSellar:0,deficiente:0};
  const selloDefList=[];
  Object.keys(byEstado).forEach(est=>{
    byEstado[est].forEach(it=>{
      const se=it.w.selloExterior;
      if(!se){selloCounts.sinSellar++;return;}
      if(selloCounts[se.estado]!==undefined)selloCounts[se.estado]++;
      else selloCounts.sinSellar++;
      if(se.estado==='deficiente')selloDefList.push(it);
    });
  });
  {
    add(SEP);
    add('SELLO EXTERIOR');
    add(sep2);
    add(`  Sellado          : ${selloCounts.sellado}`);
    add(`  Pendiente        : ${selloCounts.pendiente}`);
    add(`  Sin Sellar       : ${selloCounts.sinSellar}`);
    add(`  Sello Deficiente : ${selloCounts.deficiente}`);
    if(selloDefList.length){
      add('');
      add('  Detalle — Deficiencias de Sello:');
      selloDefList.forEach(it=>{
        const se=it.w.selloExterior;
        add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | Grado ${se.grado||'—'}`);
        if(se.comentario)add(`    Comentario: ${se.comentario}`);
      });
    }
    add('');
  }

  // ── FUNCIONALIDAD ────────────────────────────
  if(withFunc.length){
    const FUNC_LABELS=['','Muy Deficiente','Deficiente','Regular','Buena','Excelente'];
    const funcByCat={1:[],2:[],3:[],4:[],5:[]};
    withFunc.forEach(it=>{const n=it.w.funcionalidad||0;if(funcByCat[n])funcByCat[n].push(it);});
    add(SEP);
    add('CONDICIÓN DE FUNCIONALIDAD');
    add(sep2);
    [1,2,3,4,5].forEach(n=>{
      if(funcByCat[n].length)add(`  ${pad(n+' – '+FUNC_LABELS[n],22)} : ${funcByCat[n].length} ventanas`);
    });
    const critical=withFunc.filter(it=>it.w.funcionalidad<=2);
    if(critical.length){
      add('');
      add('  Críticas (1–2):');
      critical.forEach(it=>{
        add(`  Dpto ${pad(it.depto,6)} | ${pad(it.code,9)} | ${pad(it.loc,22)} | Func. ${it.w.funcionalidad}/5`);
        if(it.w.observaciones)add(`    Obs: ${it.w.observaciones}`);
      });
    }
    add('');
  }

  // ── PEDIDO DE VENTANAS (sinVentana) ──────────
  const sinVentanaList=byEstado.sinVentana||[];
  add(SEP);
  add(`PEDIDO DE VENTANAS  (${sinVentanaList.length} unidades)`);
  add(sep2);
  if(sinVentanaList.length){
    add(`  ${'Tipo'.padEnd(10)} ${'Dpto'.padEnd(8)} ${'Orientación'.padEnd(14)} Recinto`);
    add('  '+'-'.repeat(52));
    // Ordenar: por depto numérico, luego EC al final
    const sorted=[...sinVentanaList].sort((a,b)=>{
      const an=typeof a.depto==='number'?a.depto:9999;
      const bn=typeof b.depto==='number'?b.depto:9999;
      return an-bn||a.code.localeCompare(b.code);
    });
    sorted.forEach(it=>{
      const ori=getOrientacion(it.depto)||'—';
      add(`  ${pad(it.code,10)} ${pad(it.depto,8)} ${pad(ori,14)} ${it.loc}`);
      if(it.w.observaciones)add(`    ↳ ${it.w.observaciones.slice(0,60)}`);
    });
    add('');
    // Resumen agrupado por tipo
    add('  Resumen por tipo:');
    const porTipo={};
    sinVentanaList.forEach(it=>{porTipo[it.code]=(porTipo[it.code]||0)+1;});
    Object.entries(porTipo).sort((a,b)=>b[1]-a[1]).forEach(([tipo,cnt])=>{
      add(`    ${pad(tipo,10)} × ${cnt}`);
    });
  } else {
    add('  — Sin ventanas marcadas como "Sin Ventana" —');
  }
  add('');
  add(SEP);
  add('FIN DEL INFORME');

  return lines.join('\n');
}

/* ============================================
   INFORME RÁPIDO POR ACCIÓN CORRECTIVA
   ============================================ */
function generateActionReport(edif,actionId){
  const e=parseInt(edif);
  const b=BUILDINGS[e];
  const actionDef=ACTIONS.find(a=>a.id===actionId);
  if(!actionDef)return 'Acción no encontrada';
  const now=new Date().toLocaleString('es-CL',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
  const lines=[];
  const add=(t='')=>lines.push(t);
  const SEP='='.repeat(56);
  const sep2='-'.repeat(56);
  const pad=(s,n)=>String(s).padEnd(n);
  const padr=(s,n)=>String(s).padStart(n);

  // Collect windows with this action
  const items=[];
  for(let f=1;f<=5;f++){
    for(let p=0;p<4;p++){
      const tipo=getDeptType(e,f,p);
      const dn=deptNum(f,p);
      getDeptWindows(tipo).forEach(([code,loc])=>{
        const k=wKey(e,dn,code);
        const w=DATA.windows[k];
        if(!w)return;
        const act=w.acciones[actionId];
        if(act&&act.active){
          items.push({depto:dn,code,loc,done:act.done,obs:w.observaciones||''});
        }
      });
    }
    getCommonWindows(f).forEach(([code,loc])=>{
      const k=wKey(e,`EC${f}`,code);
      const w=DATA.windows[k];
      if(!w)return;
      const act=w.acciones[actionId];
      if(act&&act.active){
        items.push({depto:`EC${f}`,code,loc,done:act.done,obs:w.observaciones||''});
      }
    });
  }

  const pending=items.filter(i=>!i.done);
  const done=items.filter(i=>i.done);

  // ── ENCABEZADO ──────────────────────────────
  add(SEP);
  add(`ACCIÓN CORRECTIVA: ${actionDef.icon} ${actionDef.label.toUpperCase()}`);
  add(`Edificio ${e}  (Tipo ${b.tipo} · SA${b.sa})`);
  add(`Generado: ${now}`);
  add(SEP);
  add(`Total registros  : ${items.length}  (${pending.length} pendientes, ${done.length} completadas)`);
  add('');

  // ── TABLA 1: DETALLE ─────────────────────────
  if(items.length){
    add(sep2);
    add('TABLA 1 — DETALLE DE VENTANAS');
    add(sep2);
    add(`  ${pad('Dpto',8)} ${pad('Recinto',26)} ${pad('Tipo',10)} Estado   Observación`);
    add('  '+'-'.repeat(54));
    // Pendientes primero, luego completadas
    const sorted=[...pending,...done].sort((a,b)=>{
      // Ordenar por depto (numérico), luego EC al final
      const an=typeof a.depto==='number'?a.depto:9999;
      const bn=typeof b.depto==='number'?b.depto:9999;
      return an-bn||a.code.localeCompare(b.code);
    });
    sorted.forEach(it=>{
      const estado=it.done?'[CUMPLIDA]':'[PENDIENTE]';
      const obsShort=it.obs?(it.obs.length>30?it.obs.slice(0,29)+'…':it.obs):'—';
      add(`  ${pad(it.depto,8)} ${pad(it.loc,26)} ${pad(it.code,10)} ${estado}`);
      if(it.obs)add(`    ↳ ${obsShort}`);
    });
    add('');

    // ── TABLA 2: RESUMEN POR DEPTO ──────────────
    add(sep2);
    add('TABLA 2 — RESUMEN POR DEPARTAMENTO');
    add(sep2);
    // Agrupar por depto
    const byDepto={};
    pending.forEach(it=>{
      const k=String(it.depto);
      if(!byDepto[k])byDepto[k]={depto:it.depto,items:[]};
      byDepto[k].items.push(it);
    });
    const deptoList=Object.values(byDepto).sort((a,b)=>{
      const an=typeof a.depto==='number'?a.depto:9999;
      const bn=typeof b.depto==='number'?b.depto:9999;
      return an-bn;
    });
    if(deptoList.length){
      add(`  ${pad('Dpto',8)} ${padr('Ventanas',9)}  Recintos`);
      add('  '+'-'.repeat(54));
      deptoList.forEach(({depto,items:its})=>{
        const recintos=[...new Set(its.map(i=>i.loc))].join(', ');
        const recShort=recintos.length>32?recintos.slice(0,31)+'…':recintos;
        add(`  ${pad(depto,8)} ${padr(its.length,9)}  ${recShort}`);
      });
      add('');
      add(`  Total departamentos afectados (pendiente): ${deptoList.length}`);
      add(`  Total ventanas pendientes                : ${pending.length}`);
    } else {
      add('  — Sin ventanas pendientes —');
    }
    add('');
  } else {
    add('  — Sin registros para esta acción en este edificio —');
    add('');
  }

  add(SEP);
  add('FIN DEL INFORME DE ACCIÓN');
  return lines.join('\n');
}

function renderActionReport(){
  const{edif,actionId,backView,backParams}=viewParams;
  const actionDef=ACTIONS.find(a=>a.id===actionId);
  if(!actionDef){app().innerHTML='<p>Acción no encontrada</p>';return;}
  const texto=generateActionReport(edif,actionId);

  function copyR(){
    navigator.clipboard?.writeText(texto).then(()=>{
      const btn=document.getElementById('btn-copy-ar');
      if(btn){btn.textContent='✓ Copiado';setTimeout(()=>{btn.textContent='📋 Copiar';},2000);}
    });
  }
  function shareR(){
    if(navigator.share){navigator.share({title:`Acción ${actionDef.label} — Edif. ${edif}`,text:texto});}
    else copyR();
  }
  function downloadR(){
    const blob=new Blob([texto],{type:'text/plain;charset=utf-8'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`accion_${actionId}_edif${edif}_${new Date().toISOString().slice(0,10)}.txt`;
    a.click();
    URL.revokeObjectURL(url);
  }

  const bv=backView||'actionDetail';
  const bp=backParams||{actionId,edifStart:edif,edifEnd:edif};
  const b=BUILDINGS[parseInt(edif)];

  const el=h('div',{className:'fade-in'},[
    topbar(`${actionDef.icon} Informe — Edif. ${edif}`,bv,bp),
    h('div',{className:'card'},[
      h('div',{style:{fontSize:'0.82rem',color:'var(--tx-2)',marginBottom:'6px',fontWeight:'600'}},[
        `${actionDef.icon} ${actionDef.label} · Edificio ${edif} (Tipo ${b.tipo} · SA${b.sa})`
      ]),
      h('div',{className:'report-actions',style:{marginBottom:'10px'}},[
        h('button',{id:'btn-copy-ar',className:'btn btn-sm btn-ghost',onClick:copyR},['📋 Copiar']),
        h('button',{className:'btn btn-sm btn-ghost',onClick:shareR},['📤 Compartir']),
        h('button',{className:'btn btn-sm btn-ghost',onClick:downloadR},['⬇ Descargar .txt']),
      ]),
      h('pre',{className:'report-pre'},[texto]),
    ]),
    renderSyncBar(),
  ]);
  app().innerHTML='';
  app().appendChild(el);
}

function renderTypeTable(tipoCounts){
  const tbl=h('table',{className:'type-table'});
  // Sort entries by a logical order
  const order=['V1','V1a','V2','V3','V4','V5','V5a','V6','V7','V8','V9','PV1','PV2'];
  const sorted=Object.entries(tipoCounts).sort((a,b)=>{
    const ia=order.indexOf(a[0]),ib=order.indexOf(b[0]);
    return(ia===-1?99:ia)-(ib===-1?99:ib);
  });
  sorted.forEach(([tipo,{t,i}])=>{
    const row=h('tr',{},[
      h('td',{},[tipo]),
      h('td',{},[`${i}/${t}`]),
    ]);
    tbl.appendChild(row);
  });
  return tbl;
}

function getFloorStats(edif,floor){
  const e=parseInt(edif);
  let total=0,instaladas=0,pendientes=0,quitar=0,actionsPending=0,noInstalada=0;
  for(let p=0;p<4;p++){
    const tipo=getDeptType(e,floor,p);
    const dn=deptNum(floor,p);
    getDeptWindows(tipo).forEach(([code])=>{
      const w=DATA.windows[wKey(e,dn,code)];
      if(!w)return;
      total++;
      if(w.estado==='instalada')instaladas++;
      if(w.estado==='pendiente')pendientes++;
      if(w.estado==='quitar')quitar++;
      if(w.estado==='noInstalada')noInstalada++;
      Object.values(w.acciones).forEach(a=>{if(a.active&&!a.done)actionsPending++;});
    });
  }
  getCommonWindows(floor).forEach(([code])=>{
    const w=DATA.windows[wKey(e,`EC${floor}`,code)];
    if(!w)return;
    total++;
    if(w.estado==='instalada')instaladas++;
    if(w.estado==='pendiente')pendientes++;
    if(w.estado==='quitar')quitar++;
    if(w.estado==='noInstalada')noInstalada++;
    Object.values(w.acciones).forEach(a=>{if(a.active&&!a.done)actionsPending++;});
  });
  return{total,instaladas,pendientes,quitar,noInstalada,actionsPending};
}

function countBldgActions(edif,actionId){
  let pending=0,done=0;
  const e=parseInt(edif);
  for(let f=1;f<=5;f++){
    for(let p=0;p<4;p++){
      const tipo=getDeptType(e,f,p);
      const dn=deptNum(f,p);
      getDeptWindows(tipo).forEach(([code])=>{
        const w=DATA.windows[wKey(e,dn,code)];
        if(!w)return;
        if(w.acciones[actionId]?.active&&!w.acciones[actionId]?.done)pending++;
        if(w.acciones[actionId]?.done)done++;
      });
    }
    getCommonWindows(f).forEach(([code])=>{
      const w=DATA.windows[wKey(e,`EC${f}`,code)];
      if(!w)return;
      if(w.acciones[actionId]?.active&&!w.acciones[actionId]?.done)pending++;
      if(w.acciones[actionId]?.done)done++;
    });
  }
  return{pending,done};
}

function renderWindowDetail(key,code,loc,subtitle,backView,backParams){
  const w=DATA.windows[key];
  if(!w){app().innerHTML='<p>Ventana no encontrada</p>';return;}

  // Build sibling window list for prev/next nav
  const _parts=key.split('-');
  const _edifN=parseInt(_parts[0]);
  const _deptoStr=_parts[1];
  const _sibWins=(()=>{
    if(_deptoStr.startsWith('EC')){
      const f=parseInt(_deptoStr.replace('EC',''));
      return getCommonWindows(f).map(([c,l])=>({code:c,loc:l}));
    }
    const dn=parseInt(_deptoStr);
    const f=Math.floor(dn/100);
    const pi=(dn%100)-1;
    const tipo=getDeptType(_edifN,f,pi);
    return getDeptWindows(tipo).map(([c,l])=>({code:c,loc:l}));
  })();
  const _curIdx=_sibWins.findIndex(w=>w.code===code);
  const _prevWin=_curIdx>0?_sibWins[_curIdx-1]:null;
  const _nextWin=_curIdx<_sibWins.length-1?_sibWins[_curIdx+1]:null;

  const el=h('div',{className:'fade-in'},[
    topbar(`${code} · ${loc}`,backView,backParams),
    h('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'12px'}},[
      h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)',flex:1}},[subtitle]),
      (()=>{
        const deptoFromKey=key.split('-')[1];
        const ori=getOrientacion(deptoFromKey);
        return ori?h('span',{className:'badge badge-cyan',style:{fontSize:'0.68rem'}},[
          (ori==='Derecha'?'→':'←')+' '+ori
        ]):null;
      })(),
    ]),
    // ── Observaciones — ARRIBA ────────────────────
    (w.observaciones||isEditor())?h('div',{className:'card',style:{borderLeft:'3px solid var(--ac-orange)',background:w.observaciones?'var(--ac-orange-soft)':'var(--bg-2)',marginBottom:'var(--gap)'}},[
      h('div',{style:{fontWeight:'600',fontSize:'0.82rem',color:'var(--ac-orange)',marginBottom:'6px'}},[
        '💬 Observaciones'+(w.observaciones?'':' (sin comentarios)'),
      ]),
      isEditor()?h('textarea',{
        className:'obs-area',
        id:'obs-ta',
        placeholder:'Agregar observaciones...',
        style:{minHeight:'56px'},
        onBlur:(e)=>{
          if(e.target.value!==w.observaciones)
            updateWindow(key,'observaciones',e.target.value,'Observación actualizada');

      h('div',{style:{fontSize:'0.85rem',color:'var(--tx-1)',whiteSpace:'pre-wrap',lineHeight:'1.5'}},[w.observaciones]),
    ].filter(Boolean)):null,

    // Prev / Next navigation row
    (_prevWin||_nextWin)?h('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'10px'}},[
      _prevWin?h('button',{

          const prevKey=wKey(_edifN,_deptoStr,_prevWin.code);

            updateWindow(key,(w)=>{w.acciones[a.id].active=true;},null,`Acción ${a.label}: Activada`);
          } else if(!act.done){
            updateWindow(key,`acciones.${a.id}.done`,true,`Acción ${a.label}: Completada`);
          } else {
            updateWindow(key,(w)=>{w.acciones[a.id].done=false;},null,`Acción ${a.label}: Reabierta`);
          }
          renderWindowDetail(key,code,loc,subtitle,backView,backParams);
        }},[
          h('span',{className:'action-icon',style:{fontSize:'1.2rem'}},[a.icon]),
          h('span',{className:'action-label',style:{fontSize:'0.88rem',flex:1}},[
            a.label,
            isSuggested?h('span',{style:{fontSize:'0.65rem',color:`var(--ac-${a.color})`,marginLeft:'6px',fontWeight:'600'}},['↑ sugerida']):null,
            // Asignación visible debajo del label si tiene persona
            act.active&&act.assignedTo?h('div',{style:{fontSize:'0.7rem',color:'var(--tx-2)',marginTop:'2px'}},[
              '👤 ',h('span',{style:{color:(getPersona(act.assignedTo)?.color||'var(--tx-1)'),fontWeight:'600'}},[act.assignedTo])
            ]):null,
          ].filter(Boolean)),
          // Asignar chip (solo si activa y editor) — no auto-emergente, click explícito
          (act.active&&isEditor())?(()=>{
            const p=act.assignedTo?getPersona(act.assignedTo):null;
            return h('button',{
              className:'assign-chip'+(act.assignedTo?' assigned':''),
              style:p?{background:p.color,borderColor:p.color}:{},
              title:'Asignar persona',
              onClick:(ev)=>{
                ev.stopPropagation();
                showAssignPopup(key,a.id,()=>renderWindowDetail(key,code,loc,subtitle,backView,backParams));
              }
            },[act.assignedTo?'👤 '+act.assignedTo.split(' ')[0]:'👤 Asignar']);
          })():null,
          // Status indicator
          act.active?h('div',{
            className:'action-check'+(act.done?' done':''),
            style:{width:'32px',height:'32px',fontSize:'0.9rem',flexShrink:0},
          },[act.done?'✓':'⏳']):
          h('div',{className:'action-check',style:{width:'32px',height:'32px',borderStyle:'dashed',flexShrink:0}},['+']),
          // Remove button (only if active and editor)
          (act.active&&isEditor())?h('button',{
            className:'btn-icon',
            style:{fontSize:'0.85rem',color:'var(--ac-red)',padding:'4px 8px',marginLeft:'4px',flexShrink:0},
            title:'Quitar acción',
            onClick:(ev)=>{
              ev.stopPropagation();
              updateWindow(key,(w)=>{w.acciones[a.id].active=false;w.acciones[a.id].done=false;},null,`Acción ${a.label}: Quitada`);
              renderWindowDetail(key,code,loc,subtitle,backView,backParams);
            }
          },['✗']):null,
        ].filter(Boolean));
      }),
    ]),

    // Photo capture (v2.12: preview modal, comentario, gate editor, contador)
    (()=>{
      const MAX_FOTOS=5;
      const refresh=()=>renderWindowDetail(key,code,loc,subtitle,backView,backParams);
      return h('div',{className:'card'},[
        h('div',{style:{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'8px'}},[
          h('div',{style:{fontWeight:'600',fontSize:'0.85rem'}},[
            'Fotos ',
            h('span',{style:{color:'var(--tx-2)',fontWeight:'400',fontSize:'0.75rem'}},[`(${w.fotos.length}/${MAX_FOTOS})`])
          ]),
          isEditor()?h('label',{className:'btn btn-sm btn-ghost',style:{cursor:'pointer'}},[
            '📷 Capturar',
            h('input',{type:'file',accept:'image/*',capture:'environment',style:{display:'none'},
              onChange:(e)=>{
                const file=e.target.files[0];
                if(!file)return;
                const reader=new FileReader();
                reader.onload=(ev)=>{
                  const img=new Image();
                  img.onload=()=>{
                    try{
                      // Comprimir: máx 1024px (mejor calidad para zoom), JPEG 0.7
                      const MAX=1024;
                      let W=img.width,H=img.height;
                      if(W>MAX||H>MAX){const s=Math.min(MAX/W,MAX/H);W=Math.round(W*s);H=Math.round(H*s);}
                      const canvas=document.createElement('canvas');
                      canvas.width=W;canvas.height=H;
                      canvas.getContext('2d').drawImage(img,0,0,W,H);
                      const compressed=canvas.toDataURL('image/jpeg',0.7);
                      w.fotos.push({data:compressed,ts:ts(),comentario:''});
                      if(w.fotos.length>MAX_FOTOS){
                        w.fotos=w.fotos.slice(-MAX_FOTOS);
                        showSyncMsg('⚠ Reemplazada foto más antigua (límite '+MAX_FOTOS+')');
                      }
                      w.historial.unshift({t:ts(),cambio:'Foto agregada'});
                      dirtyKeys.add(key);
                      saveLocalNow();
                      refresh();
                    }catch(err){
                      alert('Error procesando foto: '+err.message);
                    }
                  };
                  img.onerror=()=>alert('No se pudo cargar la imagen');
                  img.src=ev.target.result;
                };
                reader.onerror=()=>alert('No se pudo leer el archivo');
                reader.readAsDataURL(file);
                e.target.value=''; // permite re-capturar misma foto
              }
            }),
          ]):null,
        ]),
        w.fotos.length?
          h('div',{style:{display:'flex',gap:'8px',overflowX:'auto',paddingBottom:'6px'}},
            w.fotos.map((f,i)=>
              h('div',{
                style:{position:'relative',flexShrink:0,cursor:'pointer'},
                onClick:()=>showPhotoPreview(key,i,refresh),
              },[
                h('img',{src:f.data,style:{width:'88px',height:'88px',objectFit:'cover',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',display:'block'}}),
                f.comentario?h('div',{style:{position:'absolute',bottom:'0',left:'0',right:'0',background:'rgba(0,0,0,0.6)',color:'#fff',fontSize:'0.6rem',padding:'2px 4px',borderRadius:'0 0 var(--radius-sm) var(--radius-sm)',whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},['💬 '+f.comentario]):null,
              ].filter(Boolean))
            )
          ):
          h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)',padding:'8px 0'}},[
            isEditor()?'Sin fotos. Toca 📷 Capturar para agregar.':'Sin fotos.'
          ]),
      ]);
    })(),

    // History
    h('div',{className:'card'},[
      h('div',{style:{fontWeight:'600',fontSize:'0.85rem',marginBottom:'8px'}},['Historial']),
      w.historial.length?
        h('div',{},w.historial.slice(0,15).map(hi=>
          h('div',{className:'hist-item'},[
            h('span',{className:'hist-time'},[hi.t+' ']),
            h('span',{},[hi.cambio]),
          ])
        )):
        h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)'}},['Sin cambios registrados']),
    ]),

    renderSyncBar(),
  ]);
  app().innerHTML='';
  app().appendChild(el);
  // Set textarea value
  const ta=$('#obs-ta');
  if(ta)ta.value=w.observaciones||'';
}

/* ============================================
   BULK CHANGE / CLEAR HELPERS
   ============================================ */
function showBulkModal(scope,params){
  if(!isEditor())return;
  const scopeLabel=scope==='building'?`Edificio ${params.edif}`:
                   scope==='dept'?`Depto ${params.depto} — Edif. ${params.edif}`:
                   `Piso ${params.floor} — Edif. ${params.edif}`;
  const overlay=h('div',{className:'overlay',onClick:closeOnBackdropClick},[
    h('div',{className:'modal'},[
      h('h3',{},['⚡ Cambio Masivo']),
      h('p',{style:{fontSize:'0.82rem',color:'var(--tx-2)',marginBottom:'12px'}},[scopeLabel]),
      h('p',{style:{fontSize:'0.8rem',fontWeight:'600',marginBottom:'8px'}},['Aplicar estado a todas las ventanas:']),
      h('div',{style:{display:'flex',flexDirection:'column',gap:'6px'}},[
        ...ESTADOS.map(e=>h('button',{
          className:'btn btn-ghost',style:{justifyContent:'flex-start',gap:'10px'},
          onClick:()=>{ applyBulkStatus(scope,params,e.id); overlay.remove(); render(); }
        },[e.sym+'  '+e.label])),
      ]),
      // By-floor option when scope is building
      scope==='building'?h('div',{},[
        h('div',{style:{margin:'12px 0 8px',paddingTop:'12px',borderTop:'1px solid var(--border)',fontSize:'0.8rem',fontWeight:'600'}},['O cambiar un piso específico:']),
        h('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap'}},
          [1,2,3,4,5].map(f=>h('button',{
            className:'btn btn-sm btn-ghost',
            onClick:()=>{ overlay.remove(); showBulkModal('floor',{edif:params.edif,floor:f}); }
          },['Piso '+f]))
        ),
      ]):null,
    ].filter(Boolean)),
  ]);
  document.body.appendChild(overlay);
}

function applyBulkStatus(scope,params,newEstado){
  if(!isEditor())return;
  const e=parseInt(params.edif);
  const label=`Cambio masivo → ${newEstado}`;
  function changeWin(key){
    if(!DATA.windows[key])return;
    DATA.windows[key].estado=newEstado;
    DATA.windows[key].historial.unshift({t:ts(),cambio:label});
    if(DATA.windows[key].historial.length>5)DATA.windows[key].historial=DATA.windows[key].historial.slice(0,5);
    dirtyKeys.add(key);
  }
  if(scope==='dept'){
    const depto=parseInt(params.depto);
    const fl=Math.floor(depto/100),pi=(depto%100)-1;
    getDeptWindows(getDeptType(e,fl,pi)).forEach(([c])=>changeWin(wKey(e,depto,c)));
  } else if(scope==='floor'){
    forEachWindowInFloor(e, params.floor, (_w, key)=>changeWin(key));
  } else if(scope==='building'){
    forEachWindowInBldg(e, (_w, key)=>changeWin(key));
  }
  saveLocalNow();
}

function confirmClearDept(edif,depto){
  if(!isEditor())return;
  if(!confirm(`¿Limpiar TODOS los datos del depto ${depto} (Edif. ${edif})?\n\nSe restablecen todas las ventanas a "No Instalada" y se borran deficiencias, acciones y observaciones.\n\nNo se puede deshacer.`))return;
  const e=parseInt(edif);
  const fl=Math.floor(depto/100),pi=(depto%100)-1;
  getDeptWindows(getDeptType(e,fl,pi)).forEach(([c])=>{const k=wKey(e,depto,c);DATA.windows[k]=newWindowRecord();dirtyKeys.add(k);});
  saveLocalNow();
  renderDept();
}

function confirmClearBuilding(edif){
  if(!isEditor())return;
  if(!confirm(`¿Limpiar TODOS los datos del Edificio ${edif}?\n\nSe restablecen todas las ventanas y espacios comunes.\n\nNo se puede deshacer.`))return;
  const e=parseInt(edif);
  forEachWindowInBldg(e, (_w, key)=>{ DATA.windows[key]=newWindowRecord(); dirtyKeys.add(key); });
  DATA.buildings[bKey(e)]={comment:'',accionesPendientes:{},stage:0};
  saveLocalNow();
  renderBuilding();
}

function renderBldgDefBreakdown(edif){
  const e=parseInt(edif);
  const counts={};
  DEFICIENCIES.forEach(d=>{counts[d.id]=0;});
  forEachWindowInBldg(e, w=>{
    if(!w)return;
    DEFICIENCIES.forEach(d=>{if(w.deficiencias[d.id])counts[d.id]++;});
  });
  const active=DEFICIENCIES.filter(d=>counts[d.id]>0);
  if(!active.length)return h('p',{style:{fontSize:'0.8rem',color:'var(--tx-2)'}},[' Sin inconformidades']);
  return h('div',{style:{display:'flex',flexDirection:'column',gap:'2px'}},
    active.map(d=>h('div',{style:{display:'flex',alignItems:'center',gap:'8px',fontSize:'0.82rem',padding:'5px 0',borderBottom:'1px solid var(--border)'}},[
      h('span',{},[d.icon]),
      h('span',{style:{flex:1}},[d.label]),
      h('span',{className:'badge badge-red'},[counts[d.id].toString()]),
    ]))
  );
}

// Collect all pending corrective actions with location info
function collectActions(edifStart,edifEnd){
  const items=[];
  for(let e=edifStart;e<=edifEnd;e++){
    for(let f=1;f<=5;f++){
      for(let p=0;p<4;p++){
        const tipo=getDeptType(e,f,p);
        const dn=deptNum(f,p);
        getDeptWindows(tipo).forEach(([code,loc])=>{
          const w=DATA.windows[wKey(e,dn,code)];
          if(!w)return;
          ACTIONS.forEach(a=>{
            const act=w.acciones[a.id];
            if(act&&act.active){
              items.push({edif:e,depto:dn,floor:f,code,loc,action:a,done:act.done,key:wKey(e,dn,code)});
            }
          });
        });
      }
      getCommonWindows(f).forEach(([code])=>{
        const w=DATA.windows[wKey(e,`EC${f}`,code)];
        if(!w)return;
        const loc=code==='PV1'?'Mampara Acceso':code==='PV2'?'Mampara Trasera':code==='V8'?'Ventanal Escalera':'Ventana Escalera';
        ACTIONS.forEach(a=>{
          const act=w.acciones[a.id];
          if(act&&act.active){
            items.push({edif:e,depto:`EC${f}`,floor:f,code,loc,action:a,done:act.done,key:wKey(e,`EC${f}`,code)});
          }
        });
      });
    }
  }
  return items;
}

// Auto-expand actions card — carga datos con requestIdleCallback para no bloquear render inicial
function renderLazyActionsCard(title,edifStart,edifEnd,showEdif,backView,backParams){
  const containerId='lac-'+edifStart+'-'+edifEnd;
  const card=h('div',{className:'card'},[
    h('div',{style:{fontWeight:'600',fontSize:'0.9rem',marginBottom:'10px'}},[title]),
    h('div',{id:containerId,style:{color:'var(--tx-2)',fontSize:'0.8rem',padding:'4px 0'}},['⏳ Cargando acciones...']),
  ]);
  // Auto-expand asíncrono para no bloquear el render de la vista
  const expand=()=>{
    const container=document.getElementById(containerId);
    if(!container)return;
    const items=collectActions(edifStart,edifEnd);
    container.innerHTML='';
    container.appendChild(renderActionsPanel(items,title,showEdif,backView||'dashboard',backParams||{}));
  };
  if(typeof requestIdleCallback!=='undefined'){
    requestIdleCallback(expand,{timeout:500});
  } else {
    setTimeout(expand,80);
  }
  return card;
}

// Render corrective actions panel (used in dashboard, SA, and building detail)
// backView/backParams: contexto de navegación para la vista actionDetail
function renderActionsPanel(items,title,showEdif=true,backView='dashboard',backParams={}){
  if(!items.length)return h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)',padding:'8px 0'}},['Sin acciones correctivas registradas']);
  // Group by action type
  const grouped={};
  ACTIONS.forEach(a=>{grouped[a.id]={action:a,pending:[],done:[]};});
  items.forEach(it=>{
    if(!grouped[it.action.id])return;
    if(it.done)grouped[it.action.id].done.push(it);
    else grouped[it.action.id].pending.push(it);
  });
  const totalPending=items.filter(i=>!i.done).length;
  const totalDone=items.filter(i=>i.done).length;

  return h('div',{},[
    h('div',{style:{display:'flex',gap:'8px',marginBottom:'10px',flexWrap:'wrap'}},[
      totalPending?h('span',{className:'badge badge-orange'},[totalPending+' pendientes']):null,
      totalDone?h('span',{className:'badge badge-green'},[totalDone+' completadas']):null,
      (!totalPending&&!totalDone)?h('span',{style:{fontSize:'0.8rem',color:'var(--tx-2)'}},[' Sin acciones activas']):null,
    ].filter(Boolean)),
    ...ACTIONS.map(a=>{
      const g=grouped[a.id];
      if(!g.pending.length&&!g.done.length)return null;
      // Para navigación correcta: si showEdif=false (single building), scope=ese edif
      const navEdifStart=showEdif?edifStart(items):items[0]?.edif||1;
      const navEdifEnd=showEdif?edifEnd(items):items[0]?.edif||1;
      return h('div',{style:{marginBottom:'10px'}},[
        h('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'8px 10px',borderBottom:'1px solid var(--border)',cursor:'pointer',borderRadius:'var(--radius-sm)',background:'var(--bg-2)',marginBottom:'4px'},
          onClick:()=>{
            const eStart=showEdif?(typeof edifStart==='function'?edifStart(items):1):items[0]?.edif||1;
            const eEnd=showEdif?(typeof edifEnd==='function'?edifEnd(items):34):items[0]?.edif||1;
            navigate('actionDetail',{actionId:a.id,edifStart:eStart,edifEnd:eEnd,backView,backParams});
          }
        },[
          h('span',{style:{fontSize:'1.3rem'}},[a.icon]),
          h('span',{style:{fontWeight:'600',fontSize:'0.9rem',flex:1}},[a.label]),
          g.pending.length?h('span',{className:'badge badge-orange',style:{fontSize:'0.82rem',padding:'4px 8px'}},[g.pending.length+' pend.']):null,
          g.done.length?h('span',{className:'badge badge-green',style:{fontSize:'0.82rem',padding:'4px 8px'}},[g.done.length+' ✓']):null,
          h('span',{style:{color:'var(--ac-blue)',fontSize:'1rem',marginLeft:'4px'}},['▶']),
        ]),
        // Preview de los primeros pendientes (agrupados por edif cuando showEdif=true)
        ...g.pending.slice(0,2).map(it=>
          h('div',{style:{fontSize:'0.77rem',color:'var(--tx-1)',padding:'2px 0 2px 28px',display:'flex',gap:'6px'}},[
            showEdif?h('span',{style:{fontWeight:'700',color:'var(--ac-blue)',minWidth:'24px'}},[`E${it.edif}`]):null,
            h('span',{style:{fontFamily:'var(--font-mono)',fontWeight:'600'}},[String(it.depto)]),
            h('span',{},[it.code]),
            h('span',{style:{color:'var(--tx-2)'}},[it.loc.slice(0,18)]),
          ].filter(Boolean))
        ),
        g.pending.length>2?h('div',{style:{fontSize:'0.72rem',color:'var(--ac-blue)',padding:'2px 0 2px 28px',cursor:'pointer'},
          onClick:()=>{
            const eStart=showEdif?1:items[0]?.edif||1;
            const eEnd=showEdif?34:items[0]?.edif||1;
            navigate('actionDetail',{actionId:a.id,edifStart:eStart,edifEnd:eEnd,backView,backParams});
          }
        },['... ver todas ('+g.pending.length+')']):null,
      ]);
    }).filter(Boolean),
  ]);

  // Helpers para resolver el scope de edif dinámicamente
  function edifStart(items){return Math.min(...items.map(i=>i.edif));}
  function edifEnd(items){return Math.max(...items.map(i=>i.edif));}
}

/* ============================================
   VIEW: ACTION DETAIL — per action type
   ============================================ */
function renderActionDetail(){
  const{actionId,edifStart,edifEnd,backView:passedBack,backParams:passedBackParams}=viewParams;
  const actionDef=ACTIONS.find(a=>a.id===actionId);
  if(!actionDef){app().innerHTML='<p>Acción no encontrada</p>';return;}

  // Back nav: usa el contexto pasado, o infiere
  const isSingleEdif=edifStart===edifEnd;
  const backView=passedBack||(isSingleEdif?'building':'dashboard');
  const backParams=passedBackParams||(isSingleEdif?{edif:edifStart}:{});
  const scopeLabel=isSingleEdif?`Edif. ${edifStart}`:
    (edifStart===1&&edifEnd===34?'Proyecto global':`SA (Edif. ${edifStart}–${edifEnd})`);

  // Collect all items for this action
  const allItems=[];
  for(let e=edifStart;e<=edifEnd;e++){
    for(let f=1;f<=5;f++){
      for(let p=0;p<4;p++){
        const tipo=getDeptType(e,f,p);
        const dn=deptNum(f,p);
        getDeptWindows(tipo).forEach(([code,loc])=>{
          const k=wKey(e,dn,code);
          const w=DATA.windows[k];
          if(!w)return;
          const act=w.acciones[actionId];
          if(act&&act.active){
            const defCnt=Object.values(w.deficiencias).filter(Boolean).length;
            allItems.push({edif:e,depto:dn,floor:f,code,loc,done:act.done,key:k,defCnt,obs:w.observaciones||''});
          }
        });
      }
      getCommonWindows(f).forEach(([code])=>{
        const k=wKey(e,`EC${f}`,code);
        const w=DATA.windows[k];
        if(!w)return;
        const loc=code==='PV1'?'Mampara Acceso':code==='PV2'?'Mampara Trasera':code==='V8'?'Ventanal Escalera':'Ventana Escalera';
        const act=w.acciones[actionId];
        if(act&&act.active){
          const defCnt=Object.values(w.deficiencias).filter(Boolean).length;
          allItems.push({edif:e,depto:`EC${f}`,floor:f,code,loc,done:act.done,key:k,defCnt,obs:w.observaciones||''});
        }
      });
    }
  }

  const pending=allItems.filter(i=>!i.done);
  const done=allItems.filter(i=>i.done);

  // renderActionItem — ítem NO desaparece al marcar: solo actualiza el DOM del ítem
  function renderActionItem(it,container){
    const w=DATA.windows[it.key];
    const itemEl=document.createElement('div');
    itemEl.style.cssText='padding:11px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;transition:background 0.2s;';
    if(it.done)itemEl.style.background='var(--ac-green-soft)';

    // Circle toggle
    const circle=document.createElement('div');
    circle.style.cssText=`width:36px;height:36px;border-radius:50%;border:2px solid ${it.done?'var(--ac-green)':'var(--border)'};display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${it.done?'var(--ac-green)':'transparent'};color:${it.done?'#fff':'var(--tx-2)'};font-size:0.9rem;${isEditor()?'cursor:pointer;':''};user-select:none;`;
    circle.textContent=it.done?'✓':'';
    if(isEditor()){
      circle.addEventListener('click',()=>{
        if(!w||!w.acciones[actionId])return;
        w.acciones[actionId].done=!w.acciones[actionId].done;
        it.done=w.acciones[actionId].done;
        w.historial.unshift({t:ts(),cambio:`Acción ${actionDef.label}: ${it.done?'Completada':'Reabierta'}`});
        saveLocal();
        // Actualizar solo este ítem visualmente (no re-render completo)
        itemEl.style.background=it.done?'var(--ac-green-soft)':'transparent';
        circle.style.background=it.done?'var(--ac-green)':'transparent';
        circle.style.borderColor=it.done?'var(--ac-green)':'var(--border)';
        circle.style.color=it.done?'#fff':'var(--tx-2)';
        circle.textContent=it.done?'✓':'';
        statPend.textContent=allItems.filter(i=>!i.done).length.toString();
        statDone.textContent=allItems.filter(i=>i.done).length.toString();
      });
    }
    itemEl.appendChild(circle);

    // Info
    const info=h('div',{style:{flex:'1',minWidth:'0'}},[
      h('div',{style:{display:'flex',alignItems:'center',gap:'6px',flexWrap:'wrap'}},[
        !isSingleEdif?h('span',{style:{fontWeight:'700',fontSize:'0.82rem',color:'var(--ac-blue)'}},[`E${it.edif}`]):null,
        h('span',{style:{fontWeight:'600',fontFamily:'var(--font-mono)',fontSize:'0.85rem'}},[String(it.depto)]),
        h('span',{style:{fontFamily:'var(--font-mono)',fontSize:'0.82rem',color:'var(--tx-2)'}},[it.code]),
        h('span',{style:{fontSize:'0.78rem',color:'var(--tx-2)'}},[it.loc]),
      ].filter(Boolean)),
      it.obs?h('div',{style:{fontSize:'0.72rem',color:'var(--tx-2)',marginTop:'2px'}},[it.obs.slice(0,50)+(it.obs.length>50?'…':'')]):null,
    ].filter(Boolean));
    itemEl.appendChild(info);

    // Ir al detalle de ventana
    const navBtn=h('button',{className:'btn-icon',style:{color:'var(--ac-blue)',fontSize:'1.1rem',flexShrink:0,padding:'8px'},
      onClick:()=>{
        if(it.depto.toString().startsWith('EC')){
          const fl=parseInt(it.depto.replace('EC',''));
          navigate('common',{edif:it.edif,floor:fl,code:it.code,backView:'actionDetail',backParams:viewParams});
        } else {
          navigate('window',{edif:it.edif,depto:parseInt(it.depto),code:it.code,loc:it.loc,backView:'actionDetail',backParams:viewParams});
        }
      }
    },['▶']);
    itemEl.appendChild(navBtn);
    return itemEl;
  }

  // Bulk complete/reopen
  function bulkToggle(items,setDone){
    if(!isEditor())return;
    items.forEach(it=>{
      const w=DATA.windows[it.key];
      if(w&&w.acciones[actionId]){
        w.acciones[actionId].done=setDone;
        w.historial.unshift({t:ts(),cambio:`Acción ${actionDef.label}: ${setDone?'Completada':'Reabierta'} (masivo)`});
      }
    });
    saveLocalNow();
    renderActionDetail();
  }

  // Agrupar por edificio cuando scope multi-edif
  function renderGroupedByEdif(items){
    if(isSingleEdif){
      const wrap=h('div',{className:'card',style:{padding:0}});
      items.forEach(it=>wrap.appendChild(renderActionItem(it)));
      return wrap;
    }
    // Agrupar por edif
    const byEdif={};
    items.forEach(it=>{
      if(!byEdif[it.edif])byEdif[it.edif]=[];
      byEdif[it.edif].push(it);
    });
    const wrap=h('div',{});
    Object.entries(byEdif).sort((a,b)=>parseInt(a[0])-parseInt(b[0])).forEach(([edif,edifItems])=>{
      const isExpanded={v:true};
      const edifCard=h('div',{className:'card',style:{padding:0,marginBottom:'8px'}});
      const edifHdr=h('div',{style:{
        padding:'10px 14px',fontWeight:'700',fontSize:'0.88rem',
        display:'flex',alignItems:'center',gap:'8px',cursor:'pointer',
        background:'var(--ac-blue-soft)',borderRadius:'var(--radius) var(--radius) 0 0',
        color:'var(--ac-blue)',userSelect:'none'
      }},[
        h('span',{style:{flex:1}},['Edif. '+edif]),
        h('span',{className:'badge badge-orange',style:{fontSize:'0.75rem'}},[edifItems.filter(i=>!i.done).length+' pend.']),
        edifItems.filter(i=>i.done).length?h('span',{className:'badge badge-green',style:{fontSize:'0.75rem'}},[edifItems.filter(i=>i.done).length+' ✓']):null,
        h('span',{style:{fontSize:'0.9rem'}},['▾']),
      ].filter(Boolean));
      const edifBody=h('div',{});
      edifItems.forEach(it=>edifBody.appendChild(renderActionItem(it)));
      edifHdr.addEventListener('click',()=>{
        isExpanded.v=!isExpanded.v;
        edifBody.style.display=isExpanded.v?'block':'none';
        edifHdr.lastChild.textContent=isExpanded.v?'▾':'▸';
      });
      edifCard.appendChild(edifHdr);
      edifCard.appendChild(edifBody);
      wrap.appendChild(edifCard);
    });
    return wrap;
  }

  // Construir stats boxes (referencias guardadas para actualizar inline)
  let statPend,statDone;
  const statsRow=h('div',{className:'stats-row'},[]);
  const makeStatBox=(val,label)=>{
    const b=statBox(val,label);
    return b;
  };
  const pendStatEl=h('div',{className:'stat-box'},[
    (statPend=h('div',{className:'stat-val'},[pending.length.toString()])),
    h('div',{className:'stat-label'},['Pendientes']),
  ]);
  const doneStatEl=h('div',{className:'stat-box'},[
    (statDone=h('div',{className:'stat-val'},[done.length.toString()])),
    h('div',{className:'stat-label'},['Completadas']),
  ]);
  const totalStatEl=statBox(allItems.length.toString(),'Total');
  statsRow.appendChild(pendStatEl);
  statsRow.appendChild(doneStatEl);
  statsRow.appendChild(totalStatEl);

  const el=h('div',{className:'fade-in'},[
    topbar(`${actionDef.icon} ${actionDef.label}`,backView,backParams),
    h('div',{style:{fontSize:'0.82rem',color:'var(--tx-2)',marginBottom:'12px'}},[scopeLabel+' — '+allItems.length+' registros']),
    statsRow,

    // Botón informe (solo cuando scope = edificio único)
    isSingleEdif&&allItems.length?h('button',{
      className:'btn btn-ghost',
      style:{width:'100%',justifyContent:'center',marginBottom:'var(--gap)',fontSize:'0.85rem'},
      onClick:()=>navigate('actionReport',{edif:edifStart,actionId,backView:'actionDetail',backParams:viewParams})
    },['📋 Ver informe detallado — Edif. '+edifStart]):null,

    // Bulk actions
    isEditor()&&allItems.length?h('div',{style:{display:'flex',gap:'8px',marginBottom:'var(--gap)',flexWrap:'wrap'}},[
      pending.length?h('button',{className:'btn btn-sm btn-primary',onClick:()=>{
        if(confirm(`¿Marcar las ${pending.length} acciones pendientes como completadas?`))bulkToggle(pending,true);
      }},['✓ Completar todas ('+pending.length+')']):null,
      done.length?h('button',{className:'btn btn-sm btn-ghost',onClick:()=>{
        if(confirm(`¿Reabrir las ${done.length} acciones completadas?`))bulkToggle(done,false);
      }},['↩ Reabrir ('+done.length+')']):null,
    ].filter(Boolean)):null,

    // Lista pendientes — ítems NO desaparecen al marcar (toggle inline)
    pending.length?h('div',{},[
      h('div',{style:{padding:'8px 12px',fontWeight:'600',fontSize:'0.85rem',color:'var(--ac-orange)',marginBottom:'4px',display:'flex',alignItems:'center',gap:'8px'}},[
        h('span',{style:{flex:1}},['⏳ Pendientes']),
        h('span',{className:'badge badge-orange'},[pending.length.toString()]),
      ]),
      renderGroupedByEdif(pending),
    ]):null,

    // Lista completadas — colapsable, visible
    done.length?h('div',{},[
      h('div',{style:{padding:'8px 12px',fontWeight:'600',fontSize:'0.85rem',color:'var(--ac-green)',marginBottom:'4px',display:'flex',alignItems:'center',gap:'8px',cursor:'pointer'},
        onClick:(ev)=>{
          const next=ev.currentTarget.nextElementSibling;
          if(next)next.style.display=next.style.display==='none'?'block':'none';
          ev.currentTarget.lastChild.textContent=next&&next.style.display!=='none'?'▾':'▸';
        }
      },[
        h('span',{style:{flex:1}},['✓ Completadas']),
        h('span',{className:'badge badge-green'},[done.length.toString()]),
        h('span',{style:{fontSize:'0.9rem'}},['▾']),
      ]),
      h('div',{},[renderGroupedByEdif(done)]),
    ]):null,

    !allItems.length?h('div',{className:'card'},[
      h('div',{style:{color:'var(--tx-2)',fontSize:'0.85rem',padding:'8px 0',textAlign:'center'}},['Sin registros de esta acción']),
    ]):null,

    renderSyncBar(),
  ].filter(Boolean));
  app().innerHTML='';
  app().appendChild(el);
}

function renderBldgIssueMap(edif){
  const e=parseInt(edif);
  const items=[];
  for(let f=1;f<=5;f++){
    for(let p=0;p<4;p++){
      const dn=deptNum(f,p);
      const st=getDeptStats(e,dn);
      if(st.defCount>0||st.actionsPending>0){
        items.push(h('div',{
          style:{padding:'8px 10px',borderBottom:'1px solid var(--border)',cursor:'pointer',fontSize:'0.82rem'},
          onClick:()=>navigate('dept',{edif:e,depto:dn})
        },[
          h('div',{style:{display:'flex',alignItems:'center',gap:'8px'}},[
            h('span',{style:{fontWeight:'700',fontFamily:'var(--font-mono)',minWidth:'40px'}},[dn.toString()]),
            h('span',{style:{color:'var(--tx-2)'}},[st.tipo]),
            h('span',{style:{flex:1}}),
            st.defCount?h('span',{className:'badge badge-red'},[st.defCount+' def']):null,
            st.actionsPending?h('span',{className:'badge badge-orange'},[st.actionsPending+' acc']):null,
          ]),
          st.defDetails.length?h('div',{style:{marginTop:'3px',paddingLeft:'48px',display:'flex',gap:'3px',flexWrap:'wrap'}},
            st.defDetails.map(({code,def})=>

  if(!items.length)return[h('div',{style:{fontSize:'0.8rem',color:'var(--tx-2)',padding:'4px 0'}},['Sin incidencias registradas'])];

function showSearchModal(){
  const overlay=h('div',{className:'overlay',onClick:closeOnBackdropClick},[
    h('div',{className:'modal',style:{maxHeight:'90vh',overflowY:'auto',width:'min(95vw,520px)'}},[
      h('div',{style:{display:'flex',gap:'8px',alignItems:'center',marginBottom:'12px'}},[
        h('span',{style:{fontSize:'1.1rem'}},['🔍']),
        h('input',{
          id:'search-input',type:'text',autocomplete:'off',
          placeholder:'V8, 301, edif 5, 5-301-V8...',
          style:{flex:1,padding:'10px 12px',fontSize:'0.95rem',border:'1px solid var(--border)',borderRadius:'var(--radius-sm)',background:'var(--bg-2)',color:'var(--tx-1)'},
          onInput:(e)=>renderResults(e.target.value),
          onKeydown:(e)=>{if(e.key==='Escape')overlay.remove();},
        }),
        h('button',{className:'btn btn-sm btn-ghost',style:{padding:'8px 10px'},onClick:()=>overlay.remove()},['✕']),
      ]),
      h('div',{id:'search-results',style:{display:'flex',flexDirection:'column',gap:'4px'}},[
        h('p',{style:{fontSize:'0.82rem',color:'var(--tx-2)',padding:'8px 4px'}},['Tipea código ventana, depto, edificio o key…']),
      ]),
    ]),
  ]);
  document.body.appendChild(overlay);
  setTimeout(()=>{const inp=$('#search-input',overlay);if(inp)inp.focus();},50);

  function renderResults(q){
    const cont=$('#search-results',overlay);
    if(!cont)return;
    cont.innerHTML='';
    if(!q.trim()){
      cont.appendChild(h('p',{style:{fontSize:'0.82rem',color:'var(--tx-2)',padding:'8px 4px'}},['Tipea código ventana, depto, edificio o key…']));
      return;
    }
    const results=searchWindows(q);
    if(!results.length){
      cont.appendChild(h('p',{style:{fontSize:'0.82rem',color:'var(--tx-2)',padding:'8px 4px'}},['Sin resultados para "'+q+'"']));
      return;
    }
    cont.appendChild(h('p',{style:{fontSize:'0.72rem',color:'var(--tx-2)',padding:'2px 4px 6px'}},[results.length+(results.length===30?'+ resultados (refina la búsqueda)':' resultado'+(results.length>1?'s':''))]));
    results.forEach(r=>{
      const w=DATA.windows[r.key];
      const estado=(w&&w.estado)||'noInstalada';
      const estObj=ESTADOS.find(e=>e.id===estado);
      const pendAcc=w?ACTIONS.find(a=>w.acciones[a.id]?.active&&!w.acciones[a.id]?.done):null;
      cont.appendChild(h('button',{
        className:'btn btn-ghost',
        style:{justifyContent:'flex-start',gap:'10px',padding:'10px 12px',fontSize:'0.85rem',textAlign:'left',width:'100%'},
        onClick:()=>{
          overlay.remove();
          navigate('window',{edif:String(r.edif),depto:r.depto,code:r.code,loc:r.loc});
        },
      },[
        h('span',{style:{fontSize:'1.05rem',width:'24px',textAlign:'center'}},[estObj?estObj.sym:'?']),
        h('span',{style:{fontFamily:'var(--font-mono)',fontWeight:'700',minWidth:'52px'}},[r.code]),
        h('span',{style:{color:'var(--tx-2)',fontSize:'0.78rem',minWidth:'56px'}},[String(r.depto)]),
        h('span',{style:{color:'var(--tx-2)',fontSize:'0.78rem',flex:1,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}},['Edif. '+r.edif+(r.loc?' · '+r.loc:'')]),
        pendAcc?h('span',{style:{fontSize:'0.95rem'},title:pendAcc.label},[pendAcc.icon]):null,
      ].filter(Boolean)));
    });
  }
}

// Modal de asignación de persona a una acción
function showAssignPopup(winKey, accionId, onUpdate){
  const w=DATA.windows[winKey];
  if(!w)return;
  const act=w.acciones[accionId];
  const accionDef=ACTIONS.find(a=>a.id===accionId);
  if(!act||!accionDef)return;
  const overlay=h('div',{className:'overlay',onClick:closeOnBackdropClick},[]);

  function draw(){
    overlay.innerHTML='';
    const personas=DATA.personas||[];
    const current=act.assignedTo||null;
    overlay.appendChild(h('div',{className:'modal',style:{maxHeight:'85vh',overflowY:'auto'}},[
      h('div',{style:{marginBottom:'10px'}},[
        h('div',{style:{fontSize:'0.78rem',color:'var(--tx-2)'}},['Asignar acción']),
        h('div',{style:{fontWeight:'600',fontSize:'0.95rem'}},[accionDef.icon+' '+accionDef.label]),
      ]),
      // Lista personas
      personas.length?h('div',{style:{display:'flex',flexDirection:'column',gap:'4px',marginBottom:'10px'}},
        personas.map(p=>{
          const isCurrent=p.nombre===current;
          return h('button',{
            className:'btn btn-ghost',
            style:{justifyContent:'flex-start',gap:'10px',padding:'10px',background:isCurrent?p.color+'33':'var(--bg-2)',border:isCurrent?'2px solid '+p.color:'1px solid var(--border)'},
            onClick:()=>{
              if(isCurrent){
                updateWindow(winKey,(ww)=>{delete ww.acciones[accionId].assignedTo;},null,`${accionDef.label}: desasignada`);
              } else {
                updateWindow(winKey,(ww)=>{ww.acciones[accionId].assignedTo=p.nombre;},null,`${accionDef.label}: asignada a ${p.nombre}`);
              }
              overlay.remove();
              if(onUpdate)onUpdate();
            }
          },[
            h('span',{className:'persona-dot',style:{background:p.color}}),
            h('span',{style:{flex:1,fontSize:'0.88rem',fontWeight:isCurrent?'600':'400'}},[p.nombre]),
            p.rol?h('span',{style:{fontSize:'0.7rem',color:'var(--tx-2)'}},[p.rol]):null,
            isCurrent?h('span',{style:{fontSize:'0.85rem'}},['✓']):null,
          ].filter(Boolean));
        })
      ):h('div',{style:{padding:'12px',color:'var(--tx-2)',fontSize:'0.85rem',textAlign:'center'}},['Sin personas. Agrega una abajo.']),
      // Agregar nueva persona
      h('div',{style:{borderTop:'1px solid var(--border)',paddingTop:'10px',marginTop:'4px'}},[
        h('div',{style:{fontSize:'0.78rem',color:'var(--tx-2)',marginBottom:'6px',fontWeight:'600'}},['+ Agregar persona']),
        h('div',{style:{display:'flex',gap:'6px',flexDirection:'column'}},[
          h('input',{id:'new-persona-nombre',type:'text',placeholder:'Nombre',
            style:{padding:'8px 10px',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',background:'var(--bg-2)',color:'var(--tx-1)',fontSize:'0.85rem'}}),
          h('input',{id:'new-persona-rol',type:'text',placeholder:'Rol (opcional, ej: Vidriero)',
            style:{padding:'8px 10px',borderRadius:'var(--radius-sm)',border:'1px solid var(--border)',background:'var(--bg-2)',color:'var(--tx-1)',fontSize:'0.85rem'}}),
          h('button',{className:'btn btn-sm btn-primary',onClick:()=>{
            const nm=$('#new-persona-nombre',overlay)?.value||'';
            const rol=$('#new-persona-rol',overlay)?.value||'';
            if(!nm.trim())return;
            addPersona(nm,rol);
            draw();
          }},['+ Agregar y asignar después']),
        ]),
      ]),
      h('div',{style:{display:'flex',gap:'8px',marginTop:'12px'}},[
        current?h('button',{className:'btn btn-sm btn-ghost',style:{flex:1,color:'var(--ac-red)'},onClick:()=>{
          updateWindow(winKey,(ww)=>{delete ww.acciones[accionId].assignedTo;},null,`${accionDef.label}: desasignada`);
          overlay.remove();
          if(onUpdate)onUpdate();
        }},['🗑 Quitar asignación']):null,
        h('button',{className:'btn btn-sm btn-ghost',style:{flex:1},onClick:()=>overlay.remove()},['Cerrar']),
      ].filter(Boolean)),
    ]));
  }
  draw();
  document.body.appendChild(overlay);
}

let syncing=false;

function fetchWithTimeout(url,opts={},timeoutMs=30000){
  return Promise.race([
    fetch(url,opts),
    new Promise((_,reject)=>setTimeout(()=>reject(new Error('Timeout: el servidor no respondió en '+Math.round(timeoutMs/1000)+'s')),timeoutMs))
  ]);
}

// ---- BACKUP SNAPSHOTS (auto al sync, manual restore) ----
const BACKUP_PREFIX='vc2_bak_';
const MAX_BACKUPS=3;
function saveBackupSnapshot(){
  try{
    // Copia profunda sin fotos (ahorrar quota)
    const safe={ts:ts(),version:'v2.12',data:JSON.parse(JSON.stringify(DATA))};
    Object.values(safe.data.windows||{}).forEach(w=>{if(w&&w.fotos)w.fotos=[];});
    // Rotar: borrar más antiguos si excedemos MAX_BACKUPS
    const keys=Object.keys(localStorage).filter(k=>k.startsWith(BACKUP_PREFIX)).sort();
    while(keys.length>=MAX_BACKUPS) localStorage.removeItem(keys.shift());
    localStorage.setItem(BACKUP_PREFIX+Date.now(),JSON.stringify(safe));
    if(DEBUG)console.log('[VC] Backup snapshot guardado');
  }catch(e){if(DEBUG)console.warn('[VC] Backup falló:',e.message);}
}
function listBackups(){
  return Object.keys(localStorage)
    .filter(k=>k.startsWith(BACKUP_PREFIX))
    .sort().reverse()  // más reciente primero
    .map(k=>{try{const v=JSON.parse(localStorage.getItem(k));return{key:k,ts:v.ts,version:v.version,size:localStorage.getItem(k).length};}catch(e){return null;}})
    .filter(Boolean);
}
function restoreBackup(key){
  if(!confirm('¿Restaurar este backup?\n\nSe sobreescribirán TODOS los datos locales actuales. Las fotos no se restauran (no se incluyen en backup por tamaño).\n\nNo se puede deshacer.'))return;
  try{
    const snap=JSON.parse(localStorage.getItem(key));
    if(!snap||!snap.data)throw new Error('Backup corrupto');
    DATA=snap.data;
    saveLocalNow();
    _searchIndex=null;
    alert('Backup restaurado: '+snap.ts+'\n\nLa app se recargará.');
    location.reload();
  }catch(e){alert('Error restaurando: '+e.message);}
}
